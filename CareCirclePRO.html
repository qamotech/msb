<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CareCircle · Family Care Hub for Grams</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;

      /* Primary Warm Palette */
      --teal: #0F6B5C;
      --teal-light: #168a77;
      --teal-soft: #e3f2ef;
      --coral: #E8896B;
      --coral-soft: #fdf0ec;
      --gold: #D9A441;
      --gold-soft: #fcf6e8;
      --blue: #3B82F6;
      --blue-soft: #eff6ff;
      --pink: #EC4899;
      --pink-soft: #fdf2f8;
      --purple: #8B5CF6;
      --purple-soft: #f5f3ff;
      --red: #DC2626;
      --red-soft: #fee2e2;
      --green: #10B981;
      --green-soft: #ecfdf5;

      /* Neutrals - Light Theme */
      --bg: #FAF7F2;
      --bg2: #F2ECE1;
      --card: #FFFFFF;
      --card-hover: #FCFAF7;
      --text: #232726;
      --muted: #6B7280;
      --line: #E5DFC9;
      --nav-bg: rgba(255, 255, 255, 0.88);
      --shadow-sm: 0 2px 8px rgba(35, 39, 38, 0.04);
      --shadow-md: 0 8px 24px rgba(35, 39, 38, 0.08);
      --shadow-lg: 0 16px 40px rgba(35, 39, 38, 0.12);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --sidebar-w: 270px;
    }

    [data-theme="dark"] {
      --bg: #121816;
      --bg2: #1A2220;
      --card: #1F2A27;
      --card-hover: #263330;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --line: #2E3E39;
      --nav-bg: rgba(31, 42, 39, 0.88);
      --teal-soft: #18332d;
      --coral-soft: #38241e;
      --gold-soft: #382d18;
      --blue-soft: #18283e;
      --pink-soft: #381c2b;
      --purple-soft: #281d3d;
      --red-soft: #3d1b1b;
      --green-soft: #173327;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    /* Accessibility Large Text Mode */
    body.text-lg { font-size: 18px; }
    body.text-lg .btn { font-size: 1rem; padding: 12px 20px; }
    body.text-lg h1 { font-size: 2.2rem; }
    body.text-lg h2 { font-size: 1.8rem; }
    body.text-lg h3 { font-size: 1.4rem; }

    /* #13: disable animations for users with reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. BASE & RESET
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      transition: background-color .3s ease, color .3s ease;
    }

    h1, h2, h3, h4, .serif { font-family: var(--font-serif); font-weight: 600; line-height: 1.25; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: 0.95rem; }

    /* ==========================================================================
       3. LAYOUT & SIDEBAR NAVIGATION
       ========================================================================== */
    .app-shell { display: flex; width: 100%; min-height: 100vh; }
    
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--line);
      position: fixed;
      top: 0; left: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      z-index: 90;
      transition: transform .3s ease;
      backdrop-filter: blur(12px);
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--teal), #2A9D8F);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--teal) 30%, transparent);
    }
    .brand-info b { font-family: var(--font-serif); font-size: 1.25rem; color: var(--teal); display: block; }
    .brand-info span { font-size: 0.78rem; color: var(--muted); font-weight: 500; }

    .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s ease;
      text-align: left;
    }
    .nav-btn:hover { background: var(--bg); color: var(--text); transform: translateX(3px); }
    .nav-btn.active {
      background: var(--teal);
      color: #FFFFFF;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--teal) 35%, transparent);
    }
    .nav-btn .ic { font-size: 1.2rem; width: 24px; text-align: center; }
    .nav-btn .badge-pill {
      margin-left: auto;
      padding: 2px 8px;
      font-size: 0.72rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      font-weight: 700;
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Main view area */
    .main-viewport {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 36px 48px 120px;
      max-width: 1300px;
      min-width: 0;
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; animation: viewIn .35s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       4. GLOBAL ATOMS, CARDS, BUTTONS & TAGS
       ========================================================================== */
    .view-head { margin-bottom: 24px; }
    .view-head h1 { font-size: 2rem; color: var(--text); margin-bottom: 4px; }
    .view-head p { color: var(--muted); font-size: 0.98rem; }

    .sec-title { font-size: 1.35rem; margin: 30px 0 16px; color: var(--text); display: flex; align-items: center; justify-content: space-between; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: all .25s ease;
      position: relative;
    }
    .card.hover:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--teal) 35%, var(--line));
    }

    .grid { display: grid; gap: 18px; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--teal);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-md);
      transition: all .2s ease;
      border: 1px solid transparent;
    }
    .btn:hover { background: var(--teal-light); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 107, 92, 0.2); }
    .btn:active { transform: translateY(1px); }
    .btn.sm { padding: 6px 12px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn.ghost { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
    .btn.ghost:hover { background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal); }
    .btn.ghost2 { background: var(--bg2); color: var(--text); }
    .btn.ghost2:hover { background: var(--line); }
    .btn.danger { background: var(--red); color: white; }
    .btn.danger:hover { background: #b91c1c; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 999px;
      text-transform: capitalize;
      letter-spacing: .02em;
    }
    .tag.teal { background: var(--teal-soft); color: var(--teal); }
    .tag.gold { background: var(--gold-soft); color: #B45309; }
    .tag.coral { background: var(--coral-soft); color: #C2410C; }
    .tag.blue { background: var(--blue-soft); color: #1D4ED8; }
    .tag.red { background: var(--red-soft); color: #B91C1C; }
    .tag.green { background: var(--green-soft); color: #047857; }
    .tag.pink { background: var(--pink-soft); color: #BE185D; }
    .tag.purple { background: var(--purple-soft); color: #6D28D9; }

    .muted { color: var(--muted); }
    .small { font-size: 0.85rem; }

    .av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .warnbar {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--red-soft);
      border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
      color: #7f1d1d;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 14px;
    }
    [data-theme="dark"] .warnbar { color: #fca5a5; }
    .warnbar.amber {
      background: var(--gold-soft);
      border-color: color-mix(in srgb, var(--gold) 35%, transparent);
      color: #92400e;
    }
    [data-theme="dark"] .warnbar.amber { color: #fde68a; }

    /* ==========================================================================
       5. DASHBOARD SPECIFIC COMPONENTS
       ========================================================================== */
    .hero-profile {
      display: flex;
      align-items: center;
      gap: 22px;
      background: linear-gradient(135deg, var(--card), color-mix(in srgb, var(--teal-soft) 40%, var(--card)));
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 28px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid var(--card);
      box-shadow: var(--shadow-md);
      background: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80') center/cover no-repeat;
      flex-shrink: 0;
    }
    .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

    .stat-box {
      text-align: center;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stat-box .num {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--teal);
      line-height: 1.1;
      margin: 4px 0;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .contact-row:last-child { border-bottom: none; }

    /* ==========================================================================
       6. MEDICATIONS VIEW STYLES
       ========================================================================== */
    .slot {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px;
    }
    .slot-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .dose-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      transition: all .2s ease;
    }
    .dose-row.done { opacity: 0.65; background: var(--teal-soft); }
    .dose-row .pill-ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .dose-row .info { flex: 1; min-width: 0; }
    .dose-row .info b { display: block; font-size: 0.92rem; }
    .dose-row .info span { font-size: 0.78rem; color: var(--muted); }

    .check {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      color: transparent;
      font-size: 1.1rem;
      font-weight: 800;
      transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .check:hover { border-color: var(--teal); transform: scale(1.08); }
    .check.done { background: var(--teal); border-color: var(--teal); color: white; }

    .med-card { display: flex; align-items: flex-start; gap: 14px; padding: 18px; }
    .med-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .exp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .exp.ok { background: var(--green-soft); color: #047857; }
    .exp.soon { background: var(--gold-soft); color: #B45309; }
    .exp.bad { background: var(--red-soft); color: #B91C1C; }

    /* Heatmap */
    .hm {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 4px;
      margin: 14px 0 10px;
    }
    .hm-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      transition: transform .15s;
      cursor: pointer;
    }
    .hm-cell:hover { transform: scale(1.3); z-index: 2; }
    .hm-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      justify-content: flex-end;
    }
    .hm-legend-cell { width: 12px; height: 12px; border-radius: 3px; }

    /* ==========================================================================
       7. APPOINTMENTS VIEW & CALENDAR
       ========================================================================== */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-dow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell {
      min-height: 52px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--card);
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all .15s;
    }
    .cal-cell:hover { border-color: var(--teal); background: var(--teal-soft); }
    .cal-cell.today { border-color: var(--teal); border-width: 2px; font-weight: 800; }
    .cal-cell.out { opacity: 0.35; }
    .cal-cell .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .dot.cardio { background: var(--red); }
    .dot.eye { background: var(--blue); }
    .dot.primary { background: var(--teal); }
    .dot.dental { background: var(--gold); }
    .dot.other { background: var(--purple); }

    .appt-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
    }
    .appt-date {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      line-height: 1;
    }
    .appt-date .mo { font-size: 0.68rem; text-transform: uppercase; letter-spacing: .05em; }
    .appt-date .dd { font-size: 1.3rem; margin-top: 2px; }
    .appt-info { flex: 1; min-width: 0; }
    .appt-info b { font-size: 0.95rem; display: block; }
    .appt-info span { font-size: 0.82rem; color: var(--muted); }

    .doc-card { display: flex; align-items: flex-start; gap: 14px; padding: 18px; }
    .portal { display: inline-block; font-size: 0.78rem; font-weight: 600; color: var(--teal); margin-top: 6px; }

    /* ==========================================================================
       8. DOCUMENTS VIEW
       ========================================================================== */
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s;
    }
    .chip:hover { border-color: var(--teal); color: var(--text); }
    .chip.on { background: var(--teal); color: white; border-color: var(--teal); }

    .doc-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .doc-ic {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .chk-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .chk-row:hover { background: var(--bg); }
    .st-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
    }
    .st-dot.have { background: var(--teal); border-color: var(--teal); color: white; }
    .st-dot.progress { background: var(--gold); border-color: var(--gold); color: white; }
    .st-dot.missing { background: var(--red-soft); border-color: var(--red); color: var(--red); }

    /* ==========================================================================
       9. 3D WALLET & INSURANCE CARDS
       ========================================================================== */
    .wallet { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .ccard {
      height: 190px;
      perspective: 1000px;
      cursor: pointer;
    }
    .ccard .inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: var(--radius-lg);
    }
    .ccard.flipped .inner { transform: rotateY(180deg); }
    .cface {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .cface.cc-medicare { background: linear-gradient(135deg, #1E3A8A, #2563EB); color: white; }
    .cface.cc-aarp { background: linear-gradient(135deg, #065F46, #059669); color: white; }
    .cface.cc-bcbs { background: linear-gradient(135deg, #0284C7, #0369A1); color: white; }
    .cface.cc-rx { background: linear-gradient(135deg, #7C2D12, #C2410C); color: white; }
    
    .cface.back {
      background: var(--card);
      color: var(--text);
      transform: rotateY(180deg);
      border: 1px solid var(--line);
    }
    .cface .stripe {
      position: absolute;
      left: 0; right: 0;
      height: 38px;
      background: rgba(255,255,255,0.15);
    }
    .chip-ic {
      width: 32px;
      height: 24px;
      background: #D4AF37;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
    }

    const esc = str => String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    
    /* #14: use UTC-based date string so dose keys don't shift with timezone/clock drift */
    function today() {
      const d = new Date();
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    }
    function iso(d) {
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    }
    function addDays(d, n) {
      const copy = new Date(d);
      copy.setDate(copy.getDate() + n);
      return copy;
    }
    function fmt(dStr) {
      if (!dStr) return '';
      const [y, m, d] = dStr.split('-');
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function fmtL(dStr) {
      if (!dStr) return '';
      const [y, m, d] = dStr.split('-');
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    function initials(name) {
      return (name || '').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }
    function takenCount(ds) {
      if (!state.taken[ds]) return 0;
      return Object.values(state.taken[ds]).filter(Boolean).length;
    }
    function heatCell(ds) {
      const cnt = takenCount(ds);
      const bg = cnt === 0 ? 'var(--line)' :
                 cnt <= 2 ? 'color-mix(in srgb,var(--teal) 30%,var(--card))' :
                 cnt <= 4 ? 'color-mix(in srgb,var(--teal) 65%,var(--card))' : 'var(--teal)';
      return `<div class="hm-cell" style="background:${bg}" title="${fmtL(ds)}: ${cnt} doses logged"></div>`;
    }
    function toast(msg) {
      const box = $('#toast-box');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    const _revealObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = '1';
          e.target.style.transform = 'translateY(0)';
          _revealObserver.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    function observe(container) {
      if (!container) return;
      container.querySelectorAll('.reveal').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(12px)';
        el.style.transition = 'opacity .4s cubic-bezier(.2,.7,.3,1), transform .4s cubic-bezier(.2,.7,.3,1)';
        _revealObserver.observe(el);
      });
    }

    function updatePillsBadge() {
      const totalDoses = state.meds.reduce((a, m) => a + m.times.length, 0);
      const takenT = takenCount(today());

      if (pill) pill.textContent = `${takenT}/${totalDoses}`;
    }

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (viewName === 'dashboard') renderDashboard();
      else if (viewName === 'meds') renderMeds();
      else if (viewName === 'appts') renderAppts();

    /* ---------- 11. VIEW: DOCUMENTS ---------- */
    let docFilter = 'All';
    function renderDocs() {
      const cats = ['All', ...new Set(state.documents.map(d => d.cat))];
      const chips = cats.map(c => `<button class="chip ${docFilter === c ? 'on' : ''}" data-action="docFilter" data-f="${c}">${c === 'All' ? '🗂' : DOC_IC[c] || '📄'} ${c}</button>`).join('');
      const expBadge = d => {
        if (!d.expiry) return '<span class="exp ok">No expiry</span>';
        const days = Math.ceil((new Date(d.expiry + 'T12:00:00') - new Date()) / 86400000);
        if (days < 0) return `<span class="exp bad">Expired ${fmt(d.expiry)}</span>`;
        if (days <= 60) return `<span class="exp soon">Renew by ${fmt(d.expiry)}</span>`;
        return `<span class="exp ok">Valid to ${fmt(d.expiry)}</span>`;
      };
      const rows = state.documents.filter(d => docFilter === 'All' || d.cat === docFilter).map(d => `
        <div class="doc-row reveal">
          <span class="doc-ic" style="background:var(--teal-soft)">${DOC_IC[d.cat] || '📄'}</span>
          <div style="flex:1;min-width:0"><b class="small">${esc(d.name)}</b><div class="muted small">${esc(d.note || d.cat + ' folder')}</div></div>
          ${expBadge(d)}
          <button class="btn ghost2 sm" data-action="delDoc" data-id="${d.id}" aria-label="Delete ${esc(d.name)}">🗑</button>
        </div>`).join('');
      const have = state.checklist.filter(c => c.s === 'have').length;
      const prog = state.checklist.filter(c => c.s === 'progress').length;
      const chk = state.checklist.map((c, i) => `
        <div class="chk-row ${c.s}" data-action="cycleChk" data-i="${i}" role="button" tabindex="0" aria-label="${esc(c.t)} — currently ${c.s}">
          <span class="st-dot ${c.s}">${c.s === 'have' ? '✓' : c.s === 'progress' ? '…' : '✕'}</span>
          <span class="txt small" style="flex:1">${esc(c.t)}</span>
          <span class="tag ${c.s === 'have' ? 'teal' : c.s === 'progress' ? 'gold' : 'red'}">${c.s === 'have' ? 'Have' : c.s === 'progress' ? 'In progress' : 'Missing'}</span>
        </div>`).join('');
      $('#v-docs').innerHTML = `
        <div class="view-head reveal"><h1>🗂️ Documents & Paperwork</h1><p>The important papers, finally in one place.</p></div>
        <div class="chip-row reveal">${chips}<button class="btn sm" data-action="addDoc" style="margin-left:auto">＋ Add document</button></div>
        <div class="grid g2" style="margin-top:16px;align-items:start">
          <div class="grid" style="gap:12px">${rows || '<div class="card"><p class="muted">Nothing in this folder yet.</p></div>'}</div>
          <div class="card reveal" style="--d:80ms">
            <h3 class="serif">✅ Essential senior documents</h3>
            <p class="muted small">Tap any item to cycle: missing → in progress → have.</p>
            <div style="height:10px;border-radius:999px;background:var(--bg2);margin:12px 0 10px;overflow:hidden">
              <div style="height:100%;width:${Math.round((have / state.checklist.length) * 100)}%;background:var(--teal);border-radius:999px;transition:width .5s"></div>
            </div>
            <div class="muted small" style="margin-bottom:8px">${have} have · ${prog} in progress · ${state.checklist.length - have - prog} missing</div>
            ${chk}
          </div>
        </div>`;
      observe($('#v-docs'));
    }

    /* ---------- 12. VIEW: WALLET ---------- */
    function renderWallet() {
      const cards = state.wallet.map((w, i) => `
        <div class="ccard reveal" style="--d:${i * 60}ms" data-action="flip" role="button" tabindex="0" aria-label="Flip ${esc(w.name)} card">
          <div class="inner">
            <div class="cface cc-${w.kind}">
              ${w.kind === 'medicare' ? '<span class="stripe" style="top:30px"></span>' : ''}
              <div style="display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1"><span class="brand">${esc(w.name)}</span><span class="chip-ic"></span></div>
              <div style="position:relative;z-index:1">${w.lines.map((l, li) => `<div class="${li === 0 ? 'big' : 'num'}" style="margin-top:4px">${esc(l)}</div>`).join('')}</div>
              <div class="flip-hint" style="position:relative;z-index:1">Tap to flip ↻</div>
            </div>
            <div class="cface back">
              <div style="font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">${esc(w.name)} — details</div>
              ${w.back.map(([k, v]) => `<div class="back-row"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}

            </div>

      const claims = state.claims.map(c => `<div class="claim-row"><span>${esc(c.what)}<div class="muted small">${esc(c.paid)}</div></span><span class="tag ${c.status === 'Approved' ? 'teal' : c.status === 'Processing' ? 'gold' : 'red'}">${esc(c.status)}</span></div>`).join('');
      $('#v-wallet').innerHTML = `
        <div class="view-head reveal"><h1>👛 Cards & Insurance Wallet</h1><p>Tap any card to flip it over.</p></div>
        <div class="wallet">${cards}</div>
        <div class="grid g3" style="margin-top:22px">
          <div class="card reveal"><h3 class="serif" style="margin-bottom:8px">🧾 Recent copays</h3>${copays}
            <div class="claim-row" style="border-top:2px solid var(--line);margin-top:6px"><b>Total out of pocket</b><b style="color:var(--teal)">$${copayTotal}</b></div></div>
          <div class="card reveal" style="--d:70ms"><h3 class="serif" style="margin-bottom:8px">📋 Claim status</h3>${claims}</div>
          <div class="card reveal" style="--d:140ms"><h3 class="serif" style="margin-bottom:8px">💡 Benefits snapshot</h3>
            <div class="claim-row"><span>Part A coinsurance</span><span class="tag teal">Covered 100%</span></div>
            <div class="claim-row"><span>Part B deductible</span><span class="tag teal">Met ✓</span></div>
            <div class="claim-row"><span>Skilled nursing coinsurance</span><span class="tag teal">Covered</span></div>
            <div class="claim-row"><span>Foreign travel emergency</span><span class="tag gold">80% after $250</span></div>
            <div class="claim-row"><span>Dental · vision · hearing</span><span class="tag red">Not covered</span></div>
            <p class="muted small" style="margin-top:10px">Annual wellness visit with Dr. Smith: $0 copay. Bring the printed med list every time.</p></div>
        </div>`;
      observe($('#v-wallet'));
    }

    /* ---------- 13. VIEW: DAILY CARE & WELLNESS ---------- */
    let mealFilter = 'all';
    function renderCare() {
      const cols = [['pending', 'To do', 'var(--coral)'], ['progress', 'In progress', 'var(--gold)'], ['done', 'Done', 'var(--teal)']];
      const board = cols.map(([k, label, color], ci) => {
        const cards = state.tasks.filter(t => t.status === k).map(t => {
          const f = state.family.find(x => x.name === t.who) || { color: 'var(--muted)' };
          return `<div class="task reveal">
            <div class="t-top"><b>${esc(t.title)}</b><span class="tag ${CAT_TAG[t.cat] || 'teal'}">${esc(t.cat)}</span></div>
            <div class="t-foot">
              <span style="display:flex;align-items:center;gap:7px;min-width:0">
                <span class="av" style="width:26px;height:26px;font-size:.6rem;background:linear-gradient(135deg,${f.color},color-mix(in srgb,${f.color} 70%,#000))">${initials(t.who)}</span>
                <span class="muted small">${esc(t.who)} · ${fmt(t.due)}</span></span>
              <span class="mv">
                ${ci > 0 ? `<button data-action="moveTask" data-id="${t.id}" data-dir="-1" aria-label="Move back">←</button>` : ''}
                ${ci < 2 ? `<button data-action="moveTask" data-id="${t.id}" data-dir="1" aria-label="Move forward">→</button>` : ''}
                <button data-action="delTask" data-id="${t.id}" aria-label="Delete task">🗑</button>
              </span>
            </div></div>`;
        }).join('');
        return `<div class="col reveal"><div class="col-h"><span>${label}</span><span class="tag" style="background:color-mix(in srgb,${color} 18%,transparent);color:${color}">${state.tasks.filter(t => t.status === k).length}</span></div>${cards || '<p class="muted small" style="padding:6px">All clear ✨</p>'}</div>`;
      }).join('');

      const moodToday = state.moods[today()];
      const acts = ACTIVITIES.map((a, i) => `
        <div class="card hover act-card reveal" style="--d:${(i % 4) * 60}ms">
          <span style="font-size:2rem">${a.ic}</span>
          <div style="flex:1;min-width:0">
            <b>${esc(a.t)}</b> <span class="tag teal">${esc(a.cat)}</span> <span class="tag gold">${esc(a.dur)}</span>
            <p class="muted small" style="margin-top:4px">${esc(a.d)}</p>
          </div>
          <button class="btn ghost sm" data-action="addActivityTask" data-title="${esc(a.t)}" data-cat="companionship">＋ Plan</button>
        </div>`).join('');

      const mealList = MEALS.filter(m => mealFilter === 'all' || m.tags.includes(mealFilter)).map(m => `
        <div class="meal-card reveal">
          <span style="font-size:1.8rem">${m.ic}</span>
          <div style="flex:1;min-width:0">
            <b class="small">${esc(m.t)}</b>
            <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
              ${m.tags.map(t => `<span class="tag ${t === 'low-sodium' ? 'teal' : t === 'diabetic' ? 'blue' : 'gold'}">${MEAL_LBL[t] || t}</span>`).join('')}
            </div>
          </div>
          <button class="btn ghost2 sm" data-action="addMealTask" data-title="Prepare ${esc(m.t)}">＋ Add to tasks</button>
        </div>`).join('');

      $('#v-care').innerHTML = `
        <div class="view-head reveal" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
          <div><h1>🌸 Daily Care, Mood & Activities</h1><p>Keep Grams engaged, nourished, and happy every single day.</p></div>
          <button class="btn sm" data-action="addTask">＋ Add care task</button>
        </div>

        <div class="grid g2">
          <!-- Mood Logging Card -->
          <div class="card reveal">
            <h3 class="serif">😊 How is Grams feeling today?</h3>
            <p class="muted small">Track emotional well-being and daily spirit.</p>
            <div class="mood-scale">
              ${[1, 2, 3, 4, 5].map(score => {
                const ems = ['', '😔', '😕', '😐', '😊', '🥰'];
                const sel = moodToday && moodToday.score === score;
                return `<button class="mood-btn ${sel ? 'selected' : ''}" data-action="setMood" data-score="${score}">
                  <span>${ems[score]}</span>
                  <span>${['', 'Rough', 'Low', 'Okay', 'Good', 'Great'][score]}</span>
                </button>`;
              }).join('')}
            </div>
            ${moodToday ? `<div class="warnbar amber" style="margin-top:14px;padding:10px 14px"><span>💬</span><div class="small"><b>Today's note:</b> ${esc(moodToday.note || 'No notes added')}</div></div>` : '<p class="muted small" style="margin-top:10px">Tap any mood emoji above to log Grams’s day.</p>'}
          </div>

          <!-- Vitals Snapshot Card -->
          <div class="card reveal" style="--d:80ms">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <h3 class="serif">🩺 Health Snapshot</h3>
              <button class="btn ghost2 sm" data-action="logVitals">Update</button>
            </div>
            <div class="claim-row"><span>Blood Pressure</span><b>${state.vitals.bp} mmHg</b></div>
            <div class="claim-row"><span>Heart Rate</span><b>${state.vitals.hr} bpm</b></div>
            <div class="claim-row"><span>Blood Glucose</span><b>${state.vitals.glucose} mg/dL</b></div>
            <div class="claim-row"><span>Weight & Oxygen</span><b>${state.vitals.weight} · O₂ ${state.vitals.o2}</b></div>
          </div>
        </div>

        <h2 class="sec-title reveal">Family Task Coordination</h2>
        <div class="kanban">${board}</div>

        <h2 class="sec-title reveal">Caregiver Meal Ideas</h2>
        <div class="chip-row reveal" style="margin-bottom:14px">
          ${['all', 'low-sodium', 'diabetic', 'soft'].map(f => `<button class="chip ${mealFilter === f ? 'on' : ''}" data-action="mealFilter" data-f="${f}">${f === 'all' ? '🍽️ All Diets' : MEAL_LBL[f]}</button>`).join('')}
        </div>
        <div class="grid g2">${mealList}</div>

        <h2 class="sec-title reveal">Enrichment & Joyful Activities</h2>
        <div class="grid g2">${acts}</div>`;
      observe($('#v-care'));
    }

    /* ---------- 14. EVENT DELEGATION & ACTIONS ---------- */
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const act = btn.dataset.action;

      if (act === 'nav') {
        switchView(btn.dataset.view);
      }
      else if (act === 'toggleTheme') {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          $('#theme-ic').textContent = '🌙';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          $('#theme-ic').textContent = '☀️';
        }
      }
      else if (act === 'toggleTextSize') {
        document.body.classList.toggle('text-lg');
        toast(document.body.classList.contains('text-lg') ? '🔍 Large text mode enabled' : 'Standard text mode');
      }
      else if (act === 'toggleDose') {
        const mid = btn.dataset.mid;
        const slot = btn.dataset.slot;
        const T = today();
        state.taken[T] = state.taken[T] || {};
        const k = `${mid}@${slot}`;
        state.taken[T][k] = !state.taken[T][k];
        saveState();
        renderMeds();
        if (currentView === 'dashboard') renderDashboard();

        const totalDoses = state.meds.reduce((a, m) => a + m.times.length, 0);
        const takenT = takenCount(T);
        if (takenT === totalDoses && totalDoses > 0) {
          triggerConfetti();
        } else {
          toast(state.taken[T][k] ? 'Dose marked as taken ✓' : 'Dose unmarked');
        }
      }
      else if (act === 'openSos') {
        openModal(`
          <div style="text-align:center;margin-bottom:18px">
            <span style="font-size:3rem">🚨</span>
            <h2 class="serif" style="color:var(--red)">Emergency Medical Profile</h2>
            <p class="muted small">Quick-access reference for paramedics & ER staff</p>
          </div>
          <div class="warnbar" style="margin-bottom:16px">
            <div>
              <b>${state.senior.name} (${state.senior.nick}) · Age ${state.senior.age}</b>
              <div class="small">DOB: ${state.senior.dob} · Blood: ${state.senior.blood}</div>
              <div class="small"><b>Code Status:</b> ${state.senior.dnr}</div>
            </div>
          </div>
          <h4 style="margin-bottom:8px">⚠️ Critical Allergies</h4>
          <div class="warnbar amber" style="margin-bottom:16px">${state.allergies.map(esc).join('<br>')}</div>
          <h4 style="margin-bottom:8px">📞 Emergency Family Contacts</h4>
          ${state.family.map(f => `
            <div class="contact-row">
              <div style="flex:1"><b>${esc(f.name)}</b><div class="muted small">${esc(f.role)}</div></div>
              <a class="btn sm" style="background:var(--red)" href="tel:${f.phone.replace(/[^0-9+]/g,'')}">Call ${esc(f.phone)}</a>
            </div>`).join('')}
          <div style="margin-top:16px;display:flex;gap:10px">
            <a class="btn danger" style="flex:1" href="tel:911">🚑 Call 911 Emergency</a>
            <button class="btn ghost2" onclick="closeModal()">Close</button>
          </div>`);
      }
      else if (act === 'addMed') {
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Add New Medication</h3>
          <form id="form-add-med" onsubmit="event.preventDefault(); submitAddMed();">
            <div class="form-group"><label>Medication Name</label><input required name="name" placeholder="e.g. Lisinopril"></div>
            <div class="form-group"><label>Dosage</label><input required name="dose" placeholder="e.g. 10mg or 1 drop"></div>
            <div class="form-group"><label>Form</label>
              <select name="form">
                <option value="tablet">Tablet</option>
                <option value="capsule">Capsule</option>
                <option value="drops">Eye/Ear Drops</option>
                <option value="liquid">Liquid</option>
                <option value="inhaler">Inhaler</option>
              </select>
            </div>
            <div class="form-group"><label>Schedule Slot(s)</label>
              <div style="display:flex;gap:10px;flex-wrap:wrap">
                <label><input type="checkbox" name="time_morning" value="morning" checked> Morning</label>
                <label><input type="checkbox" name="time_noon" value="noon"> Noon</label>
                <label><input type="checkbox" name="time_evening" value="evening"> Evening</label>
                <label><input type="checkbox" name="time_bedtime" value="bedtime"> Bedtime</label>
              </div>
            </div>
            <div class="form-group"><label>Instructions</label><input name="instructions" placeholder="Take with meals"></div>
            <div class="form-group"><label>Prescribing Doctor</label><input name="prescriber" placeholder="Dr. Smith"></div>
            <div class="form-group"><label>Doses Remaining</label><input type="number" name="left" value="30"></div>
            <div class="form-group"><label>Next Refill Date</label><input type="date" name="refill" value="${iso(addDays(new Date(), 30))}"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="submit" class="btn" style="flex:1">Save Medication</button>
              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>
          </form>`);
      }
      else if (act === 'editMed') {
        const med = state.meds.find(m => m.id === btn.dataset.id);
        if (!med) return;
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Edit ${esc(med.name)}</h3>
          <form id="form-edit-med" onsubmit="event.preventDefault(); submitEditMed('${med.id}');">
            <div class="form-group"><label>Medication Name</label><input required name="name" value="${esc(med.name)}"></div>
            <div class="form-group"><label>Dosage</label><input required name="dose" value="${esc(med.dose)}"></div>
            <div class="form-group"><label>Instructions</label><input name="instructions" value="${esc(med.instructions)}"></div>
            <div class="form-group"><label>Doses Remaining</label><input type="number" name="left" value="${med.left}"></div>
            <div class="form-group"><label>Next Refill Date</label><input type="date" name="refill" value="${med.refill}"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="submit" class="btn" style="flex:1">Update</button>
              <button type="button" class="btn danger" onclick="deleteMed('${med.id}')">Delete</button>
              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>
          </form>`);
      }
      else if (act === 'printMeds') {
        window.print();
      }
      else if (act === 'addAppt') {
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Schedule Appointment</h3>
          <form id="form-add-appt" onsubmit="event.preventDefault(); submitAddAppt();">
            <div class="form-group"><label>Visit Title</label><input required name="title" placeholder="e.g. Cardiology Checkup"></div>
            <div class="form-group"><label>Doctor / Specialist</label><input required name="who" placeholder="e.g. Dr. Alan Smith"></div>
            <div class="form-group"><label>Location</label><input required name="where" placeholder="e.g. Heart Institute Rm 302"></div>
            <div class="form-group"><label>Date</label><input type="date" required name="date" value="${iso(addDays(new Date(), 7))}"></div>
            <div class="form-group"><label>Time</label><input type="time" required name="time" value="10:00"></div>
            <div class="form-group"><label>Specialty Category</label>
              <select name="type">
                <option value="cardio">Cardiology</option>
                <option value="eye">Ophthalmology</option>
                <option value="primary">Primary Care</option>
                <option value="pt">Physical Therapy</option>
                <option value="dental">Dental</option>
                <option value="other">Specialist</option>
              </select>
            </div>
            <div style="display:flex;gap:10px;margin-top:18px">

              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>

        renderAppts();
      }
      else if (act === 'calNext') {
        calRef = new Date(calRef.getFullYear(), calRef.getMonth() + 1, 1);
        renderAppts();
      }
      else if (act === 'calDay') {
        const ds = btn.dataset.date;
        const list = state.appts.filter(a => a.date === ds);
        if (list.length) {
          toast(`📅 ${fmtL(ds)}: ${list.map(a => a.title).join(', ')}`);
        } else {
          toast(`📅 ${fmtL(ds)}: No appointments scheduled`);
        }
      }
      else if (act === 'prep') {
        const appt = state.appts.find(a => a.id === btn.dataset.id);
        if (!appt) return;
        openModal(`
          <h3 class="serif" style="margin-bottom:6px">📋 Prep Checklist for ${esc(appt.title)}</h3>
          <p class="muted small" style="margin-bottom:16px">${appt.time} · ${esc(appt.who)} · ${esc(appt.where)}</p>
          <div style="line-height:2">
            ${(appt.prep || ['Bring medication list', 'Check insurance cards', 'Arrange ride']).map(p => `<div><label><input type="checkbox"> ${esc(p)}</label></div>`).join('')}
          </div>
          <button class="btn" style="width:100%;margin-top:18px" onclick="closeModal()">Done</button>`);
      }
      else if (act === 'visitNote') {
        const appt = state.appts.find(a => a.id === btn.dataset.id);
        if (!appt) return;
        openModal(`
          <h3 class="serif" style="margin-bottom:6px">🗒 Visit Summary: ${esc(appt.title)}</h3>
          <p class="muted small" style="margin-bottom:14px">${fmt(appt.date)} · ${esc(appt.who)}</p>
          <div class="form-group"><label>Doctor’s Summary & Next Steps</label>
            <textarea id="appt-note-txt" rows="4">${esc(appt.note || '')}</textarea>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn" style="flex:1" onclick="saveApptNote('${appt.id}')">Save Notes</button>
            <button class="btn ghost2" onclick="closeModal()">Close</button>
          </div>`);
      }
      else if (act === 'docFilter') {
        docFilter = btn.dataset.f;
        renderDocs();
      }
      else if (act === 'addDoc') {
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Upload / Record Document</h3>
          <form id="form-add-doc" onsubmit="event.preventDefault(); submitAddDoc();">
            <div class="form-group"><label>Document Name</label><input required name="name" placeholder="e.g. Health Care Proxy"></div>
            <div class="form-group"><label>Category</label>
              <select name="cat">
                <option value="Insurance">Insurance</option>
                <option value="Legal">Legal</option>
                <option value="Medical">Medical</option>
                <option value="Financial">Financial</option>
                <option value="Identification">Identification</option>
              </select>
            </div>
            <div class="form-group"><label>Expiry / Renewal Date (optional)</label><input type="date" name="expiry"></div>
            <div class="form-group"><label>Notes / Storage Location</label><input name="note" placeholder="In safe deposit box or bedside drawer"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="submit" class="btn" style="flex:1">Save Document</button>
              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>
          </form>`);
      }
      else if (act === 'delDoc') {
        state.documents = state.documents.filter(d => d.id !== btn.dataset.id);
        saveState();
        renderDocs();
        toast('Document removed');
      }
      else if (act === 'cycleChk') {
        const idx = parseInt(btn.dataset.i, 10);
        const order = ['missing', 'progress', 'have'];
        const cur = state.checklist[idx].s;
        const next = order[(order.indexOf(cur) + 1) % order.length];
        state.checklist[idx].s = next;
        saveState();
        renderDocs();
      }
      else if (act === 'flip') {
        btn.classList.toggle('flipped');
      }
      else if (act === 'addTask') {
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Add Daily Care Task</h3>
          <form id="form-add-task" onsubmit="event.preventDefault(); submitAddTask();">
            <div class="form-group"><label>Task Description</label><input required name="title" placeholder="e.g. Help Grams with morning walk"></div>
            <div class="form-group"><label>Category</label>
              <select name="cat">
                <option value="meals">Meals & Nutrition</option>
                <option value="hygiene">Hygiene & Care</option>
                <option value="mobility">Mobility & Exercise</option>
                <option value="errands">Errands & Pharmacy</option>
                <option value="companionship">Companionship & Calls</option>
              </select>
            </div>
            <div class="form-group"><label>Assigned Caregiver</label>
              <select name="who">
                ${state.family.map(f => `<option value="${esc(f.name)}">${esc(f.name)}</option>`).join('')}
              </select>
            </div>
            <div class="form-group"><label>Due Date</label><input type="date" required name="due" value="${today()}"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="submit" class="btn" style="flex:1">Create Task</button>
              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>
          </form>`);
      }
      else if (act === 'moveTask') {
        const id = btn.dataset.id;
        const dir = parseInt(btn.dataset.dir, 10);
        const order = ['pending', 'progress', 'done'];
        const task = state.tasks.find(t => t.id === id);
        if (task) {
          const nextIdx = Math.max(0, Math.min(2, order.indexOf(task.status) + dir));
          task.status = order[nextIdx];
          saveState();
          renderCare();
        }
      }
      else if (act === 'delTask') {
        state.tasks = state.tasks.filter(t => t.id !== btn.dataset.id);
        saveState();
        renderCare();
        toast('Task deleted');
      }
      else if (act === 'setMood') {
        const score = parseInt(btn.dataset.score, 10);
        const T = today();
        state.moods[T] = { score, note: prompt('Add a quick note about Grams’s day:', state.moods[T]?.note || '') || '' };
        saveState();
        renderCare();
        if (currentView === 'dashboard') renderDashboard();
        toast(`Logged mood: ${MOODL[score]} 😊`);
      }
      else if (act === 'mealFilter') {
        mealFilter = btn.dataset.f;
        renderCare();
      }
      else if (act === 'addMealTask') {
        state.tasks.push({
          id: 't_' + Date.now(),
          title: btn.dataset.title,
          cat: 'meals',
          who: state.family[0].name,
          due: today(),
          status: 'pending'
        });
        saveState();
        renderCare();
        toast('Meal added to care tasks!');
      }
      else if (act === 'addActivityTask') {
        state.tasks.push({
          id: 't_' + Date.now(),
          title: btn.dataset.title,
          cat: btn.dataset.cat || 'companionship',
          who: state.family[0].name,
          due: today(),
          status: 'pending'
        });
        saveState();
        renderCare();
        toast('Activity added to care tasks!');
      }
      else if (act === 'logVitals') {
        openModal(`
          <h3 class="serif" style="margin-bottom:14px">Log Vitals</h3>
          <form id="form-vitals" onsubmit="event.preventDefault(); submitVitals();">
            <div class="form-group"><label>Blood Pressure (e.g. 120/78)</label><input required name="bp" value="${esc(state.vitals.bp)}"></div>
            <div class="form-group"><label>Heart Rate (bpm)</label><input type="number" required name="hr" value="${state.vitals.hr}"></div>
            <div class="form-group"><label>Blood Glucose (mg/dL)</label><input type="number" required name="glucose" value="${state.vitals.glucose}"></div>
            <div class="form-group"><label>Weight</label><input required name="weight" value="${esc(state.vitals.weight)}"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="submit" class="btn" style="flex:1">Save Vitals</button>
              <button type="button" class="btn ghost2" onclick="closeModal()">Cancel</button>
            </div>
          </form>`);
      }
    });

    /* ---------- 15. FORM SUBMISSION HANDLERS ---------- */
    window.submitAddMed = function() {
      const f = $('#form-add-med');
      const times = [];
      if (f.time_morning.checked) times.push('morning');
      if (f.time_noon.checked) times.push('noon');
      if (f.time_evening.checked) times.push('evening');
      if (f.time_bedtime.checked) times.push('bedtime');

      state.meds.push({
        id: 'm_' + Date.now(),
        name: f.name.value,
        dose: f.dose.value,
        form: f.form.value,
        times: times.length ? times : ['morning'],
        instructions: f.instructions.value || 'Take as prescribed',
        prescriber: f.prescriber.value || 'Dr. Smith',
        pharmacy: 'CVS Pharmacy',
        refill: f.refill.value,
        left: parseInt(f.left.value, 10) || 30,
        color: '#0F6B5C'
      });
      saveState();
      closeModal();
      renderMeds();
      toast('Medication added successfully');
    };

    window.submitEditMed = function(id) {
      const f = $('#form-edit-med');
      const med = state.meds.find(m => m.id === id);
      if (med) {
        med.name = f.name.value;
        med.dose = f.dose.value;
        med.instructions = f.instructions.value;
        med.left = parseInt(f.left.value, 10);
        med.refill = f.refill.value;
        saveState();
        closeModal();
        renderMeds();
        toast('Medication updated');
      }
    };

    window.deleteMed = function(id) {
      if (confirm('Are you sure you want to remove this medication?')) {
        state.meds = state.meds.filter(m => m.id !== id);
        saveState();
        closeModal();
        renderMeds();
        toast('Medication deleted');
      }
    };

    window.submitAddAppt = function() {
      const f = $('#form-add-appt');
      state.appts.push({
        id: 'a_' + Date.now(),
        title: f.title.value,
        who: f.who.value,
        where: f.where.value,
        date: f.date.value,
        time: f.time.value,
        type: f.type.value,
        past: false,
        prep: ['Bring medication list', 'Review recent logs']
      });
      saveState();
      closeModal();
      renderAppts();
      toast('Appointment scheduled');
    };

    window.saveApptNote = function(id) {
      const note = $('#appt-note-txt').value;
      const appt = state.appts.find(a => a.id === id);
      if (appt) {
        appt.note = note;
        saveState();
        closeModal();
        renderAppts();
        toast('Visit notes saved');
      }
    };

    window.submitAddDoc = function() {
      const f = $('#form-add-doc');
      state.documents.push({
        id: 'd_' + Date.now(),
        name: f.name.value,
        cat: f.cat.value,
        expiry: f.expiry.value || null,
        note: f.note.value || ''
      });
      saveState();
      closeModal();
      renderDocs();
      toast('Document recorded');
    };

    window.submitAddTask = function() {
      const f = $('#form-add-task');
      state.tasks.push({
        id: 't_' + Date.now(),
        title: f.title.value,
        cat: f.cat.value,
        who: f.who.value,
        due: f.due.value,
        status: 'pending'
      });
      saveState();
      closeModal();
      renderCare();
      toast('Task added');
    };

    window.submitVitals = function() {
      const f = $('#form-vitals');
      state.vitals.bp = f.bp.value;
      state.vitals.hr = parseInt(f.hr.value, 10);
      state.vitals.glucose = parseInt(f.glucose.value, 10);
      state.vitals.weight = f.weight.value;
      saveState();
      closeModal();
      renderCare();
      if (currentView === 'dashboard') renderDashboard();
      toast('Vitals recorded');
    };

    /* ---------- 16. INITIALIZATION ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      renderDashboard();
      updatePillsBadge();
    });
  </script>

    <!-- Global Fullscreen Toggle -->
    <button id="global-fs-btn" style="position:fixed;bottom:20px;left:20px;z-index:99999;width:40px;height:40px;border-radius:50%;background:#333;color:#fff;border:none;cursor:pointer;font-size:16px;box-shadow:0 4px 10px rgba(0,0,0,0.3);display:grid;place-items:center;" aria-label="Toggle Fullscreen" onclick="if(!document.fullscreenElement){document.documentElement.requestFullscreen()}else{document.exitFullscreen()}">⛶</button>
    
</body>
