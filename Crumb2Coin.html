<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

<meta charset="UTF-8">
<meta name="theme-color" content="#0b1020">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crumb to Coin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥐</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
/* ============================================================
   TOKENS — LIGHT (default)
============================================================ */
:root {
  --bg:          #FAF3E8;
  --bg2:         #F1E8D8;
  --card:        #FFFFFF;
  --card2:       #FDF8F1;
  --ink:         #2B1A0E;
  --ink2:        #6B4F35;
  --ink3:        #9A7D61;
  --border:      #E8D9C4;
  --accent:      #C2410C;
  --accent2:     #7C2D12;
  --gold:        #D97706;
  --gold2:       #92400E;
  --ok:          #15803D;
  --ok-bg:       #DCFCE7;
  --warn:        #B45309;
  --warn-bg:     #FEF3C7;
  --bad:         #B91C1C;
  --bad-bg:      #FEE2E2;
  --info:        #1D4ED8;
  --info-bg:     #E0F2FE;
  --side-bg:     #2B1A0E;
  --side-ink:    #E8D9C4;
  --side-muted:  #9A7057;
  --side-active: #C2410C;
  --shadow-sm:   0 1px 3px rgba(70,40,15,.08), 0 1px 2px rgba(70,40,15,.06);
  --shadow:      0 4px 12px rgba(70,40,15,.10), 0 2px 4px rgba(70,40,15,.06);
  --shadow-lg:   0 10px 30px rgba(70,40,15,.13), 0 4px 10px rgba(70,40,15,.07);
  --radius-sm:   8px;
  --radius:      12px;
  --radius-lg:   18px;
  --header-bg:   rgba(250,243,232,.9);
  --header-border: rgba(232,217,196,.8);
  color-scheme: light;
}

/* DARK */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #130A02;
    --bg2:         #1E1008;
    --card:        #231408;
    --card2:       #2B1A0E;
    --ink:         #F0E4D0;
    --ink2:        #C4A882;
    --ink3:        #8A6E52;
    --border:      #3D2510;
    --accent:      #EA580C;
    --accent2:     #FB923C;
    --gold:        #F59E0B;
    --gold2:       #FCD34D;
    --ok:          #4ADE80;
    --ok-bg:       #052E16;
    --warn:        #FBB524;
    --warn-bg:     #451A03;
    --bad:         #F87171;
    --bad-bg:      #450A0A;
    --info:        #60A5FA;
    --info-bg:     #1E3A5F;
    --side-bg:     #0D0502;
    --side-ink:    #E8D9C4;
    --side-muted:  #7A5538;
    --side-active: #EA580C;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
    --shadow:      0 4px 12px rgba(0,0,0,.5);
    --shadow-lg:   0 10px 30px rgba(0,0,0,.6);
    --header-bg:   rgba(19,10,2,.92);
    --header-border: rgba(61,37,16,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #130A02;
  --bg2:         #1E1008;
  --card:        #231408;
  --card2:       #2B1A0E;
  --ink:         #F0E4D0;
  --ink2:        #C4A882;
  --ink3:        #8A6E52;
  --border:      #3D2510;
  --accent:      #EA580C;
  --accent2:     #FB923C;
  --gold:        #F59E0B;
  --gold2:       #FCD34D;
  --ok:          #4ADE80;
  --ok-bg:       #052E16;
  --warn:        #FBB524;
  --warn-bg:     #451A03;
  --bad:         #F87171;
  --bad-bg:      #450A0A;
  --info:        #60A5FA;
  --info-bg:     #1E3A5F;
  --side-bg:     #0D0502;
  --side-ink:    #E8D9C4;
  --side-muted:  #7A5538;
  --side-active: #EA580C;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
  --shadow:      0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:   0 10px 30px rgba(0,0,0,.6);
  --header-bg:   rgba(19,10,2,.92);
  --header-border: rgba(61,37,16,.8);
  color-scheme: dark;
}

/* CYBERPUNK */
:root[data-theme="cyberpunk"] {
  --bg:          #0A0014;
  --bg2:         #110022;
  --card:        #130028;
  --card2:       #1A003A;
  --ink:         #E8D0FF;
  --ink2:        #B090D0;
  --ink3:        #7050A0;
  --border:      #3A0060;
  --accent:      #FF3D82;
  --accent2:     #FF80B0;
  --gold:        #00FFD1;
  --gold2:       #80FFE8;
  --ok:          #00FFD1;
  --ok-bg:       #002A22;
  --warn:        #FFD700;
  --warn-bg:     #2A2000;
  --bad:         #FF3D82;
  --bad-bg:      #2A0010;
  --info:        #7C3AFF;
  --info-bg:     #1A003A;
  --side-bg:     #070010;
  --side-ink:    #E8D0FF;
  --side-muted:  #6040A0;
  --side-active: #FF3D82;
  --shadow-sm:   0 1px 3px rgba(255,61,130,.15);
  --shadow:      0 4px 16px rgba(255,61,130,.20);
  --shadow-lg:   0 10px 40px rgba(124,58,255,.25);
  --header-bg:   rgba(10,0,20,.92);
  --header-border: rgba(58,0,96,.9);
  color-scheme: dark;
}

/* EMERALD */
:root[data-theme="emerald"] {
  --bg:          #021A0F;
  --bg2:         #032A18;
  --card:        #043020;
  --card2:       #053828;
  --ink:         #B8FFE4;
  --ink2:        #70D4A8;
  --ink3:        #3A8060;
  --border:      #0A5030;
  --accent:      #00CC88;
  --accent2:     #4DFFC0;
  --gold:        #88FF44;
  --gold2:       #AAFFAA;
  --ok:          #00FF99;
  --ok-bg:       #003020;
  --warn:        #FFDD00;
  --warn-bg:     #2A2000;
  --bad:         #FF4444;
  --bad-bg:      #2A0000;
  --info:        #00AAFF;
  --info-bg:     #001A2A;
  --side-bg:     #011008;
  --side-ink:    #B8FFE4;
  --side-muted:  #2A6040;
  --side-active: #00CC88;
  --shadow-sm:   0 1px 3px rgba(0,204,136,.12);
  --shadow:      0 4px 16px rgba(0,204,136,.16);
  --shadow-lg:   0 10px 40px rgba(0,204,136,.20);
  --header-bg:   rgba(2,26,15,.93);
  --header-border: rgba(10,80,48,.9);
  color-scheme: dark;
}

/* ============================================================
   RESET + BASE
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4,h5,h6 {
  font-family: 'Lora', Georgia, 'Times New Roman', serif;
  text-wrap: balance;
  line-height: 1.25;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font-family: inherit; }
@keyframes fadein {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes slidein {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: none; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse-ring {
  0%,100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.08); opacity: .8; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ============================================================
   LAYOUT SHELL
============================================================ */
.app-shell {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
}
/* Top header */
.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 20px;
  height: 56px;
  background: var(--header-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--header-border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.brand-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
.brand-text h1 {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.01em;
}
.brand-text small {
  display: block;
  font-family: 'Inter', sans-serif;
  font-size: 10.5px;
  color: var(--ink3);
  letter-spacing: .03em;
  font-weight: 400;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* progress ring */
.prog-ring {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: default;
  font-variant-numeric: tabular-nums;
}
.prog-ring svg { transform: rotate(-90deg); flex-shrink: 0; }
.prog-ring .ring-track { stroke: var(--border); }
.prog-ring .ring-fill  { stroke: var(--gold); transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
.prog-ring-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink2);
  white-space: nowrap;
}
.prog-ring-text b { color: var(--gold); font-size: 13px; }
/* theme picker */
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink2);
  cursor: pointer;
  font-size: 15px;
  transition: background .15s, border-color .15s;
}
.theme-btn:hover { background: var(--bg2); border-color: var(--accent); }
.theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-popover {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 8px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  min-width: 200px;
  z-index: 100;
  animation: fadein .15s ease;
}
.theme-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  transition: background .12s, border-color .12s;
}
.theme-option:hover { background: var(--bg2); }
.theme-option.active { border-color: var(--accent); background: var(--bg2); }
.theme-swatch {
  width: 16px; height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
}
/* fullscreen btn */
.fs-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink2);
  cursor: pointer;
  font-size: 14px;
  transition: background .15s, border-color .15s;
}
.fs-btn:hover { background: var(--bg2); border-color: var(--accent); }
.fs-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* sidebar toggle */
.nav-toggle {
  display: none;
  align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink2);
  cursor: pointer;
  font-size: 16px;
}

/* ============================================================
   CONTENT ROW
============================================================ */
.content-row {
  display: grid;
  grid-template-columns: 256px 1fr;
  min-height: 0;
  overflow: hidden;
}

/* ============================================================
   SIDEBAR NAV
============================================================ */
.sidebar {
  background: var(--side-bg);
  color: var(--side-ink);
  overflow-y: auto;
  padding: 12px 8px 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--side-muted) transparent;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--side-muted); border-radius: 4px; }
.nav-section-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--side-muted);
  padding: 14px 12px 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  border-radius: 9px;
  color: var(--side-ink);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.06); }
.nav-item.active {
  background: var(--side-active);
  color: #fff;
}
.nav-item .nav-icon { font-size: 15px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-item .nav-label { flex: 1; }
.nav-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1.5px 6px;
  border-radius: 20px;
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.7);
  font-variant-numeric: tabular-nums;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,.25); color: #fff; }
.nav-divider { height: 1px; background: rgba(255,255,255,.06); margin: 6px 8px; }

/* ============================================================
   MAIN CONTENT
============================================================ */
.main-scroll {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 28px 32px 80px;
  scroll-behavior: smooth;
}
.page { display: none; max-width: 1020px; margin: 0 auto; }
.page.on { display: block; animation: fadein .25s ease; }

/* ============================================================
   COMPONENTS
============================================================ */
/* Section heading */
.sec-label {
  font-family: 'Inter', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.sec-heading {
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 6px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Grids */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, transform .1s, box-shadow .15s;
  font-family: 'Inter', sans-serif;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--accent2); box-shadow: var(--shadow-sm); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}
.btn-ghost:hover { background: var(--bg2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: var(--gold2); }

/* Pills / Badges */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  letter-spacing: .03em;
  font-family: 'Inter', sans-serif;
}
.pill-ok   { background: var(--ok-bg);   color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-bad  { background: var(--bad-bg);  color: var(--bad); }
.pill-info { background: var(--info-bg); color: var(--info); }
.pill-accent { background: var(--bg2);  color: var(--accent); }

/* Stat tiles */
.stat-tile {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
}
.stat-tile .stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 4px;
}
.stat-tile .stat-val {
  font-family: 'Lora', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stat-tile.highlight .stat-val { color: var(--accent); }

/* Form inputs */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--ink3);
  margin-bottom: 5px;
}
input[type=text], input[type=number], input[type=date],
input[type=email], input[type=url], select, textarea {
  width: 100%;
  padding: 8px 11px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  background: var(--card);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(217,119,6,.15);
}
textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
select { cursor: pointer; }
input[type=range] {
  accent-color: var(--accent);
  cursor: pointer;
}
input[type=color] {
  height: 36px;
  padding: 3px 5px;
  cursor: pointer;
}
input[type=checkbox], input[type=radio] {
  accent-color: var(--accent);
  width: 15px; height: 15px;
  cursor: pointer;
}

/* Checklist steps */
.step-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 13px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  margin-bottom: 8px;
  background: var(--card);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.step-item:hover { border-color: var(--gold); }
.step-item.done { background: var(--ok-bg); border-color: var(--ok); }
.step-item.done .step-text { text-decoration: line-through; color: var(--ink3); }
.step-item input[type=checkbox] { margin-top: 2px; flex-shrink: 0; }
.step-text { font-size: 14px; line-height: 1.45; color: var(--ink); }

/* Callouts */
.callout {
  border-radius: 10px;
  padding: 12px 15px;
  font-size: 13.5px;
  margin-bottom: 9px;
  line-height: 1.5;
}
.callout-tip  { background: var(--ok-bg);   border-left: 3px solid var(--ok); }
.callout-warn { background: var(--warn-bg); border-left: 3px solid var(--warn); }
.callout-info { background: var(--info-bg); border-left: 3px solid var(--info); }
.callout-tag {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-bottom: 3px;
  opacity: .8;
}

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink3);
  text-align: left;
  padding: 6px 9px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 7px 9px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg2); }
tbody td input { padding: 5px 8px; font-size: 13px; }

/* Resource links */
.res-link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 0;
  font-size: 13.5px;
  border-bottom: 1px solid var(--border);
}
.res-link:last-child { border-bottom: none; }
.res-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  border-bottom: 1px dotted currentColor;
}
.res-link a:hover { color: var(--accent2); }

/* Toast */

const GLOSSARY = [
  ["Food cost %", "Ingredient cost as a share of selling price. Below ~30% of retail is the typical healthy zone for baked goods."],
  ["COGS", "Cost of Goods Sold — everything that goes into one saleable unit: ingredients, packaging, and direct labor."],
  ["Gross margin", "(Price − unit cost) ÷ price. A $12 item costing $4.20 to make has a 65% gross margin."],
  ["MSRP", "Manufacturer's Suggested Retail Price — what the customer pays at retail."],
  ["Wholesale price", "What retailers pay you, typically 50% of MSRP, leaving them room to double it."],
  ["Consignment", "Retailer only pays after the item sells. Risky for perishables — prefer true wholesale purchase."],
  ["Cottage food law", "State laws allowing sale of certain low-risk foods made in home kitchens, usually with caps and labeling rules."],
  ["Food handler card", "Basic food safety certification required in many jurisdictions for anyone selling food."],
  ["Commissary / shared kitchen", "Licensed commercial kitchen you rent by the hour — required for most non-cottage food production."],
  ["Co-packer", "A manufacturer that produces your recipe at scale for you — the scale-up step when demand beats capacity."],
  ["HACCP", "Hazard Analysis Critical Control Points — a formal food safety plan, sometimes required for wholesale or high-risk items."],
  ["Shelf life", "How long a product stays safe and saleable — drives packaging, channel choice, and label claims."],
  ["Par level", "The minimum stock you must have on hand; below par triggers production or purchasing."],
  ["SKU", "Stock Keeping Unit — one distinct product/variant you sell. Fewer SKUs early = simpler ops."],
  ["MOQ", "Minimum Order Quantity — the smallest wholesale order you'll accept."],
  ["Net terms", "Payment window for wholesale buyers, e.g., 'Net 15' = invoice due in 15 days."],
  ["Drop", "A limited, dated release of product. Creates urgency and matches supply to real demand."],
  ["UGC", "User-Generated Content — customer photos and reviews you repost. The cheapest, most credible marketing there is."]

  if (id === _current) return;
  _current = id;

  $$(".page").forEach(p => p.classList.remove("on"));
  const el = document.getElementById("page-" + id);
  if (el) el.classList.add("on");

  $$(".nav-item").forEach(a => {

    a.classList.toggle("active", match);

    else a.removeAttribute("aria-current");
  });

  $("#main-scroll").scrollTop = 0;
  if (id === "tool-breakeven") requestAnimationFrame(drawBE);
  if (id === "tool-compliance") renderCompliance();
  history.replaceState(null, "", "#" + id);

let _focusTrap = null;
function openModal(html, onClose) {
  closeModal();
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.setAttribute("role", "dialog");
  ov.setAttribute("aria-modal", "true");
  ov.innerHTML = `<div class="modal-box">${html}</div>`;
  ov.querySelector(".modal-box").insertAdjacentHTML("afterbegin",
    `<button class="modal-close" aria-label="Close">✕</button>`);
  document.body.appendChild(ov);
  const close = () => { ov.remove(); if (onClose) onClose(); };
  ov.querySelector(".modal-close").addEventListener("click", close);
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
  });
  // Focus trap
  const focusable = ov.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  const first = focusable[0], last = focusable[focusable.length - 1];
  ov.addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
    else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
  });
  (first || ov).focus();
}
function closeModal() { $$(".modal-overlay").forEach(m => m.remove()); }

/* ============================================================
   PROGRESS
============================================================ */
function totalSteps() { return STAGES.reduce((a, s) => a + s.steps.length, 0); }
function doneFor(s)   { return s.steps.filter(st => ST.checks[st.id]).length; }

function updateProgress() {
  const total = totalSteps();
  const done  = STAGES.reduce((a, s) => a + doneFor(s), 0);
  const pct   = total ? Math.round(done / total * 100) : 0;

  // Ring
  const C = 2 * Math.PI * 14; // r=14 → circumference ≈ 87.96
  const fill = $("#ring-fill");
  if (fill) fill.style.strokeDashoffset = C * (1 - pct / 100);

  const rtxt = $("#ring-text");
  if (rtxt) rtxt.innerHTML = `<b>${pct}%</b> done`;

  STAGES.forEach(s => {
    const d = doneFor(s), len = s.steps.length;
    const pctS = len ? d / len : 0;
    const nb = $("#nb-" + s.id);   if (nb) nb.textContent = `${d}/${len}`;
    const hb = $("#hb-" + s.id);   if (hb) hb.style.width = (pctS * 100) + "%";
    const sc = $("#sc-" + s.id);   if (sc) sc.textContent = `${d}/${len} done`;
    const sm = $("#sm-" + s.id);   if (sm) sm.textContent = d === len
      ? "✅ Stage complete. Momentum looks good on you."
      : `Progress: ${d} of ${len} steps complete.`;
  });
}

function restoreChecks() {
  $$(".step-cb").forEach(cb => {
    const on = !!ST.checks[cb.dataset.step];
    cb.checked = on;
    cb.closest(".step-item").classList.toggle("done", on);
  });
}

      <td><input type="number" style="width:80px" min="0" step="any" data-i="${i}" data-f="pkgQty" value="${r.pkgQty}" aria-label="Pack size"></td>
      <td><input type="text" style="width:50px" data-i="${i}" data-f="unit" value="${r.unit}" aria-label="Unit"></td>
      <td><input type="number" style="width:80px" min="0" step="any" data-i="${i}" data-f="used" value="${r.used}" aria-label="Amount used per batch"></td>
      <td class="ing-cost-cell" id="ic-${i}"></td>
      <td><button class="btn btn-ghost btn-sm" data-del="${i}" aria-label="Remove ${r.name}">✕</button></td>
    </tr>`).join("");

  tb.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = +inp.dataset.i, f = inp.dataset.f;
      ST.ingredients[i][f] = (f === "name" || f === "unit") ? inp.value : (parseFloat(inp.value) || 0);
      save(); computeCost();
    });
  });
  tb.querySelectorAll("[data-del]").forEach(b => {

    });

function computeCost() {
  let ingTotal = 0;
  ST.ingredients.forEach((r, i) => {
    const cost = r.pkgQty > 0 ? r.used * (r.pkg / r.pkgQty) : 0;
    ingTotal += cost;
    const cell = document.getElementById("ic-" + i);
    if (cell) cell.textContent = fmt$(cost);
  });
  const y      = num($("#cYield")),
        mins   = num($("#cLabor")),
        wage   = num($("#cWage")),
        ov     = num($("#cOver")),
        pack   = num($("#cPack")),
        margin = num($("#cMargin"));
  const labor    = mins / 60 * wage;
  const overhead = (ingTotal + labor) * ov / 100;
  const batch    = ingTotal + labor + overhead;
  const unit     = y > 0 ? batch / y + pack : 0;
  const price    = margin < 100 ? unit / (1 - margin / 100) : 0;
  const whole    = price * 0.5;
  const foodPct  = price > 0 ? unit / price * 100 : 0;

  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set("#oIng",     fmt$(ingTotal));
  set("#oBatch",   fmt$(batch));
  set("#oUnit",    fmt$(unit));
  set("#oPrice",   fmt$(price));
  set("#oWhole",   fmt$(whole));
  set("#oFoodPct", price > 0 ? foodPct.toFixed(1) + "%" : "—");

  const note = $("#oNote");
  if (note) {
    if (foodPct <= 35 && price > 0)
      note.innerHTML = `✅ Healthy zone: cost is <b>${foodPct.toFixed(0)}%</b> of retail. Round <b>${fmt$(price)}</b> to a market price like <b>${fmt$(Math.ceil(price) - 0.05)}</b> and re-check margin.`;
    else if (price > 0)
      note.innerHTML = `⚠️ Cost is <b>${foodPct.toFixed(0)}%</b> of retail — thin. Reformulate, buy in bulk, shrink portion, or raise price.`;
    else
      note.textContent = "Enter a target margin to see pricing.";
  }
  ST.lastCosting = { unitCost: unit, price };
}

function exportCSV() {

function bindBE() {
  ["beFixed", "bePrice", "beVarc"].forEach(id => {

    el.addEventListener("input", () => {

    });

  if (imp) imp.addEventListener("click", () => {
    if (ST.lastCosting && ST.lastCosting.price > 0) {
      const pEl = $("#bePrice"), vEl = $("#beVarc");
      if (pEl) pEl.value = ST.lastCosting.price.toFixed(2);
      if (vEl) vEl.value = ST.lastCosting.unitCost.toFixed(2);
      ST.be.price = ST.lastCosting.price;
      ST.be.varc  = ST.lastCosting.unitCost;
      save(); drawBE();
      toast("Imported from Costing Lab ✓", "ok");
    } else {
      toast("Run the Costing Lab first, then come back here.", "warn");
    }
  });
  window.addEventListener("resize", () => {
    if (document.getElementById("page-tool-breakeven").classList.contains("on")) drawBE();
  });
  drawBE();
}

function drawBE() {
  const cv = $("#beCanvas");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 680, h = 260;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const fixed = num($("#beFixed")), price = num($("#bePrice")), vc = num($("#beVarc"));
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  // Get CSS variables for theme-aware colors
  const cs = getComputedStyle(document.documentElement);
  const colGrid   = cs.getPropertyValue("--border").trim() || "#eee";
  const colText   = cs.getPropertyValue("--ink3").trim()   || "#888";
  const colAccent = cs.getPropertyValue("--accent").trim() || "#c2410c";
  const colGold   = cs.getPropertyValue("--gold").trim()   || "#d97706";
  const colOk     = cs.getPropertyValue("--ok").trim()     || "#15803d";

  if (!(price > vc) || fixed <= 0) {
    set("#beContrib", price > vc ? fmt$(price - vc) : "—");
    set("#beUnits", "—"); set("#beRev", "—"); set("#beWeek", "—");
    ctx.fillStyle = colText;
    ctx.font = "14px 'Inter', system-ui";
    ctx.fillText(fixed <= 0 ? "Enter monthly fixed costs to begin." : "Price must be above variable cost per unit.", 24, h / 2);
    return;
  }

  const contrib = price - vc;
  const be      = fixed / contrib;
  const maxU    = Math.ceil(be * 2.2);
  set("#beContrib", fmt$(contrib));
  set("#beUnits",   Math.ceil(be).toLocaleString() + " units");
  set("#beRev",     fmt$(Math.ceil(be) * price));
  set("#beWeek",    (Math.ceil(be) / 4.33).toFixed(0) + " units");

  const L = 72, R = 20, T = 22, B = 38;
  const minP = -fixed, maxP = fixed;
  const X = u => L + (w - L - R) * u / maxU;
  const Y = p => T + (h - T - B) * (1 - (p - minP) / (maxP - minP));

  // Grid lines
  ctx.strokeStyle = colGrid; ctx.lineWidth = 1;
  ctx.font = `11px 'Inter', system-ui`;
  ctx.fillStyle = colText;
  for (let i = 0; i <= 4; i++) {
    const p = minP + (maxP - minP) * i / 4;
    const y = Y(p);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w - R, y); ctx.stroke();
    const label = (p < 0 ? "-$" : "$") + Math.abs(Math.round(p)).toLocaleString();
    ctx.fillText(label, 4, y + 4);
  }
  // Zero line dashed
  ctx.strokeStyle = colText; ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(w - R, Y(0)); ctx.stroke();
  ctx.setLineDash([]);

  // X labels
  ctx.fillText("0", L - 6, h - 10);
  const maxLabel = maxU.toLocaleString() + " units";
  ctx.fillText(maxLabel, w - R - ctx.measureText(maxLabel).width, h - 10);

  // Profit line
  ctx.strokeStyle = colAccent; ctx.lineWidth = 2.5;
  ctx.beginPath();
  const step = Math.max(1, Math.floor(maxU / 300));
  for (let u = 0; u <= maxU; u += step) {
    const p = u * contrib - fixed;
    const px = X(u), py = Y(Math.max(minP, Math.min(maxP, p)));
    u === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Break-even dot
  const bx = X(be), by = Y(0);
  ctx.fillStyle = colOk;
  ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
  ctx.font = `bold 12px 'Inter', system-ui`;
  ctx.fillStyle = colOk;
  ctx.fillText(`break-even: ${Math.ceil(be)} units`, Math.min(bx + 10, w - 160), by - 10);
}

  if (c.xstate) chHtml.push(["Shipping across state lines",

  out.innerHTML = `

}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderIdeas() {
  const b = +$("#ideaBudget").value, out = $("#ideaOut");
  const pool  = IDEAS.filter(i => i.b <= b);

function bindSnapshot() {
  const exportBtn = $("#exportBtn");

  });

  const dropZone = $("#dropZone"), fileInput = $("#importFile");
  if (dropZone && fileInput) {
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault(); dropZone.classList.remove("drag-over");
      const f = e.dataTransfer.files[0];
      if (f) loadFile(f);
    });
    fileInput.addEventListener("change", () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
  }

  const resetBtn2 = $("#resetBtn2");
  if (resetBtn2) resetBtn2.addEventListener("click", () => {
    openModal(`
      <div class="modal-title">Reset workspace?</div>
      <div class="modal-sub">This clears all checklist progress, costing inputs, and tool settings. Export first if you want a backup.</div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn" style="background:var(--bad)" id="confirmReset">Yes, reset everything</button>
        <button class="btn btn-ghost" id="cancelReset">Cancel</button>
      </div>`, null);
    setTimeout(() => {
      const ok = $("#confirmReset"), no = $("#cancelReset");
      if (ok) ok.addEventListener("click", () => {
        try { localStorage.removeItem(KEY); } catch {}
        location.reload();
      });
      if (no) no.addEventListener("click", closeModal);
    }, 50);
  });
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== "object" || !parsed) throw new Error("Invalid");
      const d = defaultState();
      ST = { ...d, ...parsed, calc: { ...d.calc, ...(parsed.calc || {}) }, be: { ...d.be, ...(parsed.be || {}) }, compliance: { ...d.compliance, ...(parsed.compliance || {}) }, ideas: { ...d.ideas, ...(parsed.ideas || {}) } };
      save();
      location.reload();
    } catch {
      toast("Could not load that file — is it a valid workspace.json?", "warn");
    }
  };
  reader.readAsText(file);
}

function bindGlobal() {
  document.addEventListener("click", e => {
    const goEl = e.target.closest("[data-go]");
    if (goEl) { show(goEl.dataset.go); return; }

    const copyEl = e.target.closest("[data-copy]");
    if (copyEl) {
      const txt = document.getElementById(copyEl.dataset.copy)?.innerText || "";
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
        .then(() => { copyEl.textContent = "✅ Copied!"; setTimeout(() => copyEl.textContent = "📋 Copy", 1600); })
        .catch(() => {
          const r = document.createRange();
          const el = document.getElementById(copyEl.dataset.copy);
          if (el) { r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand("copy"); sel.removeAllRanges(); }
          copyEl.textContent = "✅ Copied!"; setTimeout(() => copyEl.textContent = "📋 Copy", 1600);
        });
      return;
    }

    // Close theme popover when clicking outside
    const tp = $(".theme-popover");
    if (tp && !tp.contains(e.target) && !e.target.closest("#themeToggle")) {
      tp.remove();
    }
  });

  // Step checkboxes
  document.addEventListener("change", e => {
    if (e.target.classList.contains("step-cb")) {
      ST.checks[e.target.dataset.step] = e.target.checked;
      e.target.closest(".step-item").classList.toggle("done", e.target.checked);
      save(); updateProgress();
    }
  });

  // Reset on home page
  document.addEventListener("click", e => {
    if (e.target.id === "resetBtn") {
      openModal(`
        <div class="modal-title">Reset all progress?</div>
        <div class="modal-sub">This clears all checklist progress, tool inputs, and settings. Export first if you want a backup.</div>
        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn" style="background:var(--bad)" id="confirmReset">Yes, reset</button>
          <button class="btn btn-ghost" id="cancelReset">Cancel</button>
        </div>`, null);
      setTimeout(() => {
        const ok = $("#confirmReset"), no = $("#cancelReset");
        if (ok) ok.addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch {} location.reload(); });
        if (no) no.addEventListener("click", closeModal);
      }, 50);
    }
  });

  // Internal resource links (#tool-cost, #tool-breakeven)
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#']");
    if (a) {
      e.preventDefault();
      const target = a.getAttribute("href").replace("#", "");
      if (target) show(target);
    }
  });
}

/* ============================================================
   THEME POPOVER
============================================================ */
function buildThemePopover() {
  const btn = $("#themeToggle");
  if (!btn) return;
  btn.addEventListener("click", e => {
    e.stopPropagation();
    let existing = $(".theme-popover");
    if (existing) { existing.remove(); return; }
    const pop = document.createElement("div");
    pop.className = "theme-popover";
    pop.setAttribute("role", "menu");
    pop.innerHTML = THEMES.map(t => `
      <button class="theme-option ${ST.theme === t.id ? "active" : ""}" data-theme="${t.id}" role="menuitem">
        <div class="theme-swatch" style="background:${t.swatch}"></div>
        ${t.label}
      </button>`).join("");
    pop.addEventListener("click", e => {
      const btn2 = e.target.closest("[data-theme]");
      if (btn2) { applyTheme(btn2.dataset.theme); pop.remove(); }
    });
    const wrap = btn.closest(".header-right");
    if (wrap) {
      wrap.style.position = "relative";
      wrap.appendChild(pop);
    }
  });
}

/* ============================================================
   FULLSCREEN
============================================================ */
function bindFullscreen() {
  const btn = $("#fsBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      btn.textContent = "⛶";
      btn.setAttribute("aria-label", "Exit fullscreen");
    } else {
      document.exitFullscreen().catch(() => {});
      btn.textContent = "⛶";
      btn.setAttribute("aria-label", "Enter fullscreen");
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) btn.textContent = "⛶";
  });
}

/* ============================================================
   POPSTATE (back/forward navigation)
============================================================ */
function bindPopstate() {
  window.addEventListener("popstate", () => {
    const hash = location.hash.replace("#", "") || "home";
    _current = "";
    show(hash);
  });
}

/* ============================================================
   INIT
============================================================ */
function init() {
  // Apply saved theme
  applyTheme(ST.theme || "light");

  buildNav();
  buildPages();
  bindGlobal();
  restoreChecks();
  updateProgress();
  bindCost();
  bindBE();
  bindQuiz();
  bindCompliance();
  bindLaunch();
  bindIdeas();
  bindSnapshot();
  buildThemePopover();
  bindFullscreen();
  bindPopstate();

  // Initial route
  const startHash = location.hash.replace("#", "") || "home";
  show(startHash);
}

// DOM ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
