<script>
      const canvas = document.getElementById('magic-bg');

      let width, height, particles;
      
      function initParticles() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 100; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2 + 1,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            color: ['#F5B301', '#5DA832', '#BEE7FF', '#E4572E'][Math.floor(Math.random() * 4)]
          });
        }
      }
      
      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.6;
          ctx.fill();

<script>

      function playPop(freq = 400) {

        osc.type = 'sine';

        gain.gain.setValueAtTime(0.5, window.audioCtx.currentTime);

      function toggleRainFuzz() {

        if (window.rainNode) {

          window.rainNode = null;

        }
        const bufferSize = window.audioCtx.sampleRate * 2;

        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {

        filter.frequency.value = 1000;

        filter.connect(window.audioCtx.destination);
        noise.start();
        window.rainNode = noise;

                this.dragTarget = atom;
                atom.dragging = true;
                playPop(600 - atom.radius*5);
                break;
              }
            }
          };
          
          const move = (e) => {
            if (!this.dragTarget) return;
            e.preventDefault();
            this.lastMouseX = this.mouseX;
            this.lastMouseY = this.mouseY;
            const pos = getPos(e);
            this.mouseX = pos.x;
            this.mouseY = pos.y;
            
            // Optical prism effect (Rainbow trail)
            if (Math.random() > 0.5) {
                this.particles.push({
                    x: this.mouseX, y: this.mouseY,
                    vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                    life: 1.0, color: `hsl(${Math.random()*360}, 100%, 50%)`
                });
            }
          };
          
          const up = (e) => {
            if (this.dragTarget) {
               // Throw physics
               this.dragTarget.vx = (this.mouseX - this.lastMouseX) * 0.5;
               this.dragTarget.vy = (this.mouseY - this.lastMouseY) * 0.5;
               this.dragTarget.dragging = false;
               this.dragTarget = null;
               playPop(300);
            }
          };
          
          this.canvas.addEventListener('mousedown', down);
          this.canvas.addEventListener('mousemove', move);
          window.addEventListener('mouseup', up);
          this.canvas.addEventListener('touchstart', down, {passive: false});
          this.canvas.addEventListener('touchmove', move, {passive: false});
          window.addEventListener('touchend', up);
        }
        
        loop() {
          this.syncSize();
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          
          // Gravity and physics
          const gravity = 0.4;
          const bounce = -0.8;
          const friction = 0.98;
          
          for (let atom of this.atoms) {
            if (atom.dragging) {
              atom.x += (this.mouseX - atom.x) * 0.3;
              atom.y += (this.mouseY - atom.y) * 0.3;
              atom.vx = 0; atom.vy = 0;
            } else {
              atom.vy += gravity;
              atom.vx *= friction;
              atom.vy *= friction;
              atom.x += atom.vx;
              atom.y += atom.vy;
              
              // Floor collision
              if (atom.y + atom.radius > this.canvas.height) {
                atom.y = this.canvas.height - atom.radius;
                atom.vy *= bounce;
                if (Math.abs(atom.vy) > 2) playPop(100 + Math.random()*100);
              }
              // Wall collisions
              if (atom.x + atom.radius > this.canvas.width) {
                atom.x = this.canvas.width - atom.radius;
                atom.vx *= bounce;
              } else if (atom.x - atom.radius < 0) {
                atom.x = atom.radius;
                atom.vx *= bounce;
              }
            }
            
            // Draw atom
            this.ctx.beginPath();
            this.ctx.arc(atom.x, atom.y, atom.radius, 0, Math.PI*2);
            this.ctx.fillStyle = atom.color;
            this.ctx.fill();
            this.ctx.lineWidth = 4;
            this.ctx.strokeStyle = '#fff';
            this.ctx.stroke();
            
            // Cute face
            this.ctx.fillStyle = '#000';
            this.ctx.beginPath(); this.ctx.arc(atom.x - 10, atom.y - 5, 4, 0, Math.PI*2); this.ctx.fill();
            this.ctx.beginPath(); this.ctx.arc(atom.x + 10, atom.y - 5, 4, 0, Math.PI*2); this.ctx.fill();
            this.ctx.beginPath(); this.ctx.arc(atom.x, atom.y + 10, 6, 0, Math.PI); this.ctx.fill();
          }
          
          // Draw particles (Prism trail)
          for (let i = this.particles.length - 1; i >= 0; i--) {
             let p = this.particles[i];
             p.x += p.vx; p.y += p.vy; p.life -= 0.05;
             this.ctx.globalAlpha = Math.max(0, p.life);
             this.ctx.fillStyle = p.color;
             this.ctx.beginPath(); this.ctx.arc(p.x, p.y, 8*p.life, 0, Math.PI*2); this.ctx.fill();
             if (p.life <= 0) this.particles.splice(i, 1);
          }
          this.ctx.globalAlpha = 1.0;
          
          requestAnimationFrame(() => this.loop());
        }
      }

      // Upgrade existing MutationObserver to hook new canvases
      const originalObserver = new MutationObserver((mutations) => {
        mutations.forEach(mut => {
          mut.addedNodes.forEach(node => {
            if (node.nodeType === 1) {
              let canvases = node.querySelectorAll ? node.querySelectorAll('canvas:not(#magic-bg)') : [];
              if (node.tagName === 'CANVAS' && node.id !== 'magic-bg') canvases = [node];
              
              canvases.forEach(cvs => {
                if (!cvs.dataset.hijacked) {
                   cvs.dataset.hijacked = "true";
                   new KidPhysicsLayer(cvs);
                }
              });
            }
          });
        });
      });
      
      // Start observing immediately for any new canvases
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root) {
          originalObserver.observe(root, { childList: true, subtree: true });
          // Also hijack any already existing canvases
          const existing = root.querySelectorAll('canvas:not(#magic-bg)');
          existing.forEach(cvs => {
             if (!cvs.dataset.hijacked) {
                cvs.dataset.hijacked = "true";
                new KidPhysicsLayer(cvs);
             }
          });
        }
      }, 1000);
</script>
