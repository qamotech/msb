  <body>
    <div id="root"></div>
  
<script>
  // Continuum rAF Lifecycle Guard
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      window._continuum_paused = true;
    } else {
      window._continuum_paused = false;
    }
  });
</script>

  <!-- ContinuumOS Universal Keyboard Command HUD -->
  <div id="continuum-hud" style="display:none;position:fixed;inset:0;background:rgba(4,7,17,0.85);backdrop-filter:blur(10px);z-index:99999;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;animation:continuumFadeIn .2s ease-out">
    <div style="background:#0a0f20;border:1px solid #1a2542;border-radius:16px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.6);padding:24px;position:relative;animation:continuumSlideUp .25s cubic-bezier(.16,1,.3,1)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #1a2542;padding-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:24px">🛠️</span>
          <div>
            <div style="font-weight:700;font-size:15px;color:#f8fafc">aiws Command HUD</div>
            <div style="font-size:11px;color:#94a3b8">ContinuumOS Autonomous Engine Active</div>
          </div>
        </div>
        <button onclick="document.getElementById('continuum-hud').style.display='none'" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#040714;border-radius:8px">
          <span style="color:#94a3b8">Toggle Command HUD</span>
          <kbd style="background:#1a2542;color:#38bdf8;padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;border:1px solid rgba(56,189,248,0.3)">? / Ctrl+K</kbd>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#040714;border-radius:8px">
          <span style="color:#94a3b8">Close Overlay</span>
          <kbd style="background:#1a2542;color:#38bdf8;padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;border:1px solid rgba(56,189,248,0.3)">Esc</kbd>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#040714;border-radius:8px">
          <span style="color:#94a3b8">Toggle Fullscreen</span>
          <kbd style="background:#1a2542;color:#38bdf8;padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;border:1px solid rgba(56,189,248,0.3)">F11</kbd>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#040714;border-radius:8px">
          <span style="color:#94a3b8">Reload Workspace</span>
          <kbd style="background:#1a2542;color:#38bdf8;padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;border:1px solid rgba(56,189,248,0.3)">Ctrl+R</kbd>
        </div>
      </div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid #1a2542;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b">
        <span>Autonomous Health: <strong style="color:#10b981">100% Verified</strong></span>
        <span>Cadence: 10m</span>
      </div>
    </div>
  </div>
  <style id="continuum-hud-anim">
    @keyframes continuumFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes continuumSlideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
  <script id="continuum-hud-script">
    (function() {
      window.addEventListener("keydown", function(e) {
        if ((e.key === "?" && !["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) || ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K"))) {
          e.preventDefault();
          var h = document.getElementById("continuum-hud");
          if (h) h.style.display = (h.style.display === "none" || !h.style.display) ? "flex" : "none";
        } else if (e.key === "Escape") {
          var h = document.getElementById("continuum-hud");
          if (h && h.style.display !== "none") h.style.display = "none";
        }
      });
    })();
  </script>
