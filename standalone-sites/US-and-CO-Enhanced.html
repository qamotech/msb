<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16090f">
  <meta name="description" content="Seven rounds of good guesses, honest questions, and stories you have not heard yet.">
  <title>US &amp; CO. — The Couples Game</title>
  <style>
    :root{
      --night:#16090f;--wine:#35111f;--ink:#190c12;--red:#ef4f4f;--cream:#f3eadb;
      --paper:#fffaf0;--blush:#eab8ac;--muted:#a78f93;--line:rgba(243,234,219,.16);
      --serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --shadow:0 28px 80px rgba(0,0,0,.34)
    }
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--night);scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--sans);
      background:radial-gradient(circle at 15% 8%,rgba(198,47,59,.25),transparent 28rem),
      radial-gradient(circle at 90% 70%,rgba(99,35,55,.23),transparent 34rem),
      linear-gradient(150deg,#170a10,#0e070a)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;
      background-image:radial-gradient(rgba(255,255,255,.18) .6px,transparent .6px);
      background-size:5px 5px}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
      outline:3px solid #ff9f91;outline-offset:3px}
    h1,h2,h3,p{margin-top:0}
    p{color:var(--muted);line-height:1.65}
    .shell{position:relative;min-height:100vh;overflow:hidden;padding:0 clamp(15px,4vw,64px)}
    .topbar{width:min(1180px,100%);height:86px;margin:auto;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between}
    .brand{border:0;background:none;padding:0;display:flex;align-items:center;gap:11px;cursor:pointer;
      font-weight:900;letter-spacing:.12em}
    .brand-mark{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;
      background:var(--red);color:var(--ink);font-size:.75rem}
    .brand i,.logo-end i{color:var(--red);font-family:var(--serif);font-style:normal;font-weight:400}
    .top-actions{display:flex;gap:8px}
    .round,.home-link{height:40px;min-width:40px;border:1px solid var(--line);border-radius:999px;
      background:rgba(255,255,255,.035);cursor:pointer}
    .home-link{padding:0 15px;color:var(--blush);font-size:.72rem;font-weight:900;
      letter-spacing:.1em;text-transform:uppercase}
    .eyebrow{color:var(--red);font-size:.7rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
    .button{min-height:54px;padding:0 23px;border:1px solid transparent;border-radius:999px;
      display:inline-flex;align-items:center;justify-content:center;gap:16px;cursor:pointer;
      font-size:.84rem;font-weight:900;transition:.16s ease}
    .button:hover{transform:translateY(-2px)}
    .button:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .primary{background:var(--red);color:var(--ink);box-shadow:0 10px 30px rgba(239,79,79,.2)}
    .dark{background:var(--ink);color:var(--cream);border-color:rgba(255,255,255,.1)}
    .ghost{background:transparent;border-color:var(--line)}
    .view{animation:enter .35s cubic-bezier(.2,.75,.25,1) both}
    .setup{width:min(1180px,100%);min-height:calc(100vh - 150px);margin:auto;padding:60px 0 90px;
      display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(40px,9vw,130px);align-items:center}
    .setup h1,.hero h1,.custom-copy h1,.recap h1{margin:17px 0 25px;font-size:clamp(3.2rem,7vw,6.7rem);
      line-height:.88;letter-spacing:-.065em}
    h1 em,h2 em{color:var(--blush);font-family:var(--serif);font-weight:400}
    .setup-copy>p{max-width:590px;font-size:1.05rem;color:#bea8aa}
    .proof{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:30px;color:#baa5a8;font-size:.74rem}
    .proof span:before{content:"✦";color:var(--red);margin-right:8px}
    .paper{padding:clamp(28px,5vw,44px);border-radius:3px;background:var(--paper);color:var(--ink);
      box-shadow:var(--shadow)}
    .paper h2{margin:12px 0 6px;font:400 2rem var(--serif)}
    label{display:grid;gap:8px;margin-bottom:17px;color:#725f60;font-size:.68rem;font-weight:900;
      letter-spacing:.12em;text-transform:uppercase}
    input,textarea,select{width:100%;border:1px solid rgba(25,12,18,.16);border-radius:8px;
      background:#fffdf7;color:var(--ink)}
    input,select{min-height:52px;padding:0 14px}
    textarea{min-height:110px;padding:14px;resize:vertical}
    .paper>.button,.paper form>.button{width:100%}
    .home{width:min(1180px,100%);margin:auto;padding:44px 0 75px}
    .hero{position:relative;min-height:510px;overflow:hidden;padding:clamp(35px,6vw,78px);
      border:1px solid rgba(234,184,172,.13);border-radius:4px;display:grid;grid-template-columns:1.2fr .8fr;
      align-items:center;background:radial-gradient(circle at 76% 40%,rgba(239,79,79,.14),transparent 24rem),
      linear-gradient(135deg,rgba(64,18,32,.72),rgba(22,9,15,.92))}
    .hero:after{content:"";position:absolute;inset:15px;border:1px solid rgba(234,184,172,.08);pointer-events:none}
    .hero-copy{position:relative;z-index:2;max-width:680px}
    .hero h1{font-size:clamp(3.7rem,7vw,6.4rem)}
    .hero-copy>p{max-width:520px;color:#c2abad}
    .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:33px}
    .deck-art{position:relative;height:370px}
    .art-card{position:absolute;left:50%;top:50%;width:200px;aspect-ratio:.7;border-radius:13px;
      display:grid;place-items:center;box-shadow:0 30px 60px rgba(0,0,0,.35);font-size:2.5rem}
    .art-back{background:#e6d9c7;color:#c62f3b;transform:translate(-34%,-53%) rotate(13deg)}
    .art-front{background:var(--red);color:var(--wine);transform:translate(-66%,-46%) rotate(-10deg)}
    .art-front:before,.art-front:after{content:"♥";position:absolute;left:16px;top:14px;font-size:.8rem}
    .art-front:after{left:auto;right:16px;top:auto;bottom:14px;transform:rotate(180deg)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-top:0}
    .stats>div{min-height:96px;padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;
      border-right:1px solid var(--line)}
    .stats>div:last-child{border-right:0}
    .stats strong{color:var(--blush);font:400 2rem var(--serif)}
    .stats span{max-width:82px;color:#907a7d;font-size:.65rem;line-height:1.3;text-transform:uppercase;letter-spacing:.08em}
    .section-head{margin:75px 0 28px;display:flex;justify-content:space-between;align-items:end}
    .section-head h2{margin:7px 0 0;font:400 clamp(2.2rem,5vw,3.8rem) var(--serif)}
    .link,.back{padding:5px 0;border:0;border-bottom:1px solid currentColor;background:none;color:#ad9598;
      cursor:pointer;font-size:.74rem;font-weight:800}
    .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .mode{position:relative;min-height:325px;overflow:hidden;padding:28px;border:0;border-radius:3px;
      display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:pointer;transition:.2s ease}
    .mode:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
    .mode.red{background:var(--red);color:#210a10}.mode.cream{background:var(--cream);color:var(--ink)}
    .mode.plum{border:1px solid rgba(234,184,172,.15);background:var(--wine)}
    .mode-num{font-size:.64rem;font-weight:900;letter-spacing:.1em;opacity:.65}
    .mode-icon{margin:45px 0 25px;font:400 3rem var(--serif)}
    .mode strong{margin-bottom:10px;font:400 1.65rem var(--serif)}
    .mode .desc{max-width:260px;font-size:.8rem;line-height:1.55;opacity:.7}
    .mode b{margin-top:auto;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
    .lower{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-top:14px}
    .studio,.lore{min-height:122px;padding:22px 26px;border:1px solid var(--line);border-radius:3px;
      background:rgba(255,255,255,.025)}
    .studio{display:flex;align-items:center;gap:19px;text-align:left;cursor:pointer}
    .plus{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:var(--red);color:var(--ink);font-size:1.4rem}
    .studio small,.lore small{display:block;color:var(--red);font-size:.62rem;font-weight:900;
      letter-spacing:.12em;text-transform:uppercase}
    .studio strong,.lore strong{display:block;margin:4px 0;font:400 1.15rem var(--serif)}
    .studio em{color:var(--muted);font-size:.72rem;font-style:normal}
    .studio b{margin-left:auto}.lore{display:grid;align-content:center}
    .badges{display:flex;gap:7px;margin-top:8px}
    .badges i{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;
      place-items:center;color:#5b454c;font-size:.68rem;font-style:normal;font-weight:900}
    .badges i.on{background:var(--red);border-color:var(--red);color:var(--ink)}
    .game{width:min(820px,100%);min-height:calc(100vh - 160px);margin:auto;padding:32px 0 75px}
    .game-meta{margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
    .game-meta span{color:var(--red);font-size:.65rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .progress{height:3px;margin-bottom:20px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
    .progress i{display:block;height:100%;background:var(--red);transition:.3s}
    .game-card{min-height:595px;padding:clamp(28px,6vw,60px);border:1px solid rgba(234,184,172,.14);
      border-radius:4px;background:#210d15;box-shadow:var(--shadow)}
    .question-top{margin-bottom:43px;display:flex;justify-content:space-between;align-items:center;color:#9d8589;
      font-size:.65rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
    .qnum{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;
      color:var(--red);font-family:var(--serif);font-size:.85rem}
    .question{max-width:680px;margin:12px 0 35px;font:400 clamp(2rem,5vw,3.65rem)/1.08 var(--serif);
      letter-spacing:-.03em}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:25px}
    .option{position:relative;min-height:72px;padding:12px 42px 12px 14px;border:1px solid var(--line);
      border-radius:6px;background:rgba(255,255,255,.025);display:flex;align-items:center;gap:12px;
      color:#d7c4c5;text-align:left;cursor:pointer}
    .option span{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;
      background:rgba(255,255,255,.055);color:var(--blush);font-family:var(--serif)}
    .option.selected{border-color:var(--red);background:var(--red);color:var(--ink)}
    .option.selected span{background:rgba(25,12,18,.14);color:var(--ink)}
    .game-card>.button{width:100%}.privacy,.center{text-align:center;font-size:.68rem;margin:13px 0 0}
    .keyboard-hint{margin:8px 0 0;color:#725e64;text-align:center;font-size:.62rem;letter-spacing:.06em}
    .handover{min-height:475px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .pass{width:82px;height:82px;margin-bottom:27px;border:1px solid rgba(239,79,79,.4);border-radius:50%;
      display:grid;place-items:center;color:var(--red);font:400 2.3rem var(--serif);animation:float 1.6s ease-in-out infinite alternate}
    .handover h2,.reveal h2{margin:13px 0 12px;font-size:clamp(2.4rem,6vw,4.6rem);line-height:.98;letter-spacing:-.045em}
    .handover p{margin-bottom:29px}
    .reveal{text-align:center}.reveal h2{color:var(--blush);font-family:var(--serif);font-weight:400}
    .reveal-q{max-width:590px;margin:0 auto 27px}
    .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .answer-grid>div{min-height:125px;padding:20px;border:1px solid var(--line);border-radius:5px;
      display:flex;flex-direction:column;align-items:center;justify-content:center}
    .answer-grid small{margin-bottom:8px;color:var(--muted);font-size:.63rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .answer-grid strong{font:400 1.15rem var(--serif)}
    .stamp{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:4px;color:#bda8a9;
      font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .stamp.win{border-color:var(--red);background:rgba(239,79,79,.12);color:var(--red)}
    .point{text-align:center}.point .question{margin-left:auto;margin-right:auto}
    .countdown{height:145px;margin:10px 0 24px;display:grid;place-items:center;color:var(--red);
      font:400 clamp(3.5rem,10vw,6.5rem) var(--serif)}
    .vote,.result{padding:20px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.02)}
    .vote-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .result strong{display:block;margin-bottom:7px;color:var(--blush);font:400 1.6rem var(--serif)}
    .result .button{width:100%;margin-top:7px}
    .filters{display:flex;gap:7px;overflow:auto;padding:2px 2px 7px;scrollbar-width:none}
    .filters button{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;
      background:transparent;color:var(--muted);white-space:nowrap;cursor:pointer;font-size:.68rem;font-weight:800}
    .filters button.on{background:var(--red);border-color:var(--red);color:var(--ink)}
    .empty-spark{min-height:505px;padding:clamp(34px,7vw,70px);border-radius:4px;background:var(--cream);
      color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .empty-spark h2{max-width:540px;margin:20px 0 11px;font:400 clamp(2.2rem,6vw,4rem)/1.02 var(--serif)}
    .empty-spark p{max-width:440px;color:#826d6d}.empty-spark .button{margin-top:14px}
    .conversation{position:relative;min-height:505px;overflow:hidden;padding:clamp(70px,8vw,80px) clamp(28px,7vw,64px) 52px;
      border-radius:4px;background:var(--cream);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center}
    .card-top{position:absolute;left:clamp(28px,7vw,64px);right:clamp(28px,7vw,64px);top:28px;
      display:flex;justify-content:space-between;align-items:center}
    .category{padding:7px 12px;border-radius:99px;background:#e7bcd0;color:#502039;font-size:.62rem;
      font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .favorite{width:42px;height:42px;border:1px solid rgba(25,12,18,.14);border-radius:50%;background:none;color:#8f7779;cursor:pointer}
    .favorite.on{background:var(--red);border-color:var(--red);color:var(--ink)}
    .quote{color:var(--red);font:400 5rem/.6 var(--serif)}
    .conversation h2{max-width:650px;margin:24px 0 18px;font:400 clamp(2.3rem,6vw,4.2rem)/1.02 var(--serif);letter-spacing:-.035em}
    .conversation p{color:#826d6d}.logo-end{position:absolute;left:28px;bottom:24px;font-size:.62rem;font-weight:900;letter-spacing:.14em}
    .spark-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .custom{width:min(1050px,100%);min-height:calc(100vh - 150px);margin:auto;padding:52px 0 90px;
      display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(35px,8vw,100px);align-items:start}
    .custom-copy .back{margin-bottom:75px}.custom-copy h1{font-size:clamp(3.2rem,6vw,5.2rem)}
    .segmented{margin-bottom:27px;padding:4px;border-radius:8px;background:#eadfce;display:grid;grid-template-columns:1fr 1fr}
    .segmented button{min-height:41px;border:0;border-radius:6px;background:none;color:#7c6969;cursor:pointer;font-size:.7rem;font-weight:800}
    .segmented button.on{background:var(--paper);color:var(--ink);box-shadow:0 3px 12px rgba(25,12,18,.08)}
    .custom-options{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
    .saved{margin-top:32px;padding-top:24px;border-top:1px solid rgba(25,12,18,.12)}
    .saved-head{display:flex;justify-content:space-between}.saved-head strong{font:400 1.2rem var(--serif)}
    .saved-head span{color:#8b7676;font-size:.66rem;font-weight:800}
    .empty{margin:17px 0 0;padding:19px;border:1px dashed rgba(25,12,18,.16);border-radius:6px;text-align:center;font-size:.75rem}
    .saved-list{max-height:220px;margin-top:14px;overflow:auto}
    .saved-row{padding:12px 0;border-bottom:1px solid rgba(25,12,18,.09);display:grid;grid-template-columns:56px 1fr 30px;gap:9px;align-items:center}
    .saved-row>span{color:#c62f3b;font-size:.56rem;font-weight:900}.saved-row p{margin:0;color:#5f4d4f;font-size:.72rem;line-height:1.35}
    .saved-row button{width:29px;height:29px;border:0;border-radius:50%;background:#eee2d0;color:var(--ink);cursor:pointer}
    .recap-wrap{width:min(1000px,100%);min-height:calc(100vh - 150px);margin:auto;padding:52px 0 90px;
      display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
    .recap{padding:clamp(32px,7vw,65px);border-radius:4px;background:var(--cream);color:var(--ink);text-align:center}
    .recap h1{font-size:clamp(3rem,6vw,5rem)}.recap h1 em{color:#c62f3b}
    .score-ring{width:168px;aspect-ratio:1;margin:0 auto 24px;padding:12px;border-radius:50%;background:conic-gradient(var(--red) var(--score),#dfd1c0 0)}
    .score-ring>div{width:100%;height:100%;border-radius:50%;background:var(--cream);display:grid;place-content:center}
    .score-ring strong{color:#c62f3b;font:400 2.5rem var(--serif)}.score-ring span{color:#8b7676;font-size:.62rem;font-weight:900;text-transform:uppercase}
    .recap>p{max-width:470px;margin:0 auto 27px;color:#756264}
    .recap-stats{padding:19px 0;border-block:1px solid rgba(25,12,18,.11);display:grid;grid-template-columns:repeat(3,1fr)}
    .recap-stats strong,.recap-stats span{display:block}.recap-stats strong{color:#c62f3b;font:400 1.8rem var(--serif)}
    .recap-stats span{color:#8b7778;font-size:.6rem;font-weight:900;text-transform:uppercase}
    .recap-actions{margin-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quote-card{min-height:500px;padding:40px;border-radius:4px;background:var(--wine);display:flex;flex-direction:column}
    .quote-card>span{color:var(--red);font-size:.64rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .quote-card blockquote{margin:auto 0;font:400 clamp(2rem,4vw,3.2rem)/1.08 var(--serif)}
    .footer{width:min(1180px,100%);min-height:70px;margin:auto;padding:18px 0;border-top:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;color:#796368;font-size:.68rem}
    .footer button{border:0;border-bottom:1px solid currentColor;background:none;color:#796368;cursor:pointer}
    .modal-bg{position:fixed;inset:0;z-index:90;padding:20px;display:grid;place-items:center;background:rgba(9,4,7,.77);backdrop-filter:blur(12px)}
    .modal{position:relative;width:min(530px,100%);max-height:90vh;overflow:auto;padding:clamp(28px,6vw,45px);
      border-radius:4px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
    .modal-close{position:absolute;right:17px;top:17px;width:37px;height:37px;border:1px solid rgba(25,12,18,.12);
      border-radius:50%;background:none;color:var(--ink);cursor:pointer;font-size:1.2rem}
    .modal h2{margin:12px 0;font:400 2rem var(--serif)}.modal ol{list-style:none;padding:0;margin:25px 0}
    .modal li{padding:16px 0;border-bottom:1px solid rgba(25,12,18,.1);display:grid;grid-template-columns:40px 1fr;gap:9px}
    .modal li>span{color:#c62f3b;font-family:var(--serif)}.modal li strong{font-family:var(--serif);font-weight:400}
    .modal li p{margin:3px 0 0;color:#786466;font-size:.75rem}.modal>.button{width:100%}
    .toast{position:fixed;z-index:100;left:50%;bottom:22px;max-width:calc(100vw - 36px);padding:12px 18px;
      border:1px solid rgba(243,234,219,.2);border-radius:99px;background:#2e1520;box-shadow:var(--shadow);
      font-size:.75rem;font-weight:800;opacity:0;pointer-events:none;transform:translate(-50%,20px);transition:.2s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes float{to{transform:translateY(-9px) rotate(4deg)}}
    @media(max-width:900px){
      .setup,.custom{grid-template-columns:1fr}.setup-copy{text-align:center}.setup-copy>p{margin-inline:auto}.proof{justify-content:center}
      .paper{width:min(480px,100%);margin:auto}.hero{grid-template-columns:1fr}.deck-art{position:absolute;width:330px;right:-100px;bottom:-110px;opacity:.22}
      .mode-grid{grid-template-columns:1fr}.mode{min-height:245px}.mode-icon{margin:25px 0 18px}
      .custom-copy .back{margin-bottom:45px}.recap-wrap{grid-template-columns:1fr}.quote-card{min-height:370px}
    }
    @media(max-width:640px){
      .shell{padding:0 14px}.topbar{height:72px}.home-link{display:none}.setup,.home,.custom,.recap-wrap{padding-top:37px}
      .setup h1,.hero h1{font-size:clamp(3rem,15vw,4.5rem)}.proof{display:grid;justify-content:start;text-align:left}
      .hero{min-height:555px;padding:30px 24px;align-items:start}.hero-actions{display:grid}.stats{grid-template-columns:1fr 1fr}
      .stats>div:nth-child(2){border-right:0}.section-head{margin-top:56px}.lower{grid-template-columns:1fr}
      .game{padding-top:23px}.game-card{min-height:565px;padding:27px 20px}.question-top{margin-bottom:31px}
      .options,.answer-grid,.vote-actions,.spark-actions,.recap-actions{grid-template-columns:1fr}
      .conversation{min-height:495px;padding:72px 25px 48px}.card-top{left:23px;right:23px;top:22px}
      .custom-options{grid-template-columns:1fr}.recap{padding:35px 21px}.keyboard-hint{display:none}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (() => {
    "use strict";
    const MATCH = [
      ["When the week gets heavy, what helps {name} reset fastest?",["Quiet time alone","A long hug","Good food","Getting out of the house"]],
      ["Which surprise weekend would make {name} light up most?",["Cabin and a fire","Beach and no schedule","A city adventure","A luxe staycation"]],
      ["What tiny luxury would {name} happily enjoy every day?",["Great coffee","Fresh sheets","A slow shower","Dessert after dinner"]],
      ["Which gesture makes {name} feel most looked after?",["A thoughtful text","A task quietly handled","Unhurried time together","An unexpected treat"]],
      ["If dinner magically appeared tonight, what would {name} choose?",["Comfort-food classic","Something new and fancy","Breakfast for dinner","Takeout on the sofa"]],
      ["Which kind of shared memory does {name} treasure most?",["A trip we took","A hard season we beat","A ridiculous inside joke","A quiet ordinary day"]],
      ["What kind of gift would feel most meaningful to {name}?",["Something handmade","A planned experience","A beautiful upgrade","A heartfelt letter"]],
      ["What is {name}'s perfect slow Sunday?",["Sleep in and cuddle","Coffee and a long walk","Movies under a blanket","Cook something ambitious"]],
      ["What can almost always make {name} laugh?",["A terrible pun","An old story","A funny impression","Pet videos"]],
      ["Which shared upgrade would excite {name} most right now?",["A dream trip","A new home project","A shared hobby","More unscheduled time"]]
    ];
    const LIKELY = [
      "Who is more likely to turn a five-minute errand into an adventure?",
      "Who is more likely to remember the exact words from your first date?",
      "Who is more likely to order dessert before deciding on dinner?",
      "Who is more likely to make friends with a stranger on vacation?",
      "Who is more likely to fall asleep during the movie they chose?",
      "Who is more likely to start a home project at 9 p.m.?",
      "Who is more likely to plan a wildly thoughtful surprise?",
      "Who is more likely to say “we don't need directions”?",
      "Who is more likely to cry at a commercial?",
      "Who is more likely to suggest getting a pet?"
    ];
    const SPARKS = [
      ["Deep","What part of our relationship feels strongest right now?"],
      ["Deep","When do you feel most emotionally safe with me?"],
      ["Deep","What is something you want us to protect, even when life gets busy?"],
      ["Playful","What would our couple mascot be—and what would we name it?"],
      ["Playful","Which one of our inside jokes deserves its own holiday?"],
      ["Playful","If our love story were a movie, what would the trailer voice say?"],
      ["Future","What ordinary day in our future are you most excited to live?"],
      ["Future","What is one adventure we should put on the calendar—not just the someday list?"],
      ["Future","What ritual would you love us to still have ten years from now?"],
      ["Spicy","What kind of kiss from me do you never get tired of?"],
      ["Spicy","What is one thing I do that instantly gets your attention?"],
      ["Appreciation","What small thing have I done lately that made you feel loved?"],
      ["Appreciation","What quality in me are you especially grateful for this season?"],
      ["Appreciation","What do you think we bring out in each other?"]
    ];
    const PLAN = ["match","spark","likely","match","spark","likely","match"];
    const KEY = "us-and-co-enhanced-v1";
    const defaults = {
      view:"setup",names:["Partner 1","Partner 2"],sound:true,help:false,
      stats:{rounds:0,checks:0,matches:0,streak:0,best:0,mixes:0},
      customMatch:[],customSparks:[],favorites:[],matchIndex:-1,likelyIndex:-1,sparkIndex:-1,
      match:null,likelyPhase:"ready",countdown:"READY",likelyResult:null,filter:"All",
      mix:null,customType:"match"
    };
    let state = JSON.parse(JSON.stringify(defaults));
    let audio = null, timers = [], toastTimer = null;
    const app = document.getElementById("app");
    const esc = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const save = () => {
      const copy = {...state,help:false,match:null,likelyPhase:"ready",countdown:"READY",likelyResult:null,mix:null,view:state.view==="setup"?"setup":"home"};
      localStorage.setItem(KEY,JSON.stringify(copy));
    };
    const load = () => {
      try{
        const data = JSON.parse(localStorage.getItem(KEY));
        if(!data || typeof data!=="object") return;
        state = {...state,...data,stats:{...state.stats,...(data.stats||{})}};
        if(!Array.isArray(state.names)||state.names.length!==2) state.names=[...defaults.names];
        state.names=state.names.map((name,i)=>String(name||defaults.names[i]).slice(0,18));
        if(!Array.isArray(state.customMatch)) state.customMatch=[];
        if(!Array.isArray(state.customSparks)) state.customSparks=[];
        if(!Array.isArray(state.favorites)) state.favorites=[];
        if(!["setup","home"].includes(state.view)) state.view=state.names[0]==="Partner 1"?"setup":"home";
        state.customMatch=state.customMatch.slice(0,100);
        state.customSparks=state.customSparks.slice(0,100);
        state.favorites=state.favorites.slice(0,100);
      }catch(_){ state=JSON.parse(JSON.stringify(defaults)); }
    };
    function tone(kind="tap"){
      if("vibrate" in navigator) navigator.vibrate(kind==="win"?[18,30,18]:10);
      if(!state.sound)return;
      try{
        audio ||= new (window.AudioContext||window.webkitAudioContext)();
        const notes = kind==="win"?[523,659,784]:kind==="soft"?[330]:[520];
        notes.forEach((f,i)=>{
          const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;
          o.type=kind==="win"?"triangle":"sine";o.frequency.value=f;
          g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
          o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.18);
        });
      }catch(_){}
    }
    function notify(message){
      let el=document.getElementById("toast");if(!el)return;
      el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>el.classList.remove("show"),2300);
    }
    const deck = () => MATCH.map((q,i)=>({id:"m"+i,prompt:q[0],options:q[1]})).concat(state.customMatch);
    const sparks = () => SPARKS.map((s,i)=>({id:"s"+i,category:s[0],text:s[1]})).concat(state.customSparks);
    const filteredSparks = () => state.filter==="All"?sparks():
      state.filter==="Saved"?sparks().filter(s=>state.favorites.includes(s.id)):
      sparks().filter(s=>s.category===state.filter);
    const sync = () => state.stats.checks?Math.round(state.stats.matches/state.stats.checks*100):0;
    const header = () => `
      <header class="topbar">
        <button class="brand" data-action="${state.view==="setup"?"noop":"home"}" aria-label="US and Company home">
          <span class="brand-mark">♥</span><span>US <i>&amp;</i> CO.</span>
        </button>
        <div class="top-actions">
          ${state.view!=="setup"?'<button class="home-link" data-action="home">Home</button>':""}
          <button class="round" data-action="sound" aria-label="${state.sound?"Turn sound off":"Turn sound on"}" aria-pressed="${state.sound}">${state.sound?"♪":"×"}</button>
          <button class="round" data-action="help" aria-label="How to play">?</button>
        </div>
      </header>`;
    const footer = () => `<footer class="footer"><span>US &amp; CO. — made for the two of you.</span>
      ${state.view==="home"&&state.stats.rounds?'<button data-action="reset">Reset progress</button>':""}</footer>`;
    const modal = () => state.help?`<div class="modal-bg" data-action="close-help"><section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <button class="modal-close" data-action="close-help" aria-label="Close">×</button><span class="eyebrow">No rulebook required</span>
      <h2>How the night works</h2><ol>
      <li><span>01</span><div><strong>Choose the mix</strong><p>Seven rounds blend all three modes into one easy date.</p></div></li>
      <li><span>02</span><div><strong>Pass when prompted</strong><p>Secret answers stay hidden until both players lock in.</p></div></li>
      <li><span>03</span><div><strong>Let the tangent win</strong><p>The best conversation is always more important than the score.</p></div></li>
      </ol><button class="button primary" data-action="close-help">Got it</button></section></div>`:"";
    function setupView(){
      return `<section class="setup view"><div class="setup-copy"><span class="eyebrow">A game for two</span>
        <h1>Put the phones down.<br><em>Keep this one.</em></h1>
        <p>A pocket-sized date night made of good guesses, honest questions, and the stories you somehow have not heard yet.</p>
        <div class="proof"><span>7-round quick mix</span><span>No account</span><span>Answers stay on this device</span></div>
        </div><form class="paper" id="setupForm"><span class="eyebrow">First things first</span><h2>Who's playing?</h2>
        <p>Real names make the reveals much better.</p>
        <label>First player<input name="p1" maxlength="18" placeholder="Add a name" value="${state.names[0]==="Partner 1"?"":esc(state.names[0])}" autofocus></label>
        <label>Second player<input name="p2" maxlength="18" placeholder="Add a name" value="${state.names[1]==="Partner 2"?"":esc(state.names[1])}"></label>
        <button class="button primary" type="submit">Set the mood <span>→</span></button></form></section>`;
    }
    function homeView(){
      return `<div class="home view"><section class="hero"><div class="hero-copy">
        <span class="eyebrow">Tonight belongs to ${esc(state.names[0])} &amp; ${esc(state.names[1])}</span>
        <h1>Two people.<br><em>One very good night.</em></h1>
        <p>Seven rounds. About fifteen minutes. Just enough structure to get you laughing, guessing, and talking.</p>
        <div class="hero-actions"><button class="button primary" data-action="start-mix">Start the 7-round mix <span>→</span></button>
        <button class="button ghost" data-action="help">How it works</button></div></div>
        <div class="deck-art" aria-hidden="true"><div class="art-card art-back">✦</div><div class="art-card art-front">♥</div></div></section>
        <section class="stats" aria-label="Connection stats">
          <div><strong>${state.stats.matches}</strong><span>in-sync moments</span></div><div><strong>${state.stats.best}</strong><span>best streak</span></div>
          <div><strong>${state.stats.rounds}</strong><span>rounds played</span></div><div><strong>${sync()}%</strong><span>sync rate</span></div>
        </section>
        <div class="section-head"><div><span class="eyebrow">Pick your own</span><h2>Choose a mood</h2></div><button class="link" data-action="edit-names">Edit names</button></div>
        <section class="mode-grid">
          <button class="mode red" data-action="mode" data-mode="match"><span class="mode-num">01</span><span class="mode-icon">◎</span><strong>Read My Mind</strong><span class="desc">Secret answers. One brave guess. Instant reveal.</span><b>Play now →</b></button>
          <button class="mode cream" data-action="mode" data-mode="likely"><span class="mode-num">02</span><span class="mode-icon">↗</span><strong>Point Taken</strong><span class="desc">Count to three, point, then defend your choice.</span><b>Play now →</b></button>
          <button class="mode plum" data-action="mode" data-mode="spark"><span class="mode-num">03</span><span class="mode-icon">✦</span><strong>After Hours</strong><span class="desc">Conversation cards from playful to a little spicy.</span><b>Draw a card →</b></button>
        </section>
        <section class="lower"><button class="studio" data-action="custom"><span class="plus">+</span><span><small>Make it yours</small>
          <strong>Custom card studio</strong><em>${state.customMatch.length+state.customSparks.length} ${state.customMatch.length+state.customSparks.length===1?"card":"cards"} in your deck</em></span><b>→</b></button>
          <div class="lore"><small>Your collection</small><strong>Little relationship lore</strong><div class="badges">
          <i class="${state.stats.rounds>=1?"on":""}">♥</i><i class="${state.stats.best>=3?"on":""}">3</i><i class="${state.favorites.length>=3?"on":""}">✦</i></div></div></section>
        </div>`;
    }
    const gameTop = label => `<div class="game-meta"><button class="back" data-action="home">← Leave game</button>
      <span>${state.mix?`Date night mix · ${state.mix.step+1} of 7`:label}</span></div>
      ${state.mix?`<div class="progress"><i style="width:${(state.mix.step+1)/7*100}%"></i></div>`:""}`;
    function matchView(){
      const d=deck(),r=state.match,q=d[r.index],target=state.names[r.target],guesser=state.names[r.target?0:1],
        prompt=q.prompt.replace("{name}",target);
      let body="";
      if(r.phase==="handover") body=`<div class="handover"><span class="pass">↗</span><span class="eyebrow">Secret saved</span>
        <h2>Pass the phone to<br><em>${esc(guesser)}</em></h2><p>${esc(target)}'s answer is hidden. No peeking, please.</p>
        <button class="button primary" data-action="match-ready">I'm ${esc(guesser)} <span>→</span></button></div>`;
      else if(r.phase==="reveal"){
        const correct=r.answer===r.guess;
        body=`<div class="reveal" aria-live="polite"><span class="eyebrow">The reveal</span><h2>${correct?"Same wavelength.":"Plot twist."}</h2>
          <p class="reveal-q">${esc(prompt)}</p><div class="answer-grid"><div><small>${esc(target)} chose</small><strong>${esc(q.options[r.answer])}</strong></div>
          <div><small>${esc(guesser)} guessed</small><strong>${esc(q.options[r.guess])}</strong></div></div>
          <div class="stamp ${correct?"win":""}">${correct?"+1 in-sync moment":"Now you know something new"}</div>
          <button class="button primary" data-action="next-round">${state.mix&&state.mix.step===6?"See our night":"Next round"} <span>→</span></button></div>`;
      }else body=`<div class="question-top"><span class="qnum">Q${String(r.index+1).padStart(2,"0")}</span>
          <span>${r.phase==="answer"?esc(target)+" answers":esc(guesser)+" guesses"}</span></div>
        <span class="eyebrow">${r.phase==="answer"?"Choose honestly":"What did "+esc(target)+" pick?"}</span>
        <h2 class="question">${esc(prompt)}</h2><div class="options" role="radiogroup">
        ${q.options.map((o,i)=>`<button class="option ${r.selected===i?"selected":""}" data-action="choice" data-choice="${i}" role="radio" aria-checked="${r.selected===i}">
          <span>${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join("")}</div>
        <button class="button primary" data-action="submit-match" ${r.selected===null?"disabled":""}>Lock it in <span>→</span></button>
        <p class="privacy">Your choice stays hidden until the reveal.</p><p class="keyboard-hint">Keyboard: press 1–4 to choose</p>`;
      return `<section class="game view">${gameTop("Read My Mind")}<div class="game-card">${body}</div></section>`;
    }
    function likelyView(){
      let action="";
      if(state.likelyPhase==="ready") action=`<button class="button primary" data-action="countdown">Start the countdown</button>`;
      if(state.likelyPhase==="counting") action=`<p class="center">Get those pointing fingers ready…</p>`;
      if(state.likelyPhase==="vote") action=`<div class="vote"><p>Did you point to the same person?</p><div class="vote-actions">
        <button class="button primary" data-action="likely-result" data-match="1">Same person</button>
        <button class="button dark" data-action="likely-result" data-match="0">Different answers</button></div></div>`;
      if(state.likelyPhase==="result") action=`<div class="result"><strong>${state.likelyResult?"Perfectly pointed.":"Okay, defend your choices."}</strong>
        <p>${state.likelyResult?"That counts as an in-sync moment.":"The explanation is usually the best part."}</p>
        <button class="button primary" data-action="next-round">Next prompt <span>→</span></button></div>`;
      return `<section class="game view">${gameTop("Point Taken")}<div class="game-card point"><div class="question-top">
        <span class="qnum">↗</span><span>Both answer at once</span></div><span class="eyebrow">Point taken</span>
        <h2 class="question">${esc(LIKELY[state.likelyIndex])}</h2><div class="countdown" aria-live="assertive">${state.countdown}</div>${action}</div></section>`;
    }
    function sparkView(){
      const pool=filteredSparks(),filters=["All","Saved","Deep","Playful","Future","Spicy","Appreciation"];
      const filterBar=`<div class="filters">${filters.map(f=>`<button class="${state.filter===f?"on":""}" data-action="filter" data-filter="${f}">${f}</button>`).join("")}</div>`;
      if(!pool.length)return `<section class="game view">${gameTop("After Hours")}${filterBar}<div class="empty-spark">
        <span class="quote">♥</span><h2>Your saved deck is waiting.</h2><p>Tap the heart on any conversation card to keep it for another night.</p>
        <button class="button primary" data-action="browse-all">Browse all cards</button></div></section>`;
      const card=pool[Math.max(0,state.sparkIndex%pool.length)],saved=state.favorites.includes(card.id);
      return `<section class="game view">${gameTop("After Hours")}${filterBar}<div class="conversation"><div class="card-top"><span class="category">${esc(card.category)}</span>
        <button class="favorite ${saved?"on":""}" data-action="favorite" aria-label="${saved?"Remove saved card":"Save card"}" aria-pressed="${saved}">♥</button></div>
        <span class="quote">“</span><h2>${esc(card.text)}</h2><p>Take your time. Follow the interesting part.</p>
        <div class="logo-end">US <i>&amp;</i> CO.</div></div><div class="spark-actions">
        <button class="button dark" data-action="another-card">Another card</button>
        <button class="button primary" data-action="complete-spark">We talked <span>→</span></button></div>
        <p class="keyboard-hint">Keyboard: ←/→ to browse · S to save</p></section>`;
    }
    function customView(){
      const all=state.customMatch.map(c=>({...c,type:"SECRET",label:c.prompt})).concat(state.customSparks.map(c=>({...c,type:"SPARK",label:c.text})));
      return `<section class="custom view"><div class="custom-copy"><button class="back" data-action="home">← Back home</button>
        <span class="eyebrow">Custom card studio</span><h1>Your lore.<br><em>Your questions.</em></h1>
        <p>Add the places, jokes, memories, and oddly specific debates that only make sense to you two.</p></div>
        <div class="paper"><div class="segmented"><button class="${state.customType==="match"?"on":""}" data-action="custom-type" data-type="match">Secret-answer card</button>
        <button class="${state.customType==="spark"?"on":""}" data-action="custom-type" data-type="spark">Conversation card</button></div>
        <form id="customForm"><label>${state.customType==="match"?"Question":"Conversation prompt"}<textarea name="prompt" maxlength="160" placeholder="${state.customType==="match"?"What would make Alex's perfect Saturday?":"What memory should we recreate this year?"}"></textarea></label>
        ${state.customType==="match"?`<div class="custom-options">${[0,1,2,3].map(i=>`<label>Choice ${String.fromCharCode(65+i)}
          <input name="o${i}" maxlength="60" placeholder="${i<2?"Required":"Optional"}"></label>`).join("")}</div>`:
          `<label>Mood<select name="category">${["Deep","Playful","Future","Spicy","Appreciation"].map(c=>`<option>${c}</option>`).join("")}</select></label>`}
        <button class="button primary" type="submit">Add to our deck <span>+</span></button></form>
        <div class="saved"><div class="saved-head"><strong>Your cards</strong><span>${all.length} total</span></div>
        ${all.length?`<div class="saved-list">${all.map(c=>`<div class="saved-row"><span>${c.type}</span><p>${esc(c.label)}</p>
          <button data-action="delete-card" data-id="${esc(c.id)}" aria-label="Delete card">×</button></div>`).join("")}</div>`:
          '<p class="empty">Your first custom card will appear here.</p>'}</div></div></section>`;
    }
    function recapView(){
      const score=state.mix.decided?Math.round(state.mix.correct/state.mix.decided*100):0;
      const line=score>=75?"Practically telepathic. Still curious enough to keep it interesting.":
        score>=45?"A lovely mix of knowing and surprising each other.":"More plot twists means more stories to tell. That is a win.";
      return `<section class="recap-wrap view"><div class="recap"><span class="eyebrow">Date night complete</span>
        <h1>That was very<br><em>${esc(state.names[0])} &amp; ${esc(state.names[1])}.</em></h1>
        <div class="score-ring" style="--score:${score*3.6}deg"><div><strong>${score}%</strong><span>in sync</span></div></div>
        <p>${line}</p><div class="recap-stats"><div><strong>${state.mix.correct}</strong><span>matched</span></div>
        <div><strong>${state.mix.talks}</strong><span>good talks</span></div><div><strong>${state.stats.best}</strong><span>best streak</span></div></div>
        <div class="recap-actions"><button class="button primary" data-action="start-mix">Play another mix</button>
        <button class="button dark" data-action="home">Back to home</button></div></div>
        <div class="quote-card"><span>Keep this one</span><blockquote>“The point was never to know every answer. It was to keep asking.”</blockquote>
        <div class="logo-end">US <i>&amp;</i> CO.</div></div></section>`;
    }
    function render(){
      const views={setup:setupView,home:homeView,match:matchView,likely:likelyView,spark:sparkView,custom:customView,recap:recapView};
      app.innerHTML=`<main class="shell">${header()}${views[state.view]()}${footer()}${modal()}<div class="toast" id="toast" role="status"></div></main>`;
      bindForms();
    }
    function bindForms(){
      const setup=document.getElementById("setupForm");
      if(setup)setup.addEventListener("submit",e=>{
        e.preventDefault();const fd=new FormData(setup);
        state.names=[String(fd.get("p1")||"").trim()||"Partner 1",String(fd.get("p2")||"").trim()||"Partner 2"];
        state.view="home";tone("win");save();render();notify(`Welcome, ${state.names[0]} & ${state.names[1]}`);
      });
      const custom=document.getElementById("customForm");
      if(custom)custom.addEventListener("submit",e=>{
        e.preventDefault();const fd=new FormData(custom),prompt=String(fd.get("prompt")||"").trim();
        if(!prompt)return notify("Add a question first");
        if(state.customType==="match"){
          const options=[0,1,2,3].map(i=>String(fd.get("o"+i)||"").trim()).filter(Boolean);
          if(options.length<2)return notify("Add at least two answer choices");
          state.customMatch.push({id:"cm"+Date.now(),prompt,options});
        }else state.customSparks.push({id:"cs"+Date.now(),category:String(fd.get("category")),text:prompt});
        tone("win");save();render();notify("Card added to your private deck");
      });
    }
    function updateStats(matched){
      state.stats.rounds++;state.stats.checks++;if(matched){state.stats.matches++;state.stats.streak++}else state.stats.streak=0;
      state.stats.best=Math.max(state.stats.best,state.stats.streak);
    }
    function startMode(mode){
      if(mode==="match"){
        state.matchIndex=(state.matchIndex+1+deck().length)%deck().length;
        state.match={index:state.matchIndex,target:state.matchIndex%2,phase:"answer",selected:null,answer:null,guess:null};
        state.view="match";
      }else if(mode==="likely"){
        state.likelyIndex=(state.likelyIndex+1+LIKELY.length)%LIKELY.length;state.likelyPhase="ready";
        state.countdown="READY";state.likelyResult=null;state.view="likely";
      }else{
        let pool=filteredSparks();if(!pool.length){state.filter="All";pool=sparks()}
        state.sparkIndex=(state.sparkIndex+1+pool.length)%pool.length;state.view="spark";
      }
      render();
    }
    function advance(){
      if(!state.mix)return startMode(state.view);
      if(state.mix.step>=PLAN.length-1){state.stats.mixes++;state.view="recap";tone("win");save();return render()}
      state.mix.step++;startMode(PLAN[state.mix.step]);
    }
    app.addEventListener("click",e=>{
      const btn=e.target.closest("[data-action]");if(!btn)return;
      const action=btn.dataset.action;
      if(action==="noop")return;
      if(action==="home"){timers.forEach(clearTimeout);state.mix=null;state.view="home";tone("soft");save();return render()}
      if(action==="sound"){state.sound=!state.sound;save();return render()}
      if(action==="help"){state.help=true;return render()}
      if(action==="close-help"){state.help=false;return render()}
      if(action==="edit-names"){state.view="setup";return render()}
      if(action==="mode"){state.mix=null;tone();return startMode(btn.dataset.mode)}
      if(action==="start-mix"){state.mix={step:0,correct:0,decided:0,talks:0};tone("win");return startMode(PLAN[0])}
      if(action==="custom"){state.view="custom";return render()}
      if(action==="choice"){state.match.selected=Number(btn.dataset.choice);tone();return render()}
      if(action==="submit-match"){
        if(state.match.selected===null)return;
        if(state.match.phase==="answer"){state.match.answer=state.match.selected;state.match.selected=null;state.match.phase="handover";tone();return render()}
        const good=state.match.answer===state.match.selected;state.match.guess=state.match.selected;state.match.phase="reveal";updateStats(good);
        if(state.mix){state.mix.decided++;if(good)state.mix.correct++}tone(good?"win":"soft");save();return render();
      }
      if(action==="match-ready"){state.match.phase="guess";state.match.selected=null;tone();return render()}
      if(action==="next-round")return advance();
      if(action==="countdown"){
        timers.forEach(clearTimeout);state.likelyPhase="counting";
        ["3","2","1","POINT!"].forEach((v,i)=>timers.push(setTimeout(()=>{state.countdown=v;if(v==="POINT!")state.likelyPhase="vote";tone(v==="POINT!"?"win":"tap");render()},i*650)));
        return render();
      }
      if(action==="likely-result"){
        const good=btn.dataset.match==="1";state.likelyResult=good;state.likelyPhase="result";updateStats(good);
        if(state.mix){state.mix.decided++;if(good)state.mix.correct++}tone(good?"win":"soft");save();return render();
      }
      if(action==="filter"){state.filter=btn.dataset.filter;state.sparkIndex=0;tone();return render()}
      if(action==="browse-all"){state.filter="All";state.sparkIndex=0;tone();return render()}
      if(action==="another-card"){const pool=filteredSparks();if(pool.length)state.sparkIndex=(state.sparkIndex+1)%pool.length;tone();return render()}
      if(action==="favorite"){
        const card=filteredSparks()[state.sparkIndex%filteredSparks().length],i=state.favorites.indexOf(card.id);
        if(i>=0)state.favorites.splice(i,1);else state.favorites.push(card.id);
        save();render();return notify(i>=0?"Removed from saved cards":"Saved for another night");
      }
      if(action==="complete-spark"){state.stats.rounds++;if(state.mix)state.mix.talks++;tone("soft");save();return advance()}
      if(action==="custom-type"){state.customType=btn.dataset.type;return render()}
      if(action==="delete-card"){
        state.customMatch=state.customMatch.filter(c=>c.id!==btn.dataset.id);state.customSparks=state.customSparks.filter(c=>c.id!==btn.dataset.id);
        save();render();return notify("Card removed");
      }
      if(action==="reset"){
        state.stats=JSON.parse(JSON.stringify(defaults.stats));state.favorites=[];save();render();return notify("Scores and saved cards cleared");
      }
    });
    window.addEventListener("keydown",event=>{
      if(event.target&&event.target.matches&&event.target.matches("input,textarea,select"))return;
      if(event.key==="Escape"){
        if(state.help){state.help=false;return render()}
        if(!["home","setup"].includes(state.view)){timers.forEach(clearTimeout);state.mix=null;state.view="home";tone("soft");save();return render()}
      }
      if(state.view==="match"&&["answer","guess"].includes(state.match.phase)&&/^[1-4]$/.test(event.key)){
        const option=Number(event.key)-1,q=deck()[state.match.index];
        if(option<q.options.length){event.preventDefault();state.match.selected=option;tone();render()}
      }
      if(state.view==="spark"){
        const pool=filteredSparks();if(!pool.length)return;
        if(event.key==="ArrowRight"||event.key==="ArrowLeft"){
          event.preventDefault();const direction=event.key==="ArrowRight"?1:-1;
          state.sparkIndex=(state.sparkIndex+direction+pool.length)%pool.length;tone();render();
        }
        if(event.key.toLowerCase()==="s"){
          event.preventDefault();const card=pool[state.sparkIndex%pool.length],i=state.favorites.indexOf(card.id);
          if(i>=0)state.favorites.splice(i,1);else state.favorites.push(card.id);
          save();render();notify(i>=0?"Removed from saved cards":"Saved for another night");
        }
      }
    });
    load();render();
  })();
  </script>
</body>
</html>
