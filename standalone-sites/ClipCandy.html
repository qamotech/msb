    color:var(--txt); min-height:100vh; padding-bottom:120px;
  }
  header {
    position:sticky; top:0; z-index:50; padding:14px 16px 10px;
    background:rgba(11,11,20,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h1 { font-size:1.5rem; font-weight:900; letter-spacing:-.5px;
       background:linear-gradient(90deg,var(--hot),var(--pop),var(--cool));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { font-size:.75rem; color:var(--dim); font-weight:600; }
  #search {
    width:100%; margin-top:10px; padding:11px 14px; font-size:1rem; color:var(--txt);
    background:var(--card); border:1px solid var(--line); border-radius:14px; outline:none;
  }
  #search::placeholder { color:#6b6890; }
  #search:focus { border-color:var(--hot); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; padding:9px 15px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--txt); font-size:.85rem; font-weight:700; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .chip.on { background:linear-gradient(90deg,var(--hot),#ff7a18); border-color:transparent; color:#fff; }
  .chip.rand { background:linear-gradient(90deg,#7b2cff,var(--cool)); border-color:transparent; }
  main { padding:14px 12px; max-width:900px; margin:0 auto; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
  .card {
    position:relative; text-align:left; padding:14px 12px 12px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); color:var(--txt); cursor:pointer;
    display:flex; flex-direction:column; gap:6px; min-height:150px;
    transition:transform .08s; touch-action:manipulation; user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  .card:active { transform:scale(.96); }
  .card.playing { border-color:transparent; outline:2px solid var(--pop);
    background:linear-gradient(160deg,rgba(255,176,32,.16),rgba(255,46,136,.12)); }
  .card .emoji { font-size:1.7rem; line-height:1; }
  .card .ch { font-size:.7rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--pop); }
  .card .q { font-size:.92rem; font-weight:600; line-height:1.3; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { display:flex; justify-content:space-between; align-items:center; font-size:.68rem; color:var(--dim); font-weight:600; }
  .fav { position:absolute; top:8px; right:8px; font-size:1rem; padding:6px; opacity:.9; }
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:12px; }
  .eq i { width:3px; background:var(--pop); border-radius:2px; animation:eq .5s infinite ease-in-out; }
  .eq i:nth-child(1){height:6px} .eq i:nth-child(2){height:12px;animation-delay:.15s}
  .eq i:nth-child(3){height:8px;animation-delay:.3s} .eq i:nth-child(4){height:5px;animation-delay:.45s}
  @keyframes eq { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
  #bar {
    position:fixed; left:0; right:0; bottom:0; z-index:60; display:none;
    align-items:center; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(20,16,34,.95); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  #bar.show { display:flex; animation:up .2s ease-out; }
  @keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .btxt { flex:1; min-width:0; }
  .btxt b { display:block; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--pop); }
  .btxt span { display:block; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--txt); }
  #bstop {
    width:46px; height:46px; border-radius:50%; border:none; font-size:1.1rem; cursor:pointer;
    background:linear-gradient(90deg,var(--hot),#ff7a2e); color:#fff; flex:0 0 auto;

  footer { text-align:center; color:#57547a; font-size:.72rem; padding:26px 20px 10px; line-height:1.6; }
  #toast {

    transition:all .25s; max-width:90vw; text-align:center;

/* ============ SPEECH ENGINE ============ */
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){ voices=synth?synth.getVoices():[]; }
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }

function pickVoice(hint){
  if(!voices.length) loadVoices();
  const pool=voices.filter(v=>/^en/i.test(v.lang));
  const use=pool.length?pool:voices;
  if(!use.length) return null;
  if(hint==='female'){
    const f=use.find(v=>/female|zira|samantha|victoria|karen|moira|tessa|susan|fiona|serena|allison|ava|salli|joanna|kendra|kimberly|ivy|amy|emma|nora|catherine/i.test(v.name));
    if(f) return f;
  }
  if(hint==='deep'){
    const m=use.find(v=>/daniel|alex|fred|david|mark|george|reed|rocko|grandpa|eddy|aaron|tom|male/i.test(v.name));
    if(m) return m;
  }
  return use.find(v=>v.default)||use.find(v=>/en[-_]US/i.test(v.lang))||use[0];
}

/* ============ WEB AUDIO FX ============ */
let actx=null, fxOut=null, noiseBuf=null;
function audio(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function noise(){
  const ctx=audio();
  if(!noiseBuf){
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}

      const lfo=ctx.createOscillator(); lfo.frequency.value=7;
      const lg=ctx.createGain(); lg.gain.value=10; lfo.connect(lg); lg.connect(o.frequency);
      const g=ctx.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.16,t+0.03); g.gain.setValueAtTime(0.16,t+1.1);
      g.gain.linearRampToValueAtTime(0,t+1.5);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+1.55); lfo.start(t); lfo.stop(t+1.55);
    });
  },
  laugh(ctx,t,out){
    for(let i=0;i<30;i++){
      const at=t+Math.random()*1.9, f0=170+Math.random()*300;
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f0,at);
      o.frequency.linearRampToValueAtTime(f0*0.8,at+0.1);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f0*2.4; bp.Q.value=2;
      const g=ctx.createGain(); g.gain.setValueAtTime(0,at);
      g.gain.linearRampToValueAtTime(0.07,at+0.02); g.gain.exponentialRampToValueAtTime(0.001,at+0.13);
      o.connect(bp); bp.connect(g); g.connect(out); o.start(at); o.stop(at+0.15);
    }
  },
  trombone(ctx,t,out){
    const notes=[233.1,220,207.7,196];
    notes.forEach((f,i)=>{
      const at=t+i*0.32, dur=i===3?0.95:0.3;
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,at);
      if(i===3) o.frequency.linearRampToValueAtTime(f*0.72,at+dur);
      const lfo=ctx.createOscillator(); lfo.frequency.value=5.5;
      const lg=ctx.createGain(); lg.gain.value=i===3?7:2; lfo.connect(lg); lg.connect(o.frequency);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
      const g=ctx.createGain(); g.gain.setValueAtTime(0,at);
      g.gain.linearRampToValueAtTime(0.22,at+0.05); g.gain.setValueAtTime(0.22,at+dur-0.05);
      g.gain.linearRampToValueAtTime(0,at+dur);
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(at); o.stop(at+dur+0.02); lfo.start(at); lfo.stop(at+dur);
    });
  },
  drumroll(ctx,t,out){
    for(let i=0;i<40;i++){
      const at=t+i*0.03;
      const src=ctx.createBufferSource(); src.buffer=noise();
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=1;
      const g=ctx.createGain(); const vol=0.02+(i/40)*0.1;
      g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(0.001,at+0.05);
      src.connect(bp); bp.connect(g); g.connect(out); src.start(at);
    }
    const at=t+1.28;
    const src=ctx.createBufferSource(); src.buffer=noise();
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4000;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.2,at); g.gain.exponentialRampToValueAtTime(0.001,at+0.25);
    src.connect(hp); hp.connect(g); g.connect(out); src.start(at);
  },
  scratch(ctx,t,out){
    const src=ctx.createBufferSource(); src.buffer=noise();
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=6;
    bp.frequency.setValueAtTime(400,t); bp.frequency.linearRampToValueAtTime(3200,t+0.15);
    bp.frequency.linearRampToValueAtTime(500,t+0.35); bp.frequency.linearRampToValueAtTime(2600,t+0.5);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.28,t); g.gain.setValueAtTime(0,t+0.1);
    g.gain.setValueAtTime(0.28,t+0.15); g.gain.setValueAtTime(0,t+0.3);
    g.gain.setValueAtTime(0.28,t+0.35); g.gain.linearRampToValueAtTime(0,t+0.65);
    src.connect(bp); bp.connect(g); g.connect(out); src.start(t); src.stop(t+0.7);
  },
  bleep(ctx,t,out){ FX._tone(ctx,t,out,1000,0.3,'square',0.14); },
  bleepLong(ctx,t,out){ FX._tone(ctx,t,out,1000,0.6,0.14); },
  _tone(ctx,t,out,freq,dur,vol,type='square'){
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=freq;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t);
    g.gain.setValueAtTime(vol,t+dur-0.02); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.02);
  },
  boing(ctx,t,out){
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(80,t+0.55);
    const lfo=ctx.createOscillator(); lfo.frequency.value=13;
    const lg=ctx.createGain(); lg.gain.value=35; lfo.connect(lg); lg.connect(o.frequency);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+0.62); lfo.start(t); lfo.stop(t+0.62);
  },
  rimshot(ctx,t,out){
    const hit=(at,f,dur,vol)=>{
      const o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(f,at); o.frequency.exponentialRampToValueAtTime(f*0.6,at+dur);
      const g=ctx.createGain(); g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(0.001,at+dur);
      o.connect(g); g.connect(out); o.start(at); o.stop(at+dur+0.02);
    };
    hit(t,190,0.12,0.25); hit(t+0.12,160,0.12,0.25); hit(t+0.3,150,0.18,0.3);
    const src=ctx.createBufferSource(); src.buffer=noise();
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.15,t+0.3); g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
    src.connect(hp); hp.connect(g); g.connect(out); src.start(t+0.3);
  },
  cricket(ctx,t,out){
    for(let c=0;c<3;c++){
      const base=t+c*0.5;
      for(let p=0;p<4;p++){
        const at=base+p*0.06;
        const o=ctx.createOscillator(); o.frequency.value=4200;
        const g=ctx.createGain(); g.gain.setValueAtTime(0.07,at); g.gain.exponentialRampToValueAtTime(0.001,at+0.04);
        o.connect(g); g.connect(out); o.start(at); o.stop(at+0.05);
      }
    }
  }
};
const FX_DUR={airhorn:1.6,laugh:2.2,trombone:2.0,drumroll:1.7,scratch:0.75,bleep:0.32,bleepLong:0.62,boing:0.7,rimshot:0.9,cricket:1.6};
let fxOut=null;
function playFX(name,cb){
  const ctx=audio();
  if(fxOut){ try{fxOut.disconnect();}catch(e){} }
  fxOut=ctx.createGain(); fxOut.gain.value=0.9; fxOut.connect(ctx.destination);
  (FX[name]||FX.bleep)(ctx,ctx.currentTime+0.02,fxOut);
  setTimeout(()=>cb&&cb(),(FX_DUR[name]||0.4)*1000+90);
}

/* ============ PLAYBACK QUEUE ============ */
let playToken=0, playingId=null, curU=null;
function stopAll(){
  playToken++;
  if(synth) synth.cancel();
  if(fxOut){ try{fxOut.disconnect();}catch(e){} fxOut=null; }
  setPlaying(null);
}
function setPlaying(id){
  playingId=id;
  document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing'));
  if(id){
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.classList.add('playing');
  }
  const bar=document.getElementById('bar');
  if(id){
    const clip=CLIPS.find(c=>c.id===id);
    document.getElementById('bch').textContent=clip.ch+' · '+clip.mv;
    document.getElementById('bq').textContent='“'+clip.q+'”';
    bar.classList.add('show');
  } else bar.classList.remove('show');
}
function runQueue(actions,token,done){
  if(token!==playToken) return;
  if(!actions.length){ done&&done(); return; }
  const [first,...rest]=actions;
  if(first.type==='speak'){
    if(!synth){ toast('Speech not supported in this browser 😢'); return; }
    const u=new SpeechSynthesisUtterance(first.text);
    u.pitch=Math.max(0,Math.min(2,first.pitch??1));
    u.rate=Math.max(0.1,Math.min(2.5,first.rate??1));
    u.volume=1; u.lang='en-US';
    const v=pickVoice(first.voice);
    if(v) u.voice=v;
    curU=u;
    u.onend=()=>runQueue(rest,token,done);
    u.onerror=()=>runQueue(rest,token,done);
    synth.speak(u);
  } else if(first.type==='fx'){
    playFX(first.name,()=>runQueue(rest,token,done));
  } else if(first.type==='pause'){
    setTimeout(()=>runQueue(rest,token,done),first.ms??300);
  } else runQueue(rest,token,done);
}
function playClip(clip){
  if(playingId===clip.id){ stopAll(); return; }
  stopAll();
  const token=++playToken;
  setPlaying(clip.id);
  if(navigator.vibrate) navigator.vibrate(18);
  setTimeout(()=>runQueue(clip.a,token,()=>{ if(token===playToken) setPlaying(null); }),70);
}

/* ============ UI ============ */
const state={cat:'all',q:''};
let favs=[];
try{ favs=JSON.parse(localStorage.getItem('clipcandy_favs')||'[]'); }catch(e){ favs=[]; }
function saveFavs(){ try{ localStorage.setItem('clipcandy_favs',JSON.stringify(favs)); }catch(e){} }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800);
}

function visibleClips(){
  return CLIPS.filter(c=>{
    const catOK = state.cat==='all' ? true
      : state.cat==='favs' ? favs.includes(c.id)
      : c.cat===state.cat;
    const q=state.q.trim().toLowerCase();
    const qOK=!q || (c.q+' '+c.ch+' '+c.mv).toLowerCase().includes(q);
    return catOK&&qOK;
  });
}

function renderChips(){
  const el=document.getElementById('chips');
  el.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(state.cat===c.id?' on':'')+(c.id==='__rand'?' rand':'');
    b.textContent=c.label;
    b.onclick=()=>{
      if(c.id==='__rand'){
        const vis=visibleClips().filter(x=>x.cat!=='sfx');
        const pool=vis.length?vis:CLIPS;
        playClip(pool[Math.floor(Math.random()*pool.length)]);
        return;
      }
      state.cat=c.id; renderChips(); renderGrid();
    };
    el.appendChild(b);
  });
}
function renderChips(){ renderChipsOnly(); }
function renderChipsOnly(){ renderChipsInner(); }
function renderChipsInner(){
  const el=document.getElementById('chips'); el.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(state.cat===c.id?' on':'')+(c.id==='__rand'?' rand':'');
    b.textContent=c.label;
    b.onclick=()=>{
      if(c.id==='__rand'){
        const vis=visibleClips().filter(x=>x.cat!=='sfx');
        const pool=vis.length?vis:CLIPS;
        playClip(pool[Math.floor(Math.random()*pool.length)]);
        return;
      }
      state.cat=c.id; renderChipsInner(); renderGrid();
    };
    el.appendChild(b);
  });
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const list=visibleClips();
  grid.innerHTML='';
  if(!list.length){
    grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--dim);padding:30px 10px">No clips found. Try another search! 🔍</p>';
    return;
  }
  list.forEach(c=>{
    const b=document.createElement('button');
    b.className='card'; b.dataset.id=c.id;
    const isFav=favs.includes(c.id);
    b.innerHTML=`
      <span class="fav" role="button" aria-label="Favorite">${isFav?'❤️':'🤍'}</span>
      <div class="emoji">${c.em}</div>
      <div class="ch">${c.ch}</div>
      <div class="q">“${c.q}”</div>
      <div class="meta"><span>${c.mv}</span><span class="pi">▶</span></div>`;
    b.onclick=()=>{ if(navigator.vibrate) navigator.vibrate(15); playClip(c); };
    b.querySelector('.fav').onclick=e=>{
      e.stopPropagation();
      if(favs.includes(c.id)) favs=favs.filter(x=>x!==c.id);
      else { favs.push(c.id); toast('Added to favorites ❤️'); }
      saveFavs(); renderGrid();
    };
    grid.appendChild(b);
  });
}

document.getElementById('bstop').onclick=stopAll;
document.getElementById('search').addEventListener('input',e=>{
  state.q=e.target.value; renderGrid();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopAll(); });

renderChipsInner();
renderGrid();
</script>
