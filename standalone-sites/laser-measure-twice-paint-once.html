<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
<meta name="theme-color" content="#0b1020">
  <title>Precision Alignment Laser Animation</title>
  <style>
    /* 
      Precision Section Container
      Drop this wrapper into your New Perspective Painting layout 
    */
    .precision-section {
      position: relative;
      width: 100%;
      height: 400px;
      background: #111;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background Grid for "Measure Twice" aesthetic */
    .precision-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: 1;
    }

    /* Laser Device Emitter */
    .laser-emitter {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 40px;
      background: #333;
      border-right: 3px solid #ff3b3b;
      border-radius: 0 4px 4px 0;
      z-index: 5;
      box-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
    }

    /* Horizontal Laser Beam */
    .laser-beam {
      position: absolute;
      left: 15px;
      top: 50%;
      height: 2px;
      width: 0;
      background: #ff3b3b;
      box-shadow: 0 0 8px #ff3b3b, 0 0 15px #ff3b3b;
      transform: translateY(-50%);
      z-index: 4;
      animation: projectBeam 1.5s ease-out forwards;
    }

    /* Vertical Laser Beam (Crosshair effect) */
    .laser-beam-vertical {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 0;
      background: #ff3b3b;
      box-shadow: 0 0 8px #ff3b3b, 0 0 15px #ff3b3b;
      transform: translateX(-50%);
      z-index: 4;
      animation: projectVerticalBeam 1.5s ease-out 1s forwards;
    }

    /* Moving Color Panels */
    .color-panel {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 8px;
      opacity: 0;
      z-index: 3;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Panel 1 - Settles top-left of center */
    .panel-1 {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6); /* Deep Blue */
      top: 10%;
      left: 20%;
      animation: settlePanel1 2s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
    }

    /* Panel 2 - Settles bottom-right of center */
    .panel-2 {
      background: linear-gradient(135deg, #064e3b, #10b981); /* Emerald */
      bottom: 10%;
      right: 20%;
      animation: settlePanel2 2s cubic-bezier(0.25, 1, 0.5, 1) 1.8s forwards;
    }

    /* UI Text Overlay */
    .alignment-ui {
      position: absolute;
      z-index: 10;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    .status-text {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: #ff3b3b;
      text-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
      opacity: 0;
      animation: flashLock 1s ease-in-out 3s forwards;
    }

    .sub-text {
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 1s ease-in 3.5s forwards;
    }

    /* --- Animations --- */
    
    @keyframes projectBeam {
      0% { width: 0; opacity: 0; }
      50% { opacity: 1; }
      100% { width: 100%; opacity: 0.8; }
    }

    @keyframes projectVerticalBeam {
      0% { height: 0; opacity: 0; }
      50% { opacity: 1; }
      100% { height: 100%; opacity: 0.8; }
    }

    @keyframes settlePanel1 {
      0% { top: -50%; left: -20%; opacity: 0; transform: rotate(-20deg); }
      50% { opacity: 1; }
      100% { top: 50%; left: 50%; opacity: 0.9; transform: translate(-110%, -110%) rotate(0deg); }
    }

    @keyframes settlePanel2 {
      0% { bottom: -50%; right: -20%; opacity: 0; transform: rotate(20deg); }
      50% { opacity: 1; }
      100% { bottom: 50%; right: 50%; opacity: 0.9; transform: translate(110%, 110%) rotate(0deg); }
    }

    @keyframes flashLock {
      0%, 20%, 40% { opacity: 0; color: #ff3b3b; text-shadow: 0 0 10px rgba(255, 59, 59, 0.5); }
      10%, 30% { opacity: 1; }
      50% { opacity: 1; color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.8); } /* Turns green on lock */
      100% { opacity: 1; color: #10b981; text-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="precision-section">
    <!-- Grid Background -->
    <div class="precision-grid"></div>

    <!-- Lasers -->
    <div class="laser-emitter"></div>
    <div class="laser-beam"></div>
    <div class="laser-beam-vertical"></div>

    <!-- Color Panels -->
    <div class="color-panel panel-1"></div>
    <div class="color-panel panel-2"></div>

    <!-- Status Text -->
    <div class="alignment-ui">
      <div class="status-text">Alignment Locked</div>
      <div class="sub-text">MEASURE TWICE &bull; PAINT ONCE</div>
    </div>
  </div>

</body>
</html>
