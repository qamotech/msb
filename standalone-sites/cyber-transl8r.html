<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CHAOS → MIND · Cybertronian Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* ===== CSS CUSTOM PROPERTIES (THEMES) ===== */
        :root {
            --bg-primary: #0b0b12;
            --bg-panel: rgba(8, 12, 30, 0.75);
            --border-glow: #00f0ff;
            --text-primary: #e6f7ff;
            --text-secondary: #8ac4d0;
            --accent-cyan: #00f0ff;
            --accent-amber: #ffaa00;
            --accent-magenta: #ff2d95;
            --glass-blur: blur(18px);
            --shadow-neon: 0 0 30px rgba(0, 240, 255, 0.15);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            --grid-color: rgba(0, 240, 255, 0.06);
            --transition-speed: 0.35s;
        }

        [data-theme="decepticon"] {
            --border-glow: #ff2d95;
            --accent-cyan: #ff2d95;
            --grid-color: rgba(255, 45, 149, 0.06);
            --shadow-neon: 0 0 30px rgba(255, 45, 149, 0.20);
            --text-secondary: #e6a0c0;
        }
        [data-theme="autobot"] {
            --border-glow: #ff6b00;
            --accent-cyan: #ff6b00;
            --grid-color: rgba(255, 107, 0, 0.06);
            --shadow-neon: 0 0 30px rgba(255, 107, 0, 0.20);
            --text-secondary: #f5cba0;
        }

        /* ===== GLOBAL RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow: hidden;
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; box-shadow: 0 0 12px var(--accent-cyan); }

        /* ===== BACKGROUND CANVAS ===== */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== GLASS PANEL ===== */
        .glass {
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            box-shadow: var(--shadow-neon), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* ===== LAYOUT ===== */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px 20px 20px 20px;
            gap: 16px;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0,240,255,0.10);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo h1 {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(1.2rem, 2.2vw, 2.0rem);
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-amber));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0,240,255,0.25);
        }
        .logo span {
            font-family: var(--font-body);
            font-weight: 300;
            color: var(--text-secondary);
            font-size: 0.75rem;
            letter-spacing: 2px;
            opacity: 0.7;
            border-left: 1px solid var(--text-secondary);
            padding-left: 14px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 40px;
            padding: 6px 16px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all var(--transition-speed);
            backdrop-filter: blur(6px);
        }
        .header-actions button:hover {
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 24px rgba(0,240,255,0.15);
            transform: scale(1.03);
        }
        .theme-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            padding: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* ===== MAIN GRID ===== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 14px; }
        }

        /* ===== PANELS ===== */
        .panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-radius: 24px;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: var(--shadow-neon), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .panel-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-title .badge {
            background: var(--accent-cyan);
            color: #000;
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* ===== INPUT AREA ===== */
        #input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }
        #input-area textarea {
            flex: 1;
            min-height: 140px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border var(--transition-speed);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
        }
        #input-area textarea:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0,240,255,0.05), inset 0 0 40px rgba(0,0,0,0.6);
        }
        #input-area textarea::placeholder {
            color: rgba(255,255,255,0.15);
            font-family: var(--font-body);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .input-toolbar button, .input-toolbar label {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            padding: 6px 16px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(6px);
        }
        .input-toolbar button:hover, .input-toolbar label:hover {
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 20px rgba(0,240,255,0.08);
        }
        .input-toolbar .primary-btn {
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 6px 28px;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(0,240,255,0.15);
        }
        .input-toolbar .primary-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(0,240,255,0.30);
            background: #00e0ff;
        }
        .input-toolbar .primary-btn:active { transform: scale(0.96); }
        #file-upload { display: none; }
        .drag-overlay {
            position: absolute;
            inset: 0;
            border: 2px dashed var(--accent-cyan);
            border-radius: 24px;
            background: rgba(0,240,255,0.03);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            letter-spacing: 2px;
            color: var(--accent-cyan);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .drag-overlay.active { opacity: 1; pointer-events: auto; }

        /* ===== OUTPUT PANEL ===== */
        #output-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        .output-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 6px;
            flex-wrap: wrap;
        }
        .output-tabs button {
            background: transparent;
            border: none;
            padding: 4px 16px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 20px;
            transition: all var(--transition-speed);
            opacity: 0.5;
        }
        .output-tabs button.active {
            opacity: 1;
            color: #fff;
            background: rgba(0,240,255,0.08);
            box-shadow: inset 0 0 20px rgba(0,240,255,0.04);
        }
        .output-tabs button:hover { opacity: 1; }

        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 2px;
            position: relative;
        }
        .output-content pre {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary);
            margin: 0;
        }
        .output-content .markdown-body {
            font-family: var(--font-body);
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-primary);
        }
        .output-content .markdown-body h1, .output-content .markdown-body h2, .output-content .markdown-body h3 {
            font-family: var(--font-display);
            color: var(--accent-cyan);
            margin: 0.8em 0 0.3em 0;
        }
        .output-content .markdown-body ul { padding-left: 1.5rem; }
        .output-content .markdown-body li { margin: 0.2rem 0; }

        /* ===== MIND MAP CANVAS ===== */
        #mindmap-canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            cursor: grab;
        }
        #mindmap-canvas:active { cursor: grabbing; }

        /* ===== METADATA GRID ===== */
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .meta-card {
            background: rgba(0,0,0,0.25);
            border-radius: 14px;
            padding: 12px 16px;
            border-left: 2px solid var(--accent-cyan);
        }
        .meta-card .label {
            font-family: var(--font-display);
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            opacity: 0.6;
        }
        .meta-card .value {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .meta-card .value .tag {
            background: rgba(0,240,255,0.08);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,240,255,0.10);
            font-size: 0.7rem;
        }

        /* ===== EXPORT BAR ===== */
        .export-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .export-bar button {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 3px 14px;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
        }
        .export-bar button:hover {
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 16px rgba(0,240,255,0.06);
        }

        /* ===== SETTINGS MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(16px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 32px;
            padding: 40px 48px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
        }
        .modal-box h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--accent-cyan);
        }
        .modal-box label {
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px 0;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
        }
        .modal-box input:focus { border-color: var(--accent-cyan); }
        .modal-box .close-btn {
            background: var(--accent-cyan);
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            color: #000;
            transition: all var(--transition-speed);
        }
        .modal-box .close-btn:hover { transform: scale(1.04); }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 640px) {
            #app { padding: 10px; gap: 10px; }
            .panel { padding: 14px; }
            .meta-grid { grid-template-columns: 1fr; }
            .logo span { display: none; }
            .input-toolbar button { font-size: 0.65rem; padding: 4px 12px; }
        }
        /* ===== ANIMATIONS ===== */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(0,240,255,0.05); }
            50% { box-shadow: 0 0 40px rgba(0,240,255,0.15); }
            100% { box-shadow: 0 0 10px rgba(0,240,255,0.05); }
        }
        .panel { animation: pulse-glow 6s infinite ease-in-out; }
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0.6; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .scanline-effect::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            animation: scanline 2s infinite linear;
            pointer-events: none;
        }
        .scanline-effect.active::after { opacity: 0.4; }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND CANVAS ===== -->
    <canvas id="bg-canvas"></canvas>

    <!-- ===== SETTINGS MODAL ===== -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box">
            <h2>⚙️ ENCRYPTION CORE</h2>

    <!-- ===== APP ===== -->
    <div id="app">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <h1>◈ CHAOS→MIND</h1>
                <span>v. 4.2 · CYBERTRONIAN ARCHITECT</span>
            </div>

                    <div class="drag-overlay" id="drag-overlay">⬡ DROP FILE · .txt .md .json</div>

    <script type="importmap">
        {
            "imports": {
                "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.7/+esm",
                "jsPDF": "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/+esm"

    <script type="module">
        // ===== IMPORTS =====
        import { marked } from 'marked';
        import jsPDF from 'jsPDF';

        // ===== DOM REFS =====
        const chaosInput = document.getElementById('chaos-input');
        const processBtn = document.getElementById('process-btn');
        const clearInput = document.getElementById('clear-input');
        const clearAll = document.getElementById('clear-all');
        const outputMarkdown = document.getElementById('output-markdown');
        const outputPreview = document.getElementById('output-preview');
        const outputMetadata = document.getElementById('output-metadata');
        const mindmapCanvas = document.getElementById('mindmap-canvas');
        const metaGrid = document.getElementById('meta-grid');
        const fileUpload = document.getElementById('file-upload');
        const dragOverlay = document.getElementById('drag-overlay');
        const micBtn = document.getElementById('mic-btn');
        const settingsToggle = document.getElementById('settings-toggle');
        const settingsModal = document.getElementById('settings-modal');
        const saveSettings = document.getElementById('save-settings');
        const closeSettings = document.getElementById('close-settings');
        const apiKeyInput = document.getElementById('api-key-input');
        const themeToggle = document.getElementById('theme-toggle');

        // ===== STATE =====
        let currentMarkdown = '';
        let currentMetadata = null;
        let currentTree = null;
        let isProcessing = false;
        let themeIndex = 0;
        const themes = ['cybertron', 'decepticon', 'autobot'];

        // ===== SOUND ENGINE (Web Audio) =====
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playTone(freq, duration, type = 'sine', volume = 0.08) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (_) {}
        }
        function soundHover() { playTone(880, 0.05, 'sine', 0.04); }
        function soundProcess() { playTone(440, 0.15, 'sawtooth', 0.06); setTimeout(() => playTone(660, 0.12, 'sawtooth', 0.05), 120); }

        // ===== THEMES =====

        // ===== BACKGROUND PARTICLES / GRID =====
        const bgCanvas = document.getElementById('bg-canvas');
        const ctx = bgCanvas.getContext('2d');
        let particles = [];
        let gridOffset = 0;

        function resizeCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.3 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 120; i++) particles.push(new Particle());

        function drawGrid() {
            const w = bgCanvas.width, h = bgCanvas.height;
            const spacing = 55;
            const offset = gridOffset % spacing;
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
            ctx.lineWidth = 0.5;
            for (let x = -spacing + offset; x < w + spacing; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = -spacing + offset; y < h + spacing; y += spacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            // accent diagonal lines
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.015)';
            ctx.lineWidth = 1;
            for (let i = -h; i < w + h; i += 80) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + h, h);
                ctx.stroke();
            }
        }

        function animateBg() {
            ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            gridOffset += 0.15;
            drawGrid();
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        async function processChaos() {

            soundProcess();
            document.getElementById('input-panel').classList.add('active');

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-70b-8192',
                        messages: [
                            {
                                role: 'system',
                                content: `You are a senior information architect. Transform the user's raw notes into a structured mind map using Markdown headings (#, ##, ###) and bullet points (-).
            After the markdown, output a JSON block exactly like this:
            ---METADATA---
            {
              "tags": ["tag1","tag2"],

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const data = await response.json();

                // Parse markdown and metadata
                const metaSplit = raw.split('---METADATA---');
                let md = metaSplit[0].trim();
                let metaRaw = metaSplit.length > 1 ? metaSplit[1].trim() : '{}';
                // Remove code fences if present
                metaRaw = metaRaw.replace(/```json/g, '').replace(/```/g, '').trim();
                try {
                    currentMetadata = JSON.parse(metaRaw);
                } catch (_) {
                    currentMetadata = { tags: [], action_items: [], sentiment: 'neutral', swot: { strengths: [], weaknesses: [], opportunities: [], threats: [] } };

        // ===== RENDER OUTPUT =====
        function renderOutput(md, meta) {

                ];

            // Mind Map
            const tree = parseMarkdownToTree(md);

        function switchTab(tab) {

            document.querySelector(`.output-tabs button[data-tab="${tab}"]`)?.classList.add('active');

            outputPreview.style.display = 'none';
            mindmapCanvas.style.display = 'none';

            else if (tab === 'preview') { outputPreview.style.display = 'block'; }

            else if (tab === 'metadata') { outputMetadata.style.display = 'block'; }
        }

        // ===== PARSE MARKDOWN TO TREE =====
        function parseMarkdownToTree(md) {
            const lines = md.split('\n');
            const root = { label: 'ROOT', children: [], depth: 0 };
            const stack = [root];
            let current = root;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // Headings
                const headingMatch = line.match(/^(#{1,6})\s+(.*)/);
                if (headingMatch) {
                    const depth = headingMatch[1].length;
                    const label = headingMatch[2].trim();
                    const node = { label, children: [], depth };
                    // Pop stack until we find parent with depth < current depth
                    while (stack.length > 0 && stack[stack.length - 1].depth >= depth) {
                        stack.pop();
                    }
                    const parent = stack[stack.length - 1] || root;
                    parent.children.push(node);
                    stack.push(node);
                    current = node;
                    continue;
                }

                // Bullet points / list items
                const bulletMatch = line.match(/^[-*]\s+(.*)/);
                if (bulletMatch) {
                    const label = bulletMatch[1].trim();
                    const node = { label, children: [], depth: (current.depth || 0) + 1 };
                    // Attach to current last child if possible, else to current
                    if (current.children.length > 0) {
                        // Check if last child is a heading? We'll attach as sibling or child based on indentation.
                        // Since we don't have indentation info, attach to current.
                        current.children.push(node);
                    } else {
                        current.children.push(node);
                    }
                    // We don't push this node as parent unless it has children later.
                    // We'll keep current as is.
                    continue;
                }

                // Plain text - treat as child of current
                if (line.length > 0) {
                    const node = { label: line, children: [], depth: (current.depth || 0) + 1 };
                    current.children.push(node);
                }
            }
            return root;
        }

        // ===== DRAW MIND MAP (Radial / Tree) =====
        function drawMindMap(root) {
            const canvas = mindmapCanvas;
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
            const c = canvas.getContext('2d');
            c.scale(dpr, dpr);
            const w = canvas.clientWidth, h = canvas.clientHeight;

            c.clearRect(0, 0, w, h);

            if (!root || root.children.length === 0) {
                c.fillStyle = 'rgba(255,255,255,0.1)';
                c.font = '14px Orbitron';
                c.textAlign = 'center';
                c.fillText('NO STRUCTURE FOUND', w/2, h/2);
                return;
            }

            // Build flat list for layout
            const nodes = [];
            function flatten(node, parentId, depth) {
                const id = nodes.length;
                const x = 0, y = 0; // will be computed
                nodes.push({ id, label: node.label, parentId, depth, children: node.children.map(c => flatten(c, id, depth + 1)) });
                return id;
            }
            flatten(root, -1, 0);

            // Compute layout: simple radial
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = Math.min(w, h) * 0.38;

            // Assign positions via DFS
            function assignPositions(nodeIdx, angleStart, angleEnd, parentX, parentY, level) {
                const node = nodes[nodeIdx];
                if (node.parentId === -1) {
                    node.x = centerX;
                    node.y = centerY;
                } else {
                    const angle = (angleStart + angleEnd) / 2;
                    const r = radius * (0.4 + 0.6 * (level / 4));
                    node.x = parentX + r * Math.cos(angle);
                    node.y = parentY + r * Math.sin(angle);
                }

                const children = node.children;
                const n = children.length;
                if (n === 0) return;
                const step = (angleEnd - angleStart) / n;
                for (let i = 0; i < n; i++) {
                    const childId = children[i];
                    const childNode = nodes[childId];
                    const childAngleStart = angleStart + i * step;
                    const childAngleEnd = angleStart + (i + 1) * step;
                    assignPositions(childId, childAngleStart, childAngleEnd, node.x, node.y, level + 1);
                }
            }

            // Root has index 0
            if (nodes.length > 0) {
                assignPositions(0, 0, Math.PI * 2, centerX, centerY, 0);
            }

            // Draw edges
            for (let i = 1; i < nodes.length; i++) {
                const node = nodes[i];
                const parent = nodes.find(n => n.id === node.parentId);
                if (parent) {
                    c.beginPath();
                    c.moveTo(parent.x, parent.y);
                    c.lineTo(node.x, node.y);
                    c.strokeStyle = 'rgba(0, 240, 255, 0.15)';
                    c.lineWidth = 1.5;
                    c.shadowColor = 'rgba(0, 240, 255, 0.10)';
                    c.shadowBlur = 8;
                    c.stroke();
                    c.shadowBlur = 0;
                }
            }

            // Draw nodes
            for (const node of nodes) {
                if (node.id === 0) continue; // root hidden
                const label = node.label.length > 25 ? node.label.slice(0, 22) + '…' : node.label;
                const size = Math.max(12, 22 - node.depth * 1.5);
                // Glow
                const grad = c.createRadialGradient(node.x, node.y, 0, node.x, node.y, size * 1.8);
                grad.addColorStop(0, 'rgba(0, 240, 255, 0.08)');
                grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
                c.fillStyle = grad;
                c.beginPath();
                c.arc(node.x, node.y, size * 1.8, 0, Math.PI * 2);
                c.fill();

                // Circle
                c.beginPath();
                c.arc(node.x, node.y, size * 0.6, 0, Math.PI * 2);
                c.fillStyle = 'rgba(0, 240, 255, 0.12)';
                c.fill();
                c.strokeStyle = 'rgba(0, 240, 255, 0.4)';
                c.lineWidth = 1;
                c.stroke();

                // Text
                c.fillStyle = '#e6f7ff';
                c.font = `${Math.max(9, 12 - node.depth * 0.5)}px Rajdhani, sans-serif`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.shadowColor = 'rgba(0,0,0,0.8)';
                c.shadowBlur = 8;
                c.fillText(label, node.x, node.y + size * 0.6 + 10);
                c.shadowBlur = 0;
            }
        }

        function exportOPML() {

        function generateOPML(node) {
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n<head><title>Mind Map</title></head>\n<body>\n';
            function traverse(n, indent) {
                if (n.label && n.label !== 'ROOT') {
                    xml += `${indent}<outline text="${n.label}" />\n`;
                }
                for (const child of n.children) {
                    traverse(child, indent + '  ');
                }
            }
            for (const child of node.children) {
                traverse(child, '  ');
            }
            xml += '</body>\n</opml>';
            return xml;
        }

        function exportJSON() {
            if (!currentTree) { playTone(200, 0.15, 'sawtooth', 0.05); return; }

        function exportSVG() {

                <image href="${imgData}" width="${canvas.width}" height="${canvas.height}" />
            </svg>`;
            downloadFile(svg, 'mindmap.svg', 'image/svg+xml');
            playTone(1000, 0.05, 'sine', 0.06);
        }

        function exportPDF() {
            if (!currentTree) { playTone(200, 0.15, 'sawtooth', 0.05); return; }
            const canvas = mindmapCanvas;
            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('l', 'mm', 'a4');
            const w = pdf.internal.pageSize.getWidth();
            const h = pdf.internal.pageSize.getHeight();
            pdf.addImage(imgData, 'PNG', 0, 0, w, h);
            pdf.save('mindmap.pdf');
            playTone(1000, 0.05, 'sine', 0.06);
        }

        function downloadFile(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ===== RESIZE MIND MAP =====
