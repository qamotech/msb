<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Ink - Navier-Stokes Fluid Sim</title>
<style>
  :root { --bg: #0a0a0f; --ui: #e8e8f0; --accent: #00ffc8; }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; color: var(--ui); overflow: hidden; touch-action: none; }
  canvas { display: block; cursor: crosshair; box-shadow: 0 0 40px -10px rgba(0,255,200,0.15), 0 0 0 1px rgba(255,255,255,0.05); border-radius: 4px; }
  .hud { position: fixed; bottom: 20px; left: 20px; font-size: 11px; line-height: 1.6; color: rgba(232,232,240,0.6); font-family: 'JetBrains Mono', 'Fira Code', monospace; pointer-events: none; text-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 10; }
  .hud kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px; margin: 0 2px; font-size: inherit; color: var(--accent); }
  .hud .mode { color: var(--accent); font-weight: 600; }
  @media (max-width: 600px) { .hud { font-size: 9px; bottom: 10px; left: 10px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><kbd>LMB</kbd> Drag: Ink + Force &nbsp; | &nbsp; <kbd>RMB</kbd> Drag: Wind Only</div>
  <div><kbd>Scroll</kbd> Zoom &nbsp; | &nbsp; <kbd>MMB / Shift+Drag</kbd> Pan</div>
  <div><kbd>Space</kbd> Pause &nbsp; | &nbsp; <kbd>C</kbd> Clear &nbsp; | &nbsp; <kbd>F</kbd> Fire Mode: <span class="mode" id="mode">INK</span> &nbsp; | &nbsp; <kbd>V</kbd> View: <span class="mode" id="view">DYE</span></div>
  <div>Resolution: <span id="res">128</span>² &nbsp; | &nbsp; FPS: <span id="fps">60</span></div>
</div>

<script>
/* ============================================================
   STABLE FLUIDS SOLVER (CPU) - Single File Implementation
   Based on Jos Stam "Real-Time Fluid Dynamics for Games"
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

// --- Config ---
const SIM_RES = 128;          // Simulation grid resolution (power of 2)
const ITERATIONS = 20;        // Pressure solver iterations (Jacobi)
const DT = 0.15;              // Timestep
const DIFFUSION = 0.00005;    // Velocity diffusion (viscosity)
const DYE_DIFFUSION = 0.00001;// Dye diffusion
const FORCE_SCALE = 8.0;      // Mouse force multiplier
const DYE_INJECT = 1.5;       // Dye amount per frame
const BUOYANCY = 0.4;         // Fire mode: hot smoke rises
const HEAT_DECAY = 0.995;     // Fire mode: cooling
const VORTICITY_CONFINEMENT = 1.8; // Keeps swirls alive (artistic)

// --- State ---
let W = SIM_RES, H = SIM_RES;
// Float32Arrays for speed
let u = new Float32Array(W * H), u_prev = new Float32Array(W * H); // Velocity X
let v = new Float32Array(W * H), v_prev = new Float32Array(W * H); // Velocity Y
let dye = new Float32Array(W * H * 3), dye_prev = new Float32Array(W * H * 3); // RGB
let div = new Float32Array(W * H), p = new Float32Array(W * H);     // Divergence, Pressure
let obst = new Uint8Array(W * H); // Obstacles (0=fluid, 1=solid)

// Camera / Input
let cam = { x: 0, y: 0, zoom: 1, targetZoom: 1 };
let mouse = { x: 0, y: 0, px: 0, py: 0, down: false, rdown: false, mdown: false };
let paused = false, fireMode = false, viewVel = false;
let lastTime = 0, frameCount = 0, fps = 60;

// --- Utilities ---
const IX = (x, y) => x + y * W;
const CLAMP = (v, a, b) => Math.max(a, Math.min(b, v));

function set_bnd(b, arr) {
  // b: 1=x-vel, 2=y-vel, 3=dye/scalar
  for (let i = 1; i < W - 1; i++) {
    arr[IX(i, 0)]     = b === 2 ? -arr[IX(i, 1)] : arr[IX(i, 1)];
    arr[IX(i, H - 1)] = b === 2 ? -arr[IX(i, H - 2)] : arr[IX(i, H - 2)];
  }
  for (let j = 1; j < H - 1; j++) {
    arr[IX(0, j)]     = b === 1 ? -arr[IX(1, j)] : arr[IX(1, j)];
    arr[IX(W - 1, j)] = b === 1 ? -arr[IX(W - 2, j)] : arr[IX(W - 2, j)];
  }
  // Corners
  arr[IX(0, 0)] = 0.5 * (arr[IX(1, 0)] + arr[IX(0, 1)]);
  arr[IX(W-1, 0)] = 0.5 * (arr[IX(W-2, 0)] + arr[IX(W-1, 1)]);
  arr[IX(0, H-1)] = 0.5 * (arr[IX(1, H-1)] + arr[IX(0, H-2)]);
  arr[IX(W-1, H-1)] = 0.5 * (arr[IX(W-2, H-1)] + arr[IX(W-1, H-2)]);
}

// Gauss-Seidel Relaxation (Linear Solver)
function lin_solve(b, x, x0, a, c) {
  const invC = 1.0 / c;
  for (let k = 0; k < ITERATIONS; k++) {
    for (let j = 1; j < H - 1; j++) {
      const row = j * W;
      for (let i = 1; i < W - 1; i++) {
        const idx = row + i;
        if (obst[idx]) continue; // Skip solid cells
        x[idx] = (x0[idx] + a * (x[idx-1] + x[idx+1] + x[idx-W] + x[idx+W])) * invC;
      }
    }
    set_bnd(b, x);
  }
}

// Diffusion (Implicit)
function diffuse(b, x, x0, diff, dt) {
  const a = dt * diff * (W - 2) * (H - 2);
  lin_solve(b, x, x0, a, 1 + 6 * a); // 6 neighbors in 3D? No, 4 in 2D. Correct factor: 1 + 4a. Stam uses 1+6a for 3D. For 2D: 1+4a.
  // Correction for 2D:
  // Actually standard 5-point stencil: x_new = (x0 + a*(neighbors)) / (1+4a)
  // Let's use the standard 2D factor:
  // Re-implementing lin_solve logic here for correct 2D factor to avoid confusion:
  const invC = 1.0 / (1 + 4 * a);
  for (let k = 0; k < ITERATIONS; k++) {
    for (let j = 1; j < H - 1; j++) {
      const row = j * W;
      for (let i = 1; i < W - 1; i++) {
        const idx = row + i;
        if (obst[idx]) continue;
        x[idx] = (x0[idx] + a * (x[idx-1] + x[idx+1] + x[idx-W] + x[idx+W])) * invC;
      }
    }
    set_bnd(b, x);
  }
}

// Advection (Semi-Lagrangian)
function advect(b, d, d0, u, v, dt) {
  const dt0 = dt * (W - 2);
  for (let j = 1; j < H - 1; j++) {
    const row = j * W;
    for (let i = 1; i < W - 1; i++) {
      const idx = row + i;
      if (obst[idx]) { d[idx] = d0[idx]; continue; } // Don't advect into obstacle, keep value? Or 0. Keep previous.

      let x = i - dt0 * u[idx];
      let y = j - dt0 * v[idx];

      x = CLAMP(x, 0.5, W - 1.5);
      y = CLAMP(y, 0.5, H - 1.5);

      const i0 = Math.floor(x), i1 = i0 + 1;
      const j0 = Math.floor(y), j1 = j0 + 1;
      const s1 = x - i0, s0 = 1 - s1;
      const t1 = y - j0, t0 = 1 - t1;

      // Bilinear Interpolation
      // Assuming d is scalar (or we loop channels outside)
      // For dye (3 channels), we call this 3 times or inline.
      // Let's make this generic for single channel array.
      d[idx] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
               s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
    }
  }
  set_bnd(b, d);
}

// Projection (Make velocity field mass-conserving / incompressible)
function project(u, v, p, div) {
  const h = 1.0 / W; // Grid spacing
  for (let j = 1; j < H - 1; j++) {
    const row = j * W;
    for (let i = 1; i < W - 1; i++) {
      const idx = row + i;
      if (obst[idx]) { div[idx] = 0; p[idx] = 0; continue; }
      div[idx] = -0.5 * h * (u[idx+1] - u[idx-1] + v[idx+W] - v[idx-W]);
      p[idx] = 0;
    }
  }
  set_bnd(0, div); set_bnd(0, p);
  lin_solve(0, p, div, 1, 4); // Solve Poisson: div = laplacian(p) -> p = lin_solve(div, 1, 4)

  for (let j = 1; j < H - 1; j++) {
    const row = j * W;
    for (let i = 1; i < W - 1; i++) {
      const idx = row + i;
      if (obst[idx]) continue;
      u[idx] -= 0.5 * (p[idx+1] - p[idx-1]) / h;
      v[idx] -= 0.5 * (p[idx+W] - p[idx-W]) / h;
    }
  }
  set_bnd(1, u); set_bnd(2, v);
}

// Vorticity Confinement (Artistic force to preserve vortices)
function vorticity_confinement(u, v) {
  // Compute vorticity (curl) at cell centers
  // w = dv/dx - du/dy
  const vort = new Float32Array(W * H);
  const h = 1.0;
  for (let j = 1; j < H - 1; j++) {
    for (let i = 1; i < W - 1; i++) {
      const idx = IX(i, j);
      if (obst[idx]) continue;
      vort[idx] = (v[idx+1] - v[idx-1]) - (u[idx+W] - u[idx-W]); // * 0.5/h (absorbed in scale)
    }
  }

  // Compute gradient of |vorticity|
  const grad_x = new Float32Array(W * H);
  const grad_y = new Float32Array(W * H);
  for (let j = 1; j < H - 1; j++) {
    for (let i = 1; i < W - 1; i++) {
      const idx = IX(i, j);
      if (obst[idx]) continue;
      const wx = Math.abs(vort[idx+1]) - Math.abs(vort[idx-1]);
      const wy = Math.abs(vort[idx+W]) - Math.abs(vort[idx-W]);
      const len = Math.hypot(wx, wy) + 1e-6;
      grad_x[idx] = wx / len;
      grad_y[idx] = wy / len;
    }
  }

  // Apply force: N x w (where N = grad(|w|)/|grad(|w|)|)
  // Force_x =  N_y * w
  // Force_y = -N_x * w
  const scale = VORTICITY_CONFINEMENT * DT;
  for (let j = 1; j < H - 1; j++) {
    for (let i = 1; i < W - 1; i++) {
      const idx = IX(i, j);
      if (obst[idx]) continue;
      u[idx] += grad_y[idx] * vort[idx] * scale;
      v[idx] -= grad_x[idx] * vort[idx] * scale;
    }
  }
  set_bnd(1, u); set_bnd(2, v);
}

// --- Main Step ---
function step() {
  // 1. Diffuse Velocity (Viscosity)
  diffuse(1, u_prev, u, DIFFUSION, DT);
  diffuse(2, v_prev, v, DIFFUSION, DT);

  // 2. Project (Make diffuse result incompressible)
  project(u_prev, v_prev, p, div);

  // 3. Advect Velocity
  advect(1, u, u_prev, u_prev, v_prev, DT);
  advect(2, v, v_prev, u_prev, v_prev, DT);

  // 4. Project Again (Ensure final velocity is incompressible)
  project(u, v, p, div);

  // 5. Vorticity Confinement (Artistic)
  if (VORTICITY_CONFINEMENT > 0) vorticity_confinement(u, v);

  // 6. Diffuse Dye
  if (DYE_DIFFUSION > 0) {
    diffuse(3, dye_prev, dye, DYE_DIFFUSION, DT); // R
    diffuse(3, dye_prev.subarray(W*H), dye.subarray(W*H), DYE_DIFFUSION, DT); // G - wait, dye is interleaved? No, planar is faster for diffuse.
    // Let's re-organize dye as Planar: R: 0..N, G: N..2N, B: 2N..3N
  }
  
  // Re-organizing Dye Layout for Planar Diffusion:
  // dye = [R0...Rn, G0...Gn, B0...Bn]  (Length 3*N)
  // dye_prev same.
  
  // 7. Advect Dye
  advect(3, dye, dye_prev, u, v, DT); // R
  advect(3, dye.subarray(W*H), dye_prev.subarray(W*H), u, v, DT); // G
  advect(3, dye.subarray(2*W*H), dye_prev.subarray(2*W*H), u, v, DT); // B

  // 8. Buoyancy (Fire Mode)
  if (fireMode) {
    for (let i = 0; i < W*H; i++) {
      if (obst[i]) continue;
      // Heat is approximated by Red channel (or Luminance)
      const heat = dye[i]; // R channel
      v[i] -= heat * BUOYANCY * DT; // Negative Y is Up
      // Decay Heat
      dye[i] *= HEAT_DECAY;
      dye[i + W*H] *= HEAT_DECAY;     // G
      dye[i + 2*W*H] *= HEAT_DECAY;   // B
    }
    set_bnd(2, v);
  }
}

// --- Rendering ---
const renderCanvas = document.createElement('canvas');
const rctx = renderCanvas.getContext('2d', { willReadFrequently: true });
renderCanvas.width = W; renderCanvas.height = H;
const imgData = rctx.createImageData(W, H);
const pix = imgData.data; // Uint8ClampedArray

function render() {
  // Map Dye (Planar RGB Float32) -> ImageData (Interleaved Uint8)
  // Apply simple Tonemapping / Gamma / Color Grading
  const N = W * H;
  const rBuf = dye, gBuf = dye.subarray(N), bBuf = dye.subarray(2*N);
  
  // Velocity Visualization
  if (viewVel) {
    for (let i = 0; i < N; i++) {
      if (obst[i]) { pix[i*4]=30; pix[i*4+1]=30; pix[i*4+2]=40; pix[i*4+3]=255; continue; }
      const vx = u[i], vy = v[i];
      const mag = Math.hypot(vx, vy) * 20; // Scale for visibility
      const angle = Math.atan2(vy, vx);
      // HSV to RGB
      const h = (angle + Math.PI) / (2*Math.PI); // 0-1
      const s = 1;
      const v = Math.min(1, mag);
      const c = v * s; const x = c * (1 - Math.abs((h*6)%2 - 1)); const m = v - c;
      let r=0,g=0,b=0;
      if(h<1/6){r=c;g=x;}else if(h<2/6){r=x;g=c;}else if(h<3/6){g=c;b=x;}else if(h<4/6){g=x;b=c;}else if(h<5/6){r=x;b=c;}else{r=c;b=x;}
      pix[i*4]   = (r+m)*255;
      pix[i*4+1] = (g+m)*255;
      pix[i*4+2] = (b+m)*255;
      pix[i*4+3] = 255;
    }
  } else {
    // Dye Rendering (Fire vs Ink Palette)
    for (let i = 0; i < N; i++) {
      if (obst[i]) { pix[i*4]=20; pix[i*4+1]=20; pix[i*4+2]=30; pix[i*4+3]=255; continue; }
      let r = rBuf[i], g = gBuf[i], b = bBuf[i];
      
      if (fireMode) {
        // Fire Palette: Heat (R) -> Yellow -> Orange -> Red -> Black
        // Use R as temperature. G/B are usually 0 or noise.
        const t = Math.min(1, r * 1.5); 
        // Blackbody approx
        r = t < 0.5 ? t*2 : 1;
        g = t < 0.5 ? 0 : (t-0.5)*2;
        b = 0;
        // Add noise/flicker
        const flicker = 0.95 + Math.random()*0.1;
        r *= flicker; g *= flicker;
      } else {
        // Ink Mode: Slight contrast boost & saturation
        const lum = 0.299*r + 0.587*g + 0.114*b;
        const sat = 1.5;
        r = lum + (r - lum) * sat;
        g = lum + (g - lum) * sat;
        b = lum + (b - lum) * sat;
      }
      
      // Gamma & Tonemap (Reinhard-ish)
      const exp = 1.2;
      r = Math.pow(CLAMP(r,0,1), 1/exp);
      g = Math.pow(CLAMP(g,0,1), 1/exp);
      b = Math.pow(CLAMP(b,0,1), 1/exp);

      pix[i*4]   = r * 255;
      pix[i*4+1] = g * 255;
      pix[i*4+2] = b * 255;
      pix[i*4+3] = 255;
    }
  }
  rctx.putImageData(imgData, 0, 0);

  // Draw to Screen (Scaled)
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(cam.x, cam.y);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(renderCanvas, -W/2, -H/2, W, H);
}

// --- Input Handling ---
function getSimCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  // Screen -> Canvas Center -> World -> Sim Grid
  const sx = (clientX - rect.left - rect.width/2) / cam.zoom - cam.x + W/2;
  const sy = (clientY - rect.top - rect.height/2) / cam.zoom - cam.y + H/2;
  return { x: sx, y: sy };
}

function injectForce(x, y, dx, dy, isRightClick) {
  const rad = Math.max(3, 8 / cam.zoom); // Radius in sim units
  const rad2 = rad * rad;
  const cx = Math.floor(x), cy = Math.floor(y);
  const rInt = Math.ceil(rad);

  for (let j = -rInt; j <= rInt; j++) {
    for (let i = -rInt; i <= rInt; i++) {
      const gx = cx + i, gy = cy + j;
      if (gx <= 0 || gx >= W-1 || gy <= 0 || gy >= H-1) continue;
      const dist2 = (gx - x)**2 + (gy - y)**2;
      if (dist2 > rad2) continue;
      const idx = IX(gx, gy);
      if (obst[idx]) continue;
      const falloff = 1 - dist2 / rad2;
      u[idx] += dx * FORCE_SCALE * falloff * DT * 10;
      v[idx] += dy * FORCE_SCALE * falloff * DT * 10;
      
      if (!isRightClick) {
        // Inject Dye (Color)
        const hue = Math.random(); // Random color per stroke? Or fixed palette?
        // Let's do a nice palette: HSL based on angle
        const angle = Math.atan2(dy, dx);
        const h = (angle + Math.PI) / (2*Math.PI);
        // HSL to RGB
        const s = 0.8, l = 0.5;
        const c = (1 - Math.abs(2*l - 1)) * s;
        const x_h = c * (1 - Math.abs((h*6)%2 - 1));
        const m = l - c/2;
        let r=0,g=0,b=0;
        if(h<1/6){r=c;g=x_h;}else if(h<2/6){r=x_h;g=c;}else if(h<3/6){g=c;b=x_h;}else if(h<4/6){g=x_h;b=c;}else if(h<5/6){r=x_h;b=c;}else{r=c;b=x_h;}
        r+=m; g+=m; b+=m;
        
        dye[idx]           += r * DYE_INJECT * falloff;
        dye[idx + W*H]     += g * DYE_INJECT * falloff;
        dye[idx + 2*W*H]   += b * DYE_INJECT * falloff;
      }
    }
  }
}

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouse.down = true;
  if (e.button === 1) mouse.mdown = true;
  if (e.button === 2) mouse.rdown = true;
  const pos = getSimCoords(e.clientX, e.clientY);
  mouse.x = pos.x; mouse.y = pos.y;
  mouse.px = pos.x; mouse.py = pos.y;
  e.preventDefault();
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.down = false;
  if (e.button === 1) mouse.mdown = false;
  if (e.button === 2) mouse.rdown = false;
});
window.addEventListener('mousemove', e => {
  const pos = getSimCoords(e.clientX, e.clientY);
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = pos.x; mouse.y = pos.y;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left - rect.width/2;
  const my = e.clientY - rect.top - rect.height/2;
  const factor = Math.exp(-e.deltaY * 0.001);
  cam.targetZoom = CLAMP(cam.targetZoom * factor, 0.2, 20);
  // Zoom towards mouse
  cam.x = mx - (mx - cam.x) * factor;
  cam.y = my - (my - cam.y) * factor;
}, { passive: false });

// Touch Support
let lastTouchDist = 0, lastTouchMid = {x:0,y:0};
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    mouse.down = true;
    const pos = getSimCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = mouse.px = pos.x; mouse.y = mouse.py = pos.y;
  } else if (e.touches.length === 2) {
    mouse.down = false;
    const t1 = e.touches[0], t2 = e.touches[1];
    lastTouchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    lastTouchMid = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && mouse.down) {
    const pos = getSimCoords(e.touches[0].clientX, e.touches[0].clientY);
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.x = pos.x; mouse.y = pos.y;
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    const mid = { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
    
    const factor = dist / (lastTouchDist || dist);
    cam.targetZoom = CLAMP(cam.targetZoom * factor, 0.2, 20);
    
    // Pan
    const dx = (mid.x - lastTouchMid.x) / cam.zoom;
    const dy = (mid.y - lastTouchMid.y) / cam.zoom;
    cam.x -= dx; cam.y -= dy;
    
    lastTouchDist = dist; lastTouchMid = mid;
  }
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', () => { mouse.down = false; lastTouchDist = 0; });

// Keys
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; }
  if (e.code === 'KeyC') { dye.fill(0); dye_prev.fill(0); }
  if (e.code === 'KeyF') { fireMode = !fireMode; document.getElementById('mode').textContent = fireMode ? 'FIRE' : 'INK'; }
  if (e.code === 'KeyV') { viewVel = !viewVel; document.getElementById('view').textContent = viewVel ? 'VEL' : 'DYE'; }
});

// Resize
function resize() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr); // Context scaling handled in render via setTransform
}
window.addEventListener('resize', resize);
resize();

// --- Main Loop ---
function loop(time) {
  requestAnimationFrame(loop);
  
  // FPS Counter
  frameCount++;
  if (time - lastTime > 1000) { fps = Math.round(frameCount * 1000 / (time - lastTime)); lastTime = time; frameCount = 0; document.getElementById('fps').textContent = fps; }

  // Smooth Zoom
  cam.zoom += (cam.targetZoom - cam.zoom) * 0.1;

  // Input Injection
  if (mouse.down || mouse.rdown) {
    const dx = mouse.x - mouse.px;
    const dy = mouse.y - mouse.py;
    if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
      injectForce(mouse.x, mouse.y, dx, dy, mouse.rdown);
    }
  }

  if (!paused) {
    // Swap buffers
    [u, u_prev] = [u_prev, u];
    [v, v_prev] = [v_prev, v];
    [dye, dye_prev] = [dye_prev, dye];
    
    step();
  }

  render();
}
requestAnimationFrame(loop);

</script>
</body>
