<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 16px;
            filter: grayscale(100%);
            opacity: 0.8;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 2rem;
            color: #212529;
        }
        p {
            margin: 0 0 32px 0;
            color: #6c757d;
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.5;
        }
        .btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #0b5ed7;
        }
        .btn:active {
            transform: scale(0.98);
        }
        
        /* Subtle animation for the icon */
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .icon {
            animation: pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="icon">🦖</div>
    <h1>No Internet Connection</h1>
    <p>It looks like you're currently offline. Please check your network connection and try again.</p>
    <!-- The button simply reloads the current page so they can try to reconnect -->
    <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
