<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" type="image/x-icon" href="https://qamotech.github.io/DevDashboard/favicon.ico">
<title>Miyagi-Do: Shadow Defense</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050c;font-family:Arial,Helvetica,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
button{font:inherit;pointer-events:auto}
#ui{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}
#hud{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:9px;padding:10px}
.panel{background:linear-gradient(145deg,#050b18eb,#0a1a31eb);border:1px solid #dcbf68;border-radius:12px;padding:8px 12px;box-shadow:0 6px 22px #0009,inset 0 0 22px #4d82c326;backdrop-filter:blur(5px);font-size:clamp(11px,1.7vw,17px);font-weight:700}
.panel:nth-child(2){text-align:center}
.panel:nth-child(3){text-align:right}
#bars{position:absolute;top:86px;left:10px;right:10px;display:flex;gap:8px}
.bar{height:9px;flex:1;border:1px solid #d6bc70;border-radius:9px;background:#050812;overflow:hidden}
.fill{height:100%;transition:width .15s}
#hpFill{background:linear-gradient(90deg,#7c1320,#ef604f)}
#dojoFill{background:linear-gradient(90deg,#8b651d,#ffe37b)}
#chiFill{background:linear-gradient(90deg,#16466e,#65e7ff)}
#message{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(23px,5vw,54px);text-align:center;color:#ffe782;opacity:0;transition:opacity .2s;filter:drop-shadow(0 4px 4px #000)}
#combo{position:absolute;right:18px;top:125px;color:#ffe36c;font-size:clamp(18px,4vw,38px);font-weight:900;opacity:0;transform:scale(.8);transition:.18s}
#help{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);white-space:nowrap;text-align:center;padding:7px 13px;font-size:clamp(9px,1.35vw,13px)}
.overlay{pointer-events:auto;position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 28%,#10284c99,#01030aef);padding:14px}
.menu{position:relative;width:min(94vw,820px);max-height:94vh;overflow:auto;border:2px solid #e2c568;border-radius:24px;background:linear-gradient(150deg,#0c1c35 0,#050b17 55%,#01040a 100%);box-shadow:0 26px 90px #000,inset 0 0 60px #4d7fb42a;padding:26px}
.menu:before,.menu:after{content:"";position:absolute;inset:8px;border:1px solid #c5a94b55;border-radius:17px;pointer-events:none}
.menu:after{inset:14px;border-color:#fff1a516}
.hero{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:10px;text-align:center}
.hero svg{width:100%;height:auto;filter:drop-shadow(0 7px 7px #000)}
h1{margin:0;color:#f1d36c;font-size:clamp(34px,7vw,72px);letter-spacing:.08em;line-height:.95}
h2{margin:8px 0;color:#f6f0ce;font-size:clamp(17px,3vw,27px)}
.sub{margin:8px auto 18px;max-width:660px;color:#cbd7e5;line-height:1.5}
.actions{display:flex;justify-content:center;gap:10px;margin-top:17px;flex-wrap:wrap}
.btn{pointer-events:auto;cursor:pointer;border:0;border-radius:999px;padding:13px 25px;font-weight:900;letter-spacing:.04em;color:#111a25;background:linear-gradient(#ffe58b,#c8a641);box-shadow:0 8px 22px #0008,0 0 18px #ffe36b35;transition:.15s}
.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.08)}
.btn.alt{color:#eef5ff;background:#0c213d;border:1px solid #a7904c;box-shadow:none}
#pause,#gameover{display:none}
.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
.statBox{padding:10px;border-radius:11px;background:#020711;border:1px solid #3a577d;text-align:center;color:#dbe5f0}
.statBox strong{display:block;color:#ffe180;font-size:19px;margin-top:4px}
#fsBtn{position:absolute;top:10px;right:10px;background:#050b18eb;color:#65e7ff;border:1px solid #65e7ff;border-radius:8px;padding:8px 12px;font-size:18px;z-index:9;cursor:pointer;box-shadow:0 0 10px #65e7ff44}
#btnChi,#btnSwd{position:absolute;bottom:30px;width:70px;height:70px;border-radius:50%;background:#020711ee;border:2px solid;font-size:28px;font-weight:900;z-index:9;cursor:pointer;display:flex;justify-content:center;align-items:center}
#btnChi{left:20px;border-color:#65e7ff;color:#65e7ff;box-shadow:0 0 20px #65e7ff66}
#btnSwd{right:20px;border-color:#ff755d;color:#ff755d;box-shadow:0 0 20px #ff755d66}
@media(max-width:600px){#hud{grid-template-columns:1fr 1fr}.panel:nth-child(3){grid-column:1/-1;text-align:center}.hero{grid-template-columns:65px 1fr 65px}.menu{padding:20px 15px}#bars{top:120px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="fsBtn">⛶</button>
  <button id="btnChi">氣</button>
  <button id="btnSwd">⚔</button>
  <div id="hud">
    <div class="panel" id="stats"></div>
    <div class="panel" id="power"></div>
    <div class="panel" id="health"></div>
  </div>
  <div id="bars">
    <div class="bar"><div class="fill" id="hpFill"></div></div>
    <div class="bar"><div class="fill" id="dojoFill"></div></div>
    <div class="bar"><div class="fill" id="chiFill"></div></div>
  </div>
  <div id="message"></div>
  <div id="combo"></div>
  <div id="help" class="panel">A/D/drag: move • Space/Swd: sword • E/Chi: blast • P: pause</div>

  <div class="overlay" id="start">
    <div class="menu">
      <div class="hero">
        <svg viewBox="0 0 120 220" aria-hidden="true"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fffbdc"/><stop offset=".45" stop-color="#aebac8"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#7d8996"/></linearGradient></defs><path d="M57 7h6l7 144-10 39-10-39z" fill="url(#b)" stroke="#17202c" stroke-width="4"/><path d="M34 147h52v11H34z" rx="4" fill="#d8bb55" stroke="#211b0e" stroke-width="4"/><path d="M50 158h20v51H50z" fill="#35221b" stroke="#140f0d" stroke-width="4"/><path d="M50 164l20 11m-20 4l20 11m-20 4l20 11" stroke="#ddbd62" stroke-width="4"/></svg>
        <div>
          <h1>MIYAGI-DO</h1>
          <h2>SHADOW DEFENSE</h2>
        </div>
      </div>
      <p class="sub">Defend Miyagi-Do. Train on left, break barriers on right.</p>
      <div class="actions">
        <button class="btn" id="play">BEGIN TRAINING</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="pause">
    <div class="menu">
      <div class="hero">
        <div>
          <h1>PAUSED</h1>
          <h2>FIND YOUR BALANCE</h2>
        </div>
      </div>
      <div class="statsGrid">
        <div class="statBox">Throw level <strong id="pThrow"></strong></div>
        <div class="statBox">Throws/sec <strong id="pRate"></strong></div>
        <div class="statBox">Sword level <strong id="pSword"></strong></div>
        <div class="statBox">Combo <strong id="pCombo"></strong></div>
        <div class="statBox">Chi <strong id="pChi"></strong></div>
        <div class="statBox">Wave <strong id="pWave"></strong></div>
      </div>
      <div class="actions">
        <button class="btn" id="resume">RESUME</button>
        <button class="btn alt" id="restart">RESTART</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="gameover">
    <div class="menu">
      <div class="hero">
        <div>
          <h1>DOJO FALLEN</h1>
          <h2 id="final"></h2>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="again">TRAIN AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
/* Miyagi-Do Code Asset Pack Integrated */
const MiyagiAssets = (() => {
  const TAU = Math.PI * 2;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  function glow(ctx, color, blur, fn){
    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=blur; fn(); ctx.restore();
  }
  function line(ctx, color, width=2){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.lineJoin="round";
  }
  function poly(ctx, pts, fill, stroke="#070a10", width=2){
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){line(ctx,stroke,width);ctx.stroke();}
  }
  function hpBar(ctx,w,h,p,color="#e5483f"){
    ctx.fillStyle="#05070c";ctx.fillRect(-w/2,-h/2,w,h);
    ctx.fillStyle=color;ctx.fillRect(-w/2+1,-h/2+1,(w-2)*clamp(p,0,1),h-2);
    line(ctx,"#caa54a",1.2);ctx.strokeRect(-w/2,-h/2,w,h);
  }

  function drawShadowNinja(ctx,x,y,s=1,o={}){
    const hit=o.hit>0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    glow(ctx,"rgba(225,50,45,.35)",10,()=>{
      const g=ctx.createLinearGradient(-26,-30,24,35);
      g.addColorStop(0,hit?"#fff":"#303846");g.addColorStop(.55,hit?"#fff":"#111721");g.addColorStop(1,"#03060b");
      poly(ctx,[[-17,-25],[-29,-7],[-24,24],[0,37],[24,24],[29,-7],[17,-25],[0,-35]],g);
    });
    ctx.fillStyle="#080b11";ctx.beginPath();ctx.ellipse(0,-11,19,15,0,0,TAU);ctx.fill();
    line(ctx,"#a91f2a",4);ctx.beginPath();ctx.moveTo(-20,-5);ctx.lineTo(20,-5);ctx.stroke();
    ctx.fillStyle="#f3f5f6";
    poly(ctx,[[-13,-14],[-4,-16],[-7,-10],[-15,-9]],"#f4f6f7",null);
    poly(ctx,[[13,-14],[4,-16],[7,-10],[15,-9]],"#f4f6f7",null);
    line(ctx,"#4c5662",2);ctx.beginPath();ctx.moveTo(-11,10);ctx.lineTo(0,16);ctx.lineTo(11,10);ctx.stroke();
    if(o.hp!=null){ctx.translate(0,-48);hpBar(ctx,48,6,o.hp);}
    ctx.restore();
  }

  function drawSwordAssassin(ctx,x,y,s=1,o={}){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    const hit=o.hit>0;
    glow(ctx,"rgba(255,80,35,.25)",12,()=>{
      const g=ctx.createLinearGradient(-25,-30,25,35);
      g.addColorStop(0,hit?"#fff":"#4b4f58");g.addColorStop(.4,hit?"#fff":"#1f2630");g.addColorStop(1,"#06090f");
      poly(ctx,[[-16,-31],[-27,-18],[-25,22],[-9,35],[0,28],[9,35],[25,22],[27,-18],[16,-31],[0,-37]],g);
    });
    ctx.fillStyle="#0c1118";ctx.fillRect(-20,-18,40,15);
    line(ctx,"#d5a13b",3);ctx.beginPath();ctx.moveTo(-21,1);ctx.lineTo(21,1);ctx.stroke();
    for(const r of [-.68,.68]){
      ctx.save();ctx.rotate(r);ctx.fillStyle="#e6edf4";ctx.fillRect(-2,-35,4,52);
      ctx.fillStyle="#d0a64a";ctx.fillRect(-9,14,18,4);ctx.fillStyle="#53281d";ctx.fillRect(-3,18,6,17);ctx.restore();
    }
    ctx.fillStyle="#f6f3dd";
    poly(ctx,[[-12,-10],[-3,-13],[-6,-7]],"#f6f3dd",null);
    poly(ctx,[[12,-10],[3,-13],[6,-7]],"#f6f3dd",null);
    if(o.hp!=null){ctx.translate(0,-50);hpBar(ctx,50,6,o.hp);}
    ctx.restore();
  }

  function drawSpearGuard(ctx,x,y,s=1,o={}){
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    const g=ctx.createLinearGradient(-24,-34,24,37);
    g.addColorStop(0,"#6c5320");g.addColorStop(.5,"#22242b");g.addColorStop(1,"#080a0e");
    poly(ctx,[[-17,-25],[-27,-12],[-25,24],[0,38],[25,24],[27,-12],[17,-25],[0,-34]],g,"#0a0c10",2);
    poly(ctx,[[-31,-20],[0,-37],[31,-20]],"#4f3917","#d7b355",2);
    line(ctx,"#d7b355",3);ctx.beginPath();ctx.moveTo(0,-33);ctx.lineTo(0,35);ctx.stroke();
    ctx.save();ctx.rotate(-.25);ctx.fillStyle="#6f4722";ctx.fillRect(-2,-38,4,75);
    poly(ctx,[[-7,-42],[0,-58],[7,-42]],"#e7eef5","#26303b",1.5);ctx.restore();
    ctx.fillStyle="#f3efdc";
    poly(ctx,[[-11,-11],[-3,-13],[-6,-8]],"#f3efdc",null);
    poly(ctx,[[11,-11],[3,-13],[6,-8]],"#f3efdc",null);
    if(o.hp!=null){ctx.translate(0,-51);hpBar(ctx,50,6,o.hp,"#dfad3d");}
    ctx.restore();
  }

  function drawChiAdept(ctx,x,y,s=1,o={}){
    const phase=o.phase||0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    poly(ctx,[[-18,-27],[-27,-8],[-22,27],[0,38],[22,27],[27,-8],[18,-27],[0,-35]],"#101720","#05080d",2);
    poly(ctx,[[-31,-20],[0,-38],[31,-20]],"#24313a","#6eeaff",1.5);
    ctx.fillStyle="#f2f8ff";
    poly(ctx,[[-12,-10],[-3,-13],[-7,-7]],"#f2f8ff",null);
    poly(ctx,[[12,-10],[3,-13],[7,-7]],"#f2f8ff",null);
    const orbY=14;
    glow(ctx,"#55e9ff",18+Math.sin(phase*5)*5,()=>{
      ctx.fillStyle="#baf8ff";ctx.beginPath();ctx.arc(0,orbY,8+Math.sin(phase*4),0,TAU);ctx.fill();
      line(ctx,"#5be9ff",2);ctx.beginPath();ctx.arc(0,orbY,15+Math.sin(phase*3)*2,0,TAU);ctx.stroke();
    });
    if(o.hp!=null){ctx.translate(0,-51);hpBar(ctx,50,6,o.hp,"#38bdec");}
    ctx.restore();
  }

  function drawDragonChampion(ctx,x,y,s=1,o={}){
    const phase=o.phase||0, hit=o.hit>0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    glow(ctx,"rgba(255,75,20,.45)",18,()=>{
      const g=ctx.createLinearGradient(-30,-40,30,40);
      g.addColorStop(0,hit?"#fff":"#8b5521");g.addColorStop(.25,hit?"#fff":"#353742");g.addColorStop(1,"#080a0f");
      poly(ctx,[[-22,-32],[-34,-18],[-30,25],[-15,38],[0,31],[15,38],[30,25],[34,-18],[22,-32],[0,-41]],g,"#100b08",2.5);
    });
    poly(ctx,[[-21,-31],[-34,-48],[-12,-38]],"#c79538","#26180a",2);
    poly(ctx,[[21,-31],[34,-48],[12,-38]],"#c79538","#26180a",2);
    ctx.fillStyle="#0b0d13";ctx.beginPath();ctx.ellipse(0,-12,22,18,0,0,TAU);ctx.fill();
    glow(ctx,"#ff3a18",10,()=>{
      ctx.fillStyle="#ff5636";
      poly(ctx,[[-14,-16],[-4,-18],[-8,-11]],"#ff5636",null);
      poly(ctx,[[14,-16],[4,-18],[8,-11]],"#ff5636",null);
    });
    line(ctx,"#e0af42",2.5);ctx.beginPath();ctx.arc(0,13,10,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8,13);ctx.quadraticCurveTo(0,2,8,13);ctx.quadraticCurveTo(0,24,-8,13);ctx.stroke();
    if(o.hp!=null){ctx.translate(0,-60);hpBar(ctx,66,7,o.hp,"#e94129");}
    ctx.restore();
  }

  function drawFlyingDragon(ctx,x,y,s=1,o={}){
    const phase=o.phase||0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    const breathe=o.breathe||0;
    glow(ctx,"rgba(255,45,10,.25)",18,()=>{
      line(ctx,"#17191f",16);
      ctx.beginPath();
      ctx.moveTo(-80,5);
      ctx.bezierCurveTo(-45,-45,-15,38,18,-10);
      ctx.bezierCurveTo(50,-55,87,-22,92,12);
      ctx.stroke();
      line(ctx,"#675342",3);
      ctx.beginPath();
      ctx.moveTo(-80,5);
      ctx.bezierCurveTo(-45,-45,-15,38,18,-10);
      ctx.bezierCurveTo(50,-55,87,-22,92,12);
      ctx.stroke();
    });
    ctx.save();ctx.translate(-82,5);
    poly(ctx,[[-18,-8],[-5,-19],[12,-14],[22,-3],[12,10],[-7,13],[-22,4]],"#15171d","#6a5848",2);
    poly(ctx,[[-8,-16],[-2,-30],[3,-17]],"#17191e","#7e6a58",1.5);
    poly(ctx,[[3,-16],[12,-27],[10,-12]],"#17191e","#7e6a58",1.5);
    glow(ctx,"#ff3218",9,()=>{ctx.fillStyle="#ff4930";ctx.beginPath();ctx.arc(-5,-5,2.7,0,TAU);ctx.fill();});
    line(ctx,"#a8271e",2);ctx.beginPath();ctx.moveTo(-13,5);ctx.lineTo(9,5);ctx.stroke();
    if(breathe>0){
      const len=55+35*breathe;
      const grad=ctx.createLinearGradient(-15,0,-15-len,0);
      grad.addColorStop(0,"rgba(255,245,160,.95)");grad.addColorStop(.35,"rgba(255,110,25,.9)");grad.addColorStop(1,"rgba(255,25,0,0)");
      ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-14,2);ctx.quadraticCurveTo(-45,-18,-15-len,0);ctx.quadraticCurveTo(-45,18,-14,8);ctx.fill();
    }
    ctx.restore();
    for(let i=0;i<7;i++){
      const px=-42+i*19, py=Math.sin(phase+i*.8)*8-12;
      poly(ctx,[[px,py],[px+6,py-17],[px+12,py+1]],"#252830","#776455",1);
    }
    ctx.restore();
  }

  function drawShuriken(ctx,x,y,s=1,o={}){
    const spin=o.spin||0;
    ctx.save();ctx.translate(x,y);ctx.rotate(spin);ctx.scale(s,s);
    glow(ctx,"rgba(110,225,255,.55)",8,()=>{
      const g=ctx.createLinearGradient(-12,-12,12,12);
      g.addColorStop(0,"#ffffff");g.addColorStop(.45,"#93a6b5");g.addColorStop(1,"#313d49");
      ctx.fillStyle=g;line(ctx,"#0a1018",1.5);ctx.beginPath();
      for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,r=i%2?4:14;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#07101a";ctx.beginPath();ctx.arc(0,0,2.5,0,TAU);ctx.fill();
    });ctx.restore();
  }

  function drawChiOrb(ctx,x,y,s=1,o={}){
    const phase=o.phase||0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    glow(ctx,"#55eaff",18+4*Math.sin(phase*5),()=>{
      ctx.fillStyle="#b9faff";ctx.beginPath();ctx.arc(0,0,10,0,TAU);ctx.fill();
      line(ctx,"#42dfff",2);ctx.beginPath();ctx.arc(0,0,16+Math.sin(phase*4)*2,0,TAU);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,22+Math.cos(phase*3)*3,phase,phase+Math.PI*1.2);ctx.stroke();
    });ctx.restore();
  }

  function drawHealingLantern(ctx,x,y,s=1,o={}){
    const phase=o.phase||0;
    ctx.save();ctx.translate(x,y+Math.sin(phase*3)*3);ctx.scale(s,s);
    glow(ctx,"#70f4ff",18,()=>{
      ctx.fillStyle="#d8fbff";ctx.fillRect(-10,-14,20,28);
      line(ctx,"#3e6d88",2);ctx.strokeRect(-10,-14,20,28);
      ctx.fillStyle="#2a5975";ctx.fillRect(-2,-11,4,22);ctx.fillRect(-8,-2,16,4);
    });ctx.restore();
  }

  function drawEcoOrb(ctx,x,y,s=1,o={}){
    const phase=o.phase||0;
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);
    glow(ctx,"#5aff8a",20,()=>{
      ctx.fillStyle="#c7ffae";ctx.beginPath();ctx.arc(0,0,11+Math.sin(phase*4),0,TAU);ctx.fill();
      line(ctx,"#5aff8a",2);ctx.beginPath();ctx.arc(0,0,17,0,TAU);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-6,2);ctx.quadraticCurveTo(-2,-8,7,-7);ctx.quadraticCurveTo(6,3,-6,2);ctx.stroke();
    });ctx.restore();
  }

  function drawImpact(ctx,x,y,s=1,o={}){
    const life=clamp(o.life??1,0,1), type=o.type||"spark";
    ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=life;
    const color=type==="chi"?"#62ebff":type==="ember"?"#ff7a28":"#ffe080";
    line(ctx,color,2.5);
    for(let i=0;i<12;i++){
      const a=i*TAU/12+(o.phase||0), r1=5, r2=10+25*(1-life)+i%3*4;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke();
    }
    ctx.restore();
  }

  function drawMenuDragon(ctx,w,h,t){
    ctx.save();ctx.translate(w*.52,h*.34);
    const pulse=.10+.045*Math.sin(t*1.4);
    ctx.globalAlpha=pulse;
    ctx.scale(Math.min(w/900,h/600),Math.min(w/900,h/600));
    line(ctx,"#e8c45d",5);
    ctx.beginPath();ctx.moveTo(-270,30);
    ctx.bezierCurveTo(-205,-125,-90,95,10,-40);
    ctx.bezierCurveTo(115,-165,245,-75,280,30);ctx.stroke();
    ctx.fillStyle="#e8c45d";ctx.beginPath();
    ctx.moveTo(-280,29);ctx.lineTo(-313,3);ctx.lineTo(-298,-17);ctx.lineTo(-270,-10);
    ctx.lineTo(-251,5);ctx.lineTo(-266,31);ctx.closePath();ctx.fill();

  if(wave%8===0 && enemies.some(e=>e.t===3)) MiyagiAssets.drawBossWarning(X,W,Q,performance.now()/1000);

  if(penTarget){X.strokeStyle="rgba(0,255,255,0.4)";X.setLineDash([5,15]);X.lineWidth=2;X.beginPath();X.moveTo(player.x,player.y);X.lineTo(penTarget.x,penTarget.y);X.stroke();X.setLineDash([])}
  gates.forEach(g=>{X.save();X.translate(g.x,g.y);X.fillStyle="#0b2842";X.strokeStyle="#71e7ff";X.lineWidth=4;X.fillRect(-g.w/2,-g.h/2,g.w,g.h);X.strokeRect(-g.w/2,-g.h/2,g.w,g.h);if(g.t==="SWORD")sA(-42,0,.55);X.fillStyle="#e6fbff";X.font="bold 14px Arial";X.textAlign="center";X.fillText(g.t,g.t==="SWORD"?14:0,-2);X.font="11px Arial";X.fillText("HP "+Math.max(0,Math.ceil(g.hp)),0,20);X.restore()});
  walls.forEach(o=>{X.save();X.translate(o.x,o.y);X.fillStyle="#262b38";X.strokeStyle="#e0c362";X.lineWidth=4;X.fillRect(-o.w/2,-o.h/2,o.w,o.h);for(let x=-o.w/2+12;x<o.w/2;x+=25){X.beginPath();X.moveTo(x,-o.h/2);X.lineTo(x+13,o.h/2);X.stroke()}if(o.rw.includes("SWORD"))sA(-50,0,.45);X.fillStyle="#fff0a2";X.font="bold 12px Arial";X.textAlign="center";X.fillText(o.rw,o.rw.includes("SWORD")?11:0,-8);X.fillText(Math.max(0,Math.ceil(o.hp))+" / "+Math.ceil(o.m),0,16);X.restore()});
  
  // Use MiyagiAssets for Pickups
  lanterns.forEach(l=>MiyagiAssets.drawHealingLantern(X,l.x,l.y,l.r/18,{phase:l.p}));
  ecoOrbs.forEach(e=>MiyagiAssets.drawEcoOrb(X,e.x,e.y,e.r/14,{phase:e.p}));
  
  // Use MiyagiAssets for Stars/Shurikens
  stars.forEach(s=>MiyagiAssets.drawShuriken(X,s.x,s.y,s.r/8,{spin:s.sp}));
  
  enemies.forEach(eD);
  slashes.forEach(s=>{X.strokeStyle="#fff5a4";X.lineWidth=7;X.globalAlpha=Math.max(0,s.l/.25);X.beginPath();X.arc(s.x,s.y,s.r,-2.85,.2);X.stroke();X.globalAlpha=1});
  
  rings.forEach(r=>MiyagiAssets.drawChiOrb(X,r.x,r.y,r.r/22,{phase:1-r.l/r.m}));
  pD();
  bits.forEach(b=>{let a=Math.max(0,b.l/b.m);X.globalAlpha=a;X.fillStyle=b.c;if(b.t==="s"){X.save();X.translate(b.x,b.y);X.rotate(Math.atan2(b.vy,b.vx));X.fillRect(-b.s*2,-b.s/2,b.s*4,b.s);X.restore()}else{X.beginPath();X.arc(b.x,b.y,b.s*a+.5,0,7);X.fill()}X.globalAlpha=1});
  X.restore()
}

function loop(t){let ms=Math.min(34,t-last||16),dt=ms/1e3;last=t;if(state===ST.PLAYING)uG(dt,ms);dS();requestAnimationFrame(loop)}
function setSt(s){state=s;A.style.display=s===ST.MENU?"flex":"none";U.style.display=s===ST.PAUSED?"flex":"none";G.style.display=s===ST.GAMEOVER?"flex":"none"}
function ed(){F.textContent=`Score ${score} · Wave ${wave} · ${kills} defeated`;setSt(ST.GAMEOVER)}

addEventListener("resize",resize);
q("#play").onclick=()=>{reset();setSt(ST.PLAYING);last=performance.now()};
q("#again").onclick=()=>{reset();setSt(ST.PLAYING);last=performance.now()};
q("#restart").onclick=()=>{reset();setSt(ST.PLAYING);last=performance.now()};
q("#resume").onclick=()=>{if(state===ST.PLAYING){setSt(ST.PAUSED);q("#pThrow").textContent=throwLv;q("#pRate").textContent=tps().toFixed(1);q("#pSword").textContent=swordLv;q("#pCombo").textContent="×"+combo;q("#pChi").textContent=Math.floor(chi)+"%";q("#pWave").textContent=wave}else if(state===ST.PAUSED){setSt(ST.PLAYING);last=performance.now()}};
q("#fsBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
q("#btnChi").onpointerdown=e=>{e.preventDefault();blst()};
q("#btnSwd").onpointerdown=e=>{e.preventDefault();swd()};
addEventListener("keydown",e=>{keys[e.key]=1;if(e.code==="Space"){e.preventDefault();swd()}if(e.key==="e"||e.key==="E")blst();if(e.key==="p"||e.key==="P"||e.key==="Escape")q("#resume").onclick()});
addEventListener("keyup",e=>keys[e.key]=0);
C.addEventListener("pointerdown",e=>{pointer=e.clientX;C.setPointerCapture(e.pointerId);if(e.pointerType!=='pen')swd()});
C.addEventListener("pointermove",e=>{if(e.buttons)pointer=e.clientX;if(e.pointerType==='pen')penTarget={x:e.clientX,y:e.clientY}});
C.addEventListener("pointerup",()=>{pointer=null;penTarget=null});
resize();reset();setSt(ST.MENU);requestAnimationFrame(loop)
})();
</script>
