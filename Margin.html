<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Margin — business cockpit</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#fffefb; --sunk:#efece5; --ink:#1c1b18; --ink2:#3d3b36; --muted:#77736a; --line:#e3dfd5; --line2:#d3cec2;
  --accent:#1d6b48; --accent-soft:#e2efe7; --accent-ink:#fff;
  --warn:#a85a12; --warn-soft:#f7ebdc; --danger:#b3261e; --danger-soft:#f8e3e1; --info:#2e5c9a; --info-soft:#e3ebf6;
  --exp:#b9b2a3;
  --r:10px; --shadow:0 1px 2px rgba(28,27,24,.05),0 4px 16px rgba(28,27,24,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121311; --surface:#1a1b18; --sunk:#161714; --ink:#ecebe5; --ink2:#cfcdc5; --muted:#9a968c; --line:#2b2c28; --line2:#3a3b36;
  --accent:#56c08e; --accent-soft:#1d3127; --accent-ink:#0d1a13;
  --warn:#e09a4f; --warn-soft:#33261a; --danger:#f0776d; --danger-soft:#3a1e1c; --info:#7fa8e0; --info-soft:#1c2636;
  --exp:#5a5850; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;padding:4px 10px 18px}
.brand b{font:600 22px/1 var(--serif);letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink2);text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none;opacity:.75}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.nav[aria-current="page"] svg{opacity:1;color:var(--accent)}
.nav kbd{margin-left:auto}
.side .grow{flex:1}
.side .biz{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;padding:0 32px 64px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 0 14px;background:linear-gradient(var(--bg) 80%,transparent)}
.top h1{font:600 26px/1.1 var(--serif);margin:0;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{display:block;font:13px/1.4 var(--sans);color:var(--muted);margin-top:4px;letter-spacing:0}
kbd{font:11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500;transition:background .12s,border-color .12s,transform .08s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.icon{width:34px;padding:0}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.in,select.in,textarea.in{height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.full{grid-column:1/-1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.num{text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}

/* timer */
.timer{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;max-width:320px}
.timer .t{font-family:var(--mono);font-size:13px}
.timer .j{color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.timer .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite;flex:none}
.timer button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:24px;padding:0 10px;cursor:pointer;font-size:12px;font-weight:600}
@keyframes pulse{50%{opacity:.3}}

/* cards / kpis */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card>header h2{font:600 15px/1.2 var(--sans);margin:0;flex:1}
.card .body{padding:14px 16px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font:600 26px/1.15 var(--serif);margin-top:6px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--danger)} .kpi.good .v{color:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer;transition:background .1s}
.tbl tbody tr.click:hover{background:var(--sunk)}
.tbl .strong{font-weight:600}
.tbl .sub{font-size:12px;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.draft{color:var(--muted)}
.pill.sent{background:var(--info-soft);color:var(--info)}
.pill.paid{background:var(--accent-soft);color:var(--accent)}
.pill.overdue{background:var(--danger-soft);color:var(--danger)}
.pill.lead{color:var(--muted)} .pill.active{background:var(--info-soft);color:var(--info)}
.pill.review{background:var(--warn-soft);color:var(--warn)} .pill.done{background:var(--accent-soft);color:var(--accent)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.list .ic svg{width:16px;height:16px}
.list .ic.bad{background:var(--danger-soft);color:var(--danger)} .list .ic.warn{background:var(--warn-soft);color:var(--warn)} .list .ic.good{background:var(--accent-soft);color:var(--accent)}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .tx span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--danger)}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.lane{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:280px;display:flex;flex-direction:column;gap:8px;transition:background .12s,box-shadow .12s}
.lane.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.lane>h3{display:flex;align-items:center;gap:8px;margin:2px 4px 4px;font-size:13px;font-weight:600}
.lane>h3 .c{color:var(--muted);font-weight:500}
.lane>h3 .v{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .12s,transform .12s,box-shadow .12s;text-align:left;width:100%}
.jcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.jcard.dragging{opacity:.4}
.jcard b{display:block;font-weight:600;margin-bottom:2px}
.jcard .cl{font-size:12px;color:var(--muted)}
.jcard .meta{display:flex;gap:10px;margin-top:9px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.jcard .meta .due-soon{color:var(--warn);font-weight:600} .jcard .meta .due-late{color:var(--danger);font-weight:600}
.jcard .bar{margin-top:9px}
.lane .add{border:1px dashed var(--line2);background:none;border-radius:9px;padding:9px;color:var(--muted);cursor:pointer}
.lane .add:hover{color:var(--ink);border-color:var(--muted)}

/* chart */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.r{fill:var(--accent)} .chart rect.e{fill:var(--exp)}
.chart rect:hover{opacity:.8}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .bar{height:8px}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.28);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,19,16,.42)}
dialog[open]{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}}
.dlg-h{display:flex;align-items:center;gap:8px;padding:18px 20px 4px}
.dlg-h h2{font:600 19px/1.2 var(--serif);margin:0;flex:1}
.dlg-b{padding:14px 20px;display:grid;gap:12px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--line)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(520px,100vw);border-radius:14px 0 0 14px;display:flex;flex-direction:column}
dialog.drawer[open]{display:flex;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
dialog.drawer .dlg-b{flex:1;align-content:start}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{background:var(--sunk);border-radius:9px;padding:10px 12px}
.stat3 .l{font-size:11px;color:var(--muted)}
.stat3 .v{font-weight:600;font-size:16px;margin-top:2px}
.sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 -4px}

/* palette */
#palette{width:min(600px,calc(100vw - 24px));margin-top:12vh}
#palette input{border:0;border-bottom:1px solid var(--line);height:54px;padding:0 20px;font-size:16px;width:100%;background:none;outline:none}
#palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#palette li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
#palette li[aria-selected="true"]{background:var(--accent-soft)}
#palette li .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;width:62px;flex:none}
#palette li .x{margin-left:auto;font-size:12px;color:var(--muted)}
#palette .empty{padding:20px;color:var(--muted);text-align:center}

/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;animation:pop .18s ease-out}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}

/* invoice paper */
.inv-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.paper{color-scheme:light;background:#fff;color:#1c1b18;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.06),0 20px 50px rgba(0,0,0,.08);padding:48px 52px;min-height:900px;max-width:820px}
.paper .p-in{border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 6px;margin:-3px -6px;width:100%;color:inherit}
.paper .p-in:hover{border-color:#e3dfd5}
.paper .p-in:focus{outline:none;border-color:#1d6b48;background:#f6fbf8}
.paper .p-head{display:flex;justify-content:space-between;gap:24px;margin-bottom:40px}
.paper .p-title{font:600 34px/1 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
.paper .p-biz{text-align:right;font-size:13px;line-height:1.55;color:#55524b;white-space:pre-line}
.paper .p-biz b{color:#1c1b18;font-size:15px}
.paper .p-meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px;margin-bottom:34px;font-size:13px}
.paper .p-meta .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8a867c;margin-bottom:4px}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8a867c;font-weight:500;text-align:left;padding:8px 6px;border-bottom:1.5px solid #1c1b18}
.paper td{padding:8px 6px;border-bottom:1px solid #ebe8e0;vertical-align:top}
.paper td.n,.paper th.n{text-align:right}
.paper td .p-in.n{text-align:right}
.paper .x-line{opacity:0;border:0;background:none;color:#b3261e;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.paper tr:hover .x-line,.paper .x-line:focus{opacity:1}
.paper .totals{margin:18px 0 0 auto;width:280px;font-size:13.5px}
.paper .totals div{display:flex;justify-content:space-between;padding:5px 6px}
.paper .totals .grand{border-top:1.5px solid #1c1b18;margin-top:6px;padding-top:10px;font:600 20px var(--serif)}
.paper .stamp{display:inline-block;border:2px solid #1d6b48;color:#1d6b48;font-weight:700;letter-spacing:.12em;padding:4px 12px;border-radius:6px;transform:rotate(-4deg);font-size:13px}
.paper .stamp.overdue{border-color:#b3261e;color:#b3261e}
.paper .p-notes{margin-top:48px;font-size:13px;color:#55524b}
.paper textarea.p-in{resize:vertical;min-height:60px;font-size:13px}
.addline{margin-top:8px;border:1px dashed #d3cec2;background:none;color:#77736a;border-radius:6px;padding:6px 10px;cursor:pointer}
.side-panel{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}

/* empty / welcome */
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.welcome{padding:36px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.welcome h2{font:600 30px/1.15 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.welcome p{color:var(--ink2);margin:0 0 20px;max-width:46ch}
.flow{display:flex;flex-direction:column;gap:10px;counter-reset:f}
.flow div{display:flex;gap:12px;align-items:center;background:var(--sunk);padding:12px 14px;border-radius:10px;font-weight:500}
.flow div::before{counter-increment:f;content:counter(f);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.check:hover{background:var(--sunk)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check .tx{flex:1;min-width:0}
.check .tx span{display:block;font-size:12px;color:var(--muted)}
.mobile-new{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.inv-layout{grid-template-columns:minmax(0,1fr)}.side-panel{position:static}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .top{gap:8px}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20;background:var(--surface)}
  .side .brand,.side .grow,.side .biz,.nav kbd,.side .nav.settings{display:none}
  .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;align-items:center;width:auto;flex:1}
  .nav[aria-current="page"]{box-shadow:none;background:var(--accent-soft)}
  main{padding:0 16px 96px}
  .top h1{font-size:21px}
  .top .hide-m{display:none}
  .kpis{gap:8px}.kpi .v{font-size:21px}
  .grid2,.grid3{grid-template-columns:1fr}
  .welcome{grid-template-columns:1fr;padding:22px}
  .paper{padding:24px 18px;min-height:0}
  .paper .p-head{flex-direction:column}.paper .p-biz{text-align:left}
  .paper .p-meta{grid-template-columns:1fr 1fr}
  .timer .j{display:none}
  .hbar{grid-template-columns:80px 1fr 70px}
}
@media print{
  body{background:#fff}
  .side,.top,.side-panel,.toasts,.addline,.x-line,.no-print{display:none!important}
  main{padding:0}
  .app{display:block}
  .inv-layout{display:block}
  .paper{box-shadow:none;padding:0;max-width:none;min-height:0}
  .paper .p-in{border:0!important;background:none!important}
  .paper input[type=number]::-webkit-inner-spin-button{display:none}
}

<script>
'use strict';
/* ───────────── utilities ───────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(s);
const fv = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(fv).join('') : (v === false || v == null) ? '' : esc(v);
function html(strings, ...vals) { let o = ''; strings.forEach((s, i) => { o += s; if (i < vals.length) o += fv(vals[i]); }); return raw(o); }
// Single sink for markup: only accepts output of the escaping html`` tag, parsed via <template>.
function put(el, r) {
  if (!(r instanceof Raw)) throw new TypeError('put() requires html`` output');
  const t = document.createElement('template'); t.innerHTML = r.s; el.replaceChildren(t.content);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Dates are LOCAL calendar keys on purpose: business days follow the owner's calendar, not UTC.
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dkey();
const parseD = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate() + n); return dkey(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const mkey = k => k.slice(0, 7);
const fmtDate = k => { if (!k) return '—'; const d = parseD(k); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
const fmtMonth = m => parseD(m + '-01').toLocaleDateString(undefined, { month: 'short' });
const relDays = k => { const n = daysBetween(today(), k); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? `in ${n}d` : `${-n}d ago`; };

let curFmt, curFmt0;
function setCurrency() {
  try { curFmt = new Intl.NumberFormat(undefined, { style: 'currency', currency: S.settings.currency || 'USD' }); }
  catch { curFmt = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  curFmt0 = new Intl.NumberFormat(undefined, { style: 'currency', currency: curFmt.resolvedOptions().currency, maximumFractionDigits: 0 });
}
const money = c => curFmt.format((c || 0) / 100);
const money0 = c => curFmt0.format(Math.round((c || 0) / 100));
const toCents = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? Math.round(n * 100) : 0; };
const fromCents = c => ((c || 0) / 100).toFixed(2);
const fmtMins = m => { m = Math.round(m || 0); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const hrs = m => Math.round((m / 60) * 100) / 100;

/* ───────────── state ───────────── */
const KEY = 'margin.v1';
const blank = () => ({
  v: 1,
  settings: { name: '', owner: '', email: '', phone: '', address: '', currency: 'USD', rate: 12500, tax: 0, terms: 14, prefix: 'INV-', next: 1001, theme: 'system', payNote: 'Thank you for your business. Payment due within the terms above.' },
  clients: [], jobs: [], time: [], expenses: [], invoices: [], timer: null
});
let storageOK = true;
function load() {
  try { const s = localStorage.getItem(KEY); if (s) { const d = JSON.parse(s); return { ...blank(), ...d, settings: { ...blank().settings, ...d.settings } }; } }
  catch { storageOK = false; }
  return blank();
}
let S = load();
let saveT = 0;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { if (storageOK) { storageOK = false; toast('Browser storage unavailable — use Settings › Export to keep your data'); } }
}
function commit(rerender = true) { clearTimeout(saveT); saveT = setTimeout(persist, 200); if (rerender) render(); }
addEventListener('pagehide', () => { clearTimeout(saveT); persist(); clearInterval(tickId); });

/* ───────────── selectors ───────────── */
const byId = (arr, id) => arr.find(x => x.id === id);
const client = id => byId(S.clients, id);
const job = id => byId(S.jobs, id);
const jobRate = j => j?.rate || client(j?.clientId)?.rate || S.settings.rate;
const jobMins = jid => S.time.filter(t => t.jobId === jid).reduce((a, t) => a + t.mins, 0);
const timeValue = t => Math.round(t.mins / 60 * jobRate(job(t.jobId)));
const unbilledTime = cid => S.time.filter(t => !t.billed && (!cid || job(t.jobId)?.clientId === cid));
const unbilledExp = cid => S.expenses.filter(e => e.billable && !e.billed && e.clientId && (!cid || e.clientId === cid));
const unbilledValue = cid => unbilledTime(cid).reduce((a, t) => a + timeValue(t), 0) + unbilledExp(cid).reduce((a, e) => a + e.amount, 0);
const jobUnbilled = jid => S.time.filter(t => t.jobId === jid && !t.billed).reduce((a, t) => a + timeValue(t), 0);
const jobValue = jid => S.time.filter(t => t.jobId === jid).reduce((a, t) => a + timeValue(t), 0);
function invTotals(inv) {
  const sub = inv.lines.reduce((a, l) => a + Math.round((+l.qty || 0) * (l.rate || 0)), 0);
  const tax = Math.round(sub * (+inv.tax || 0) / 100);
  return { sub, tax, total: sub + tax };
}
const invStatus = inv => inv.status === 'sent' && inv.due < today() ? 'overdue' : inv.status;
const paidInvs = () => S.invoices.filter(i => i.status === 'paid');
const openInvs = () => S.invoices.filter(i => i.status === 'sent');
const clientPaid = cid => paidInvs().filter(i => i.clientId === cid).reduce((a, i) => a + invTotals(i).total, 0);
const clientOpen = cid => openInvs().filter(i => i.clientId === cid).reduce((a, i) => a + invTotals(i).total, 0);
function monthSeries(n) {
  const out = []; const d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push({ m: dkey(x).slice(0, 7), rev: 0, exp: 0 }); }
  const idx = Object.fromEntries(out.map((o, i) => [o.m, i]));
  for (const i of paidInvs()) { const k = idx[mkey(i.paidOn || i.issued)]; if (k != null) out[k].rev += invTotals(i).total; }
  for (const e of S.expenses) { const k = idx[mkey(e.date)]; if (k != null) out[k].exp += e.amount; }
  return out;
}

/* ───────────── toast / undo ───────────── */
function toast(msg, undo) {
  const el = document.createElement('div'); el.className = 'toast';
  put(el, html`<span>${msg}</span>${undo ? raw('<button type="button">Undo</button>') : ''}`);
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); };
  $('#toasts').append(el);
  setTimeout(() => el.remove(), undo ? 6000 : 3200);
}
function removeWithUndo(label, fn) {
  const snap = JSON.stringify(S);
  fn(); commit();
  toast(`${label} deleted`, () => { S = JSON.parse(snap); commit(); });
}

/* ───────────── theme ───────────── */
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme;
  document.documentElement.dataset.theme = t === 'system' ? (mq.matches ? 'dark' : 'light') : t;
}
mq.addEventListener('change', applyTheme);

/* ───────────── generic form dialog ───────────── */
const formDlg = $('#formDlg');
function field(f) {
  const id = 'f_' + f.name;
  const req = f.required ? raw(' required') : '';
  let ctl;
  if (f.type === 'select') ctl = html`<select class="in" id="${id}" name="${f.name}"${req}>${f.options.map(o => html`<option value="${o.value}"${o.value === f.value ? raw(' selected') : ''}>${o.label}</option>`)}</select>`;
  else if (f.type === 'textarea') ctl = html`<textarea class="in" id="${id}" name="${f.name}" rows="3"${req}>${f.value ?? ''}</textarea>`;
  else if (f.type === 'checkbox') return html`<label class="check ${f.full ? 'full' : ''}"><input type="checkbox" name="${f.name}"${f.value ? raw(' checked') : ''}><span class="tx">${f.label}${f.hint ? html`<span>${f.hint}</span>` : ''}</span></label>`;
  else ctl = html`<input class="in" id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${f.value ?? ''}"${f.step ? html` step="${f.step}"` : ''}${f.min != null ? html` min="${f.min}"` : ''}${f.placeholder ? html` placeholder="${f.placeholder}"` : ''}${req}>`;
  return html`<label class="field ${f.full ? 'full' : ''}"><span>${f.label}</span>${ctl}</label>`;
}
function openForm({ title, fields, submit = 'Save', onSubmit, extra, danger }) {
  put(formDlg, html`<form novalidate>
    <div class="dlg-h"><h2>${title}</h2><button type="button" class="btn icon ghost" data-close aria-label="Close">✕</button></div>
    <div class="dlg-b"><div class="grid2">${fields.map(field)}</div>${extra || ''}</div>
    <div class="dlg-f">${danger ? html`<button type="button" class="btn ghost danger" data-danger>${danger.label}</button><span class="spacer"></span>` : ''}<button type="button" class="btn" data-close>Cancel</button><button class="btn pri">${submit}</button></div>
  </form>`);
  const form = $('form', formDlg);
  form.onsubmit = e => {
    e.preventDefault();
    for (const el of form.elements) { if (el.required && !String(el.value).trim()) { el.focus(); el.style.borderColor = 'var(--danger)'; return; } }
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; if (el) vals[f.name] = f.type === 'checkbox' ? el.checked : el.value.trim(); }
    if (onSubmit(vals, form) !== false) formDlg.close();
  };
  $$('[data-close]', form).forEach(b => b.onclick = () => formDlg.close());
  if (danger) $('[data-danger]', form).onclick = () => { formDlg.close(); danger.run(); };
  formDlg.showModal();
  const first = form.querySelector('input:not([type=checkbox]),select,textarea'); first?.focus();
  return form;
}
formDlg.addEventListener('click', e => { if (e.target === formDlg) formDlg.close(); });

const clientOpts = () => S.clients.slice().sort((a, b) => a.name.localeCompare(b.name)).map(c => ({ value: c.id, label: c.name }));
const jobOpts = (filter = j => j.status !== 'done') => S.jobs.filter(filter).map(j => ({ value: j.id, label: `${j.title} — ${client(j.clientId)?.name || '?'}` }));
const CATS = ['Software', 'Hardware', 'Travel', 'Meals', 'Contractors', 'Office', 'Marketing', 'Fees', 'Other'];

/* ───────────── entity forms ───────────── */
function clientForm(c) {
  const isNew = !c; c = c || {};
  openForm({
    title: isNew ? 'New client' : 'Edit client',
    fields: [
      { name: 'name', label: 'Company / name', value: c.name, required: true, full: true },
      { name: 'contact', label: 'Contact person', value: c.contact },
      { name: 'email', label: 'Email', type: 'email', value: c.email },
      { name: 'phone', label: 'Phone', value: c.phone },
      { name: 'rate', label: 'Hourly rate (blank = default)', type: 'number', step: '0.01', min: 0, value: c.rate ? fromCents(c.rate) : '' },
      { name: 'address', label: 'Billing address', type: 'textarea', value: c.address, full: true },
    ],
    danger: isNew ? null : { label: 'Delete client', run: () => deleteClient(c.id) },
    onSubmit(v) {
      const data = { ...v, rate: v.rate ? toCents(v.rate) : 0 };
      if (isNew) { const n = { id: uid(), created: today(), ...data }; S.clients.push(n); toast(`Added ${n.name}`); }
      else Object.assign(c, data);
      commit(); if (!isNew && $('#drawer').open) openClient(c.id);
    }
  });
}
function deleteClient(id) {
  const c = client(id); if (!c) return;
  if (S.invoices.some(i => i.clientId === id)) { toast('This client has invoices — delete those first'); return; }
  $('#drawer').close();
  removeWithUndo(c.name, () => {
    const jids = new Set(S.jobs.filter(j => j.clientId === id).map(j => j.id));
    S.time = S.time.filter(t => !jids.has(t.jobId));
    S.jobs = S.jobs.filter(j => j.clientId !== id);
    S.expenses.forEach(e => { if (e.clientId === id) e.clientId = ''; });
    S.clients = S.clients.filter(x => x.id !== id);
    if (S.timer && jids.has(S.timer.jobId)) S.timer = null;
  });
}
function needClient(next) {
  if (S.clients.length) return next();
  toast('Add a client first'); clientForm();
}
function jobForm(j, preset = {}) {
  const isNew = !j; j = j || {};
  needClient(() => openForm({
    title: isNew ? 'New job' : 'Edit job',
    fields: [
      { name: 'title', label: 'Job title', value: j.title, required: true, full: true },
      { name: 'clientId', label: 'Client', type: 'select', options: clientOpts(), value: j.clientId || preset.clientId },
      { name: 'status', label: 'Stage', type: 'select', options: STAGES.map(s => ({ value: s.id, label: s.label })), value: j.status || preset.status || 'active' },
      { name: 'due', label: 'Due date', type: 'date', value: j.due },
      { name: 'budget', label: 'Budget', type: 'number', step: '0.01', min: 0, value: j.budget ? fromCents(j.budget) : '' },
      { name: 'rate', label: 'Hourly rate (blank = client/default)', type: 'number', step: '0.01', min: 0, value: j.rate ? fromCents(j.rate) : '', full: true },
    ],
    danger: isNew ? null : { label: 'Delete job', run: () => deleteJob(j.id) },
    onSubmit(v) {
      const data = { ...v, budget: v.budget ? toCents(v.budget) : 0, rate: v.rate ? toCents(v.rate) : 0 };
      if (isNew) { const n = { id: uid(), created: today(), ...data }; S.jobs.push(n); toast(`Job “${n.title}” created`); }
      else Object.assign(j, data);
      commit(); if (!isNew && $('#drawer').open) openJob(j.id);
    }
  }));
}
function deleteJob(id) {
  const j = job(id); if (!j) return;
  if (S.time.some(t => t.jobId === id && t.billed)) { toast('This job has invoiced time — it can’t be deleted. Move it to Done instead.'); return; }
  $('#drawer').close();
  removeWithUndo(j.title, () => {
    S.time = S.time.filter(t => t.jobId !== id); S.jobs = S.jobs.filter(x => x.id !== id);
    if (S.timer?.jobId === id) S.timer = null;
  });
}
function timeForm(preset = {}) {
  const opts = jobOpts();
  if (!opts.length) { toast('Create an active job first'); return jobForm(); }
  openForm({
    title: 'Log time',
    fields: [
      { name: 'jobId', label: 'Job', type: 'select', options: opts, value: preset.jobId, full: true },
      { name: 'date', label: 'Date', type: 'date', value: today(), required: true },
      { name: 'dur', label: 'Duration (1.5, 1:30, 90m)', value: '', required: true, placeholder: '1:30' },
      { name: 'note', label: 'What did you do?', value: '', full: true },
    ],
    onSubmit(v, form) {
      const mins = parseDur(v.dur);
      if (!mins) { form.elements.dur.style.borderColor = 'var(--danger)'; form.elements.dur.focus(); return false; }
      S.time.push({ id: uid(), jobId: v.jobId, date: v.date, mins, note: v.note, billed: null });
      toast(`Logged ${fmtMins(mins)}`); commit(); if ($('#drawer').open) openJob(v.jobId);
    }
  });
}
function parseDur(s) {
  s = String(s).trim().toLowerCase(); if (!s) return 0;
  let m;
  if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
  if ((m = s.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m)?$/)) && (m[1] || m[2])) return Math.round((+m[1] || 0) * 60 + (+m[2] || 0));
  const n = parseFloat(s); return Number.isFinite(n) && n > 0 ? Math.round(n * 60) : 0;
}
function expenseForm(e) {
  const isNew = !e; e = e || {};
  openForm({
    title: isNew ? 'Log expense' : 'Edit expense',
    fields: [
      { name: 'vendor', label: 'Vendor', value: e.vendor, required: true },
      { name: 'amount', label: 'Amount', type: 'number', step: '0.01', min: 0, value: e.amount ? fromCents(e.amount) : '', required: true },
      { name: 'date', label: 'Date', type: 'date', value: e.date || today(), required: true },
      { name: 'category', label: 'Category', type: 'select', options: CATS.map(c => ({ value: c, label: c })), value: e.category || 'Software' },
      { name: 'clientId', label: 'Client (optional)', type: 'select', options: [{ value: '', label: '— None —' }, ...clientOpts()], value: e.clientId || '' },
      { name: 'note', label: 'Note', value: e.note },
      { name: 'billable', label: 'Billable to client', hint: 'Will appear when you invoice this client', type: 'checkbox', value: e.billable, full: true },
    ],
    danger: isNew ? null : { label: 'Delete', run: () => { if (e.billed) return toast('Already invoiced — remove it from the invoice first'); removeWithUndo('Expense', () => { S.expenses = S.expenses.filter(x => x.id !== e.id); }); } },
    onSubmit(v) {
      if (e.billed && (!v.billable || v.clientId !== e.clientId)) { toast('Already invoiced — billing fields locked'); v.billable = e.billable; v.clientId = e.clientId; }
      const data = { ...v, amount: toCents(v.amount), billable: v.billable && !!v.clientId };
      if (isNew) { S.expenses.push({ id: uid(), billed: null, ...data }); toast(`Expense ${money(data.amount)} logged`); }
      else Object.assign(e, data);

}
function newMenu() {
  const items = [
    ['Invoice', () => invoiceBuilder()], ['Job', () => jobForm()], ['Log time', () => timeForm()],
    ['Expense', () => expenseForm()], ['Client', () => clientForm()],
  ];

/* ───────────── timer ───────────── */
let tickId = 0;
function startTimer(jobId) {
  if (S.timer) stopTimer(true);
  S.timer = { jobId, start: Date.now() };

}
function stopTimer(silent) {
  const t = S.timer; if (!t) return;
  const mins = Math.max(1, Math.round((Date.now() - t.start) / 60000));
  S.timer = null;
  if (job(t.jobId)) S.time.push({ id: uid(), jobId: t.jobId, date: dkey(new Date(t.start)), mins, note: '', billed: null });
  commit(); if (!silent) toast(`Logged ${fmtMins(mins)} to ${job(t.jobId)?.title || 'job'}`);
  if ($('#drawer').open && $('#drawer').dataset.job === t.jobId) openJob(t.jobId);
}
function pickTimer() {
  const opts = jobOpts();
  if (!opts.length) { toast('Create an active job first'); return jobForm(); }
  openForm({ title: 'Start timer', submit: 'Start', fields: [{ name: 'jobId', label: 'Job', type: 'select', options: opts, full: true }], onSubmit: v => startTimer(v.jobId) });
}
function renderTimer() {
  const slot = $('#timerSlot'); clearInterval(tickId); tickId = 0;
  if (!S.timer) { put(slot, html`<button class="btn" id="tStart"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="hide-m">Start timer</span></button>`); $('#tStart').onclick = pickTimer; return; }
  const j = job(S.timer.jobId);
  put(slot, html`<div class="timer"><span class="dot"></span><span class="t" id="tT">0:00:00</span><span class="j">${j?.title || ''}</span><button id="tStop">Stop</button></div>`);
  $('#tStop').onclick = () => stopTimer();
  const tick = () => { const s = Math.floor((Date.now() - S.timer.start) / 1000); $('#tT').textContent = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  tick(); if (!document.hidden) tickId = setInterval(tick, 1000);
}
document.addEventListener('visibilitychange', () => { if (S.timer) renderTimer(); });

/* ───────────── charts ───────────── */
function barChart(series, { h = 200 } = {}) {
  const W = 640, H = h, pl = 46, pb = 22, pt = 8;
  const max = Math.max(1, ...series.flatMap(s => [s.rev, s.exp]));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const gw = (W - pl) / series.length, bw = Math.min(16, gw * .3);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${esc(compact(v))}</text>`;
  series.forEach((s, i) => {
    const cx = pl + gw * i + gw / 2;
    g += `<rect class="r" x="${cx - bw - 1}" y="${y(s.rev)}" width="${bw}" height="${Math.max(0, H - pb - y(s.rev))}" rx="3"><title>${esc(fmtMonth(s.m))} revenue ${esc(money(s.rev))}</title></rect>`;
    g += `<rect class="e" x="${cx + 1}" y="${y(s.exp)}" width="${bw}" height="${Math.max(0, H - pb - y(s.exp))}" rx="3"><title>${esc(fmtMonth(s.m))} expenses ${esc(money(s.exp))}</title></rect>`;
    g += `<text class="axis" x="${cx}" y="${H - 4}" text-anchor="middle">${esc(fmtMonth(s.m))}</text>`;
  });
  return raw(`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses by month">${g}</svg></div>`);
}
function niceStep(x) { const p = 10 ** Math.floor(Math.log10(x || 1)); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function compact(c) { const v = c / 100; return Math.abs(v) >= 1000 ? (v / 1000).toFixed(v >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(v)); }
const legend = () => html`<div class="legend"><span><i style="background:var(--accent)"></i>Revenue</span><span><i style="background:var(--exp)"></i>Expenses</span></div>`;

function invoiceBuilder(cid) {
  needClient(() => {
    const pickClient = () => openForm({
      title: 'New invoice', submit: 'Continue',
      fields: [{ name: 'clientId', label: 'Bill to', type: 'select', full: true, value: cid, options: clientOpts().map(o => { const v = unbilledValue(o.value); return { ...o, label: v ? `${o.label} — ${money(v)} unbilled` : o.label }; }) }],
      onSubmit(v) { setTimeout(() => step2(v.clientId)); }
    });
    const step2 = id => {
      const ts = unbilledTime(id), es = unbilledExp(id);
      if (!ts.length && !es.length) return createInvoice(id, [], []);
      const byJob = {};
      ts.forEach(t => (byJob[t.jobId] ??= []).push(t));
      const extra = html`<p class="muted" style="margin:0">Choose what to bill. Hours are grouped into one line per job.</p>
        <div>${Object.entries(byJob).map(([jid, arr]) => { const m = arr.reduce((a, t) => a + t.mins, 0); return html`<label class="check"><input type="checkbox" checked data-job="${jid}"><span class="tx">${job(jid)?.title}<span>${arr.length} entr${arr.length === 1 ? 'y' : 'ies'} · ${fmtMins(m)} @ ${money(jobRate(job(jid)))}/h</span></span><b>${money(arr.reduce((a, t) => a + timeValue(t), 0))}</b></label>`; })}
        ${es.map(e => html`<label class="check"><input type="checkbox" checked data-exp="${e.id}"><span class="tx">${e.vendor}<span>Expense · ${e.category} · ${fmtDate(e.date)}</span></span><b>${money(e.amount)}</b></label>`)}</div>`;
      openForm({
        title: `Invoice ${client(id)?.name}`, submit: 'Create draft', fields: [], extra,
        onSubmit() {
          const jids = $$('[data-job]:checked', formDlg).map(x => x.dataset.job);
          const eids = $$('[data-exp]:checked', formDlg).map(x => x.dataset.exp);
          createInvoice(id, ts.filter(t => jids.includes(t.jobId)), es.filter(e => eids.includes(e.id)));
        }
      });
    };
    cid ? step2(cid) : pickClient();
  });
}
function createInvoice(cid, times, exps) {
  const st = S.settings, id = uid();
  const lines = [];
  const byJob = {};
  times.forEach(t => (byJob[t.jobId] ??= []).push(t));
  for (const [jid, arr] of Object.entries(byJob)) {
    const j = job(jid), m = arr.reduce((a, t) => a + t.mins, 0);
    lines.push({ id: uid(), desc: `${j.title} — professional services`, qty: hrs(m), rate: jobRate(j), unit: 'hr' });
  }
  exps.forEach(e => lines.push({ id: uid(), desc: `${e.vendor}${e.note ? ' — ' + e.note : ''} (expense)`, qty: 1, rate: e.amount }));
  if (!lines.length) lines.push({ id: uid(), desc: '', qty: 1, rate: 0 });
  const inv = { id, number: st.prefix + st.next, clientId: cid, issued: today(), due: addDays(today(), +st.terms || 14), lines, tax: +st.tax || 0, status: 'draft', notes: st.payNote, timeIds: times.map(t => t.id), expIds: exps.map(e => e.id) };
  st.next = (+st.next || 1000) + 1;
  times.forEach(t => t.billed = id); exps.forEach(e => e.billed = id);
  S.invoices.push(inv); commit(false); go('invoice', id);
  toast(`Draft ${inv.number} created`);
}
function deleteInvoice(id) {
  const inv = byId(S.invoices, id); if (!inv) return;
  removeWithUndo(inv.number, () => {
    S.time.forEach(t => { if (t.billed === id) t.billed = null; });
    S.expenses.forEach(e => { if (e.billed === id) e.billed = null; });
    S.invoices = S.invoices.filter(i => i.id !== id);
    view = 'invoices';
  });
}

      { name: 'address', label: 'Address (shown on invoices)', type: 'textarea', value: s.address, full: true },
      { name: 'rate', label: 'Default hourly rate', type: 'number', step: '0.01', min: 0, value: fromCents(s.rate) },
      { name: 'currency', label: 'Currency', type: 'select', value: s.currency, options: ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'NZD', 'CHF', 'JPY', 'INR', 'MXN', 'BRL', 'ZAR', 'SEK'].map(c => ({ value: c, label: c })) },
      { name: 'tax', label: 'Default tax %', type: 'number', step: '0.1', min: 0, value: s.tax },
      { name: 'terms', label: 'Payment terms (days)', type: 'number', min: 0, value: s.terms },
      { name: 'prefix', label: 'Invoice prefix', value: s.prefix },
      { name: 'next', label: 'Next invoice number', type: 'number', min: 1, value: s.next },
      { name: 'theme', label: 'Theme', type: 'select', value: s.theme, options: [{ value: 'system', label: 'System' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }] },
      { name: 'payNote', label: 'Default invoice note', type: 'textarea', value: s.payNote, full: true },
    ],
    extra: onboarding ? '' : html`<div class="sec">Your data</div>
      <p class="muted" style="margin:0;font-size:13px">Everything lives in this browser only. Export regularly as a backup.</p>
      <div class="row"><button type="button" class="btn sm" id="sExport">Export backup (.json)</button><button type="button" class="btn sm" id="sImport">Import backup</button><button type="button" class="btn sm" id="sCsv">Export CSVs</button><span class="spacer"></span><button type="button" class="btn sm ghost danger" id="sReset">Erase all…</button></div>
      <input type="file" id="sFile" accept="application/json,.json" hidden>`,
    onSubmit(v) {
      Object.assign(s, { ...v, rate: toCents(v.rate), tax: parseFloat(v.tax) || 0, terms: parseInt(v.terms) || 0, next: parseInt(v.next) || s.next });
      commit(); if (onboarding) { toast('All set — add your first client'); setTimeout(clientForm, 50); }
    }
  });
  if (onboarding) return;
  $('#sExport').onclick = () => download(`margin-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json');
  $('#sCsv').onclick = exportCSVs;
  $('#sImport').onclick = () => $('#sFile').click();
  $('#sFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 20 * 1024 * 1024) return toast('File too large (20 MB max)');
    f.text().then(t => {
      const d = JSON.parse(t);
      if (!d || !Array.isArray(d.clients) || !Array.isArray(d.invoices) || typeof d.settings !== 'object') throw new Error('shape');
      const snap = JSON.stringify(S);
      S = { ...blank(), ...d, settings: { ...blank().settings, ...d.settings } };
      formDlg.close(); commit();
      toast(`Imported ${S.clients.length} clients, ${S.invoices.length} invoices`, () => { S = JSON.parse(snap); commit(); });
    }).catch(() => toast('That file isn’t a Margin backup'));
  };
  $('#sReset').onclick = () => {
    formDlg.close();
    openForm({
      title: 'Erase everything?', submit: 'Erase all data',
      fields: [{ name: 'confirm', label: 'Type ERASE to confirm', required: true, full: true }],
      extra: html`<p class="muted" style="margin:0">This removes all clients, jobs, time, invoices and expenses from this browser. Export a backup first if unsure.</p>`,
      onSubmit(v, form) {
        if (v.confirm !== 'ERASE') { form.elements.confirm.style.borderColor = 'var(--danger)'; return false; }
        const snap = JSON.stringify(S); S = blank(); view = 'home'; commit();
        toast('All data erased', () => { S = JSON.parse(snap); commit(); });
      }
    });
  };
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function csv(rows) { return rows.map(r => r.map(v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(',')).join('\r\n'); }
function exportCSVs() {
  const d = today();
  download(`margin-invoices-${d}.csv`, csv([['Number', 'Client', 'Issued', 'Due', 'Status', 'Paid on', 'Subtotal', 'Tax', 'Total'], ...S.invoices.map(i => { const t = invTotals(i); return [i.number, client(i.clientId)?.name, i.issued, i.due, invStatus(i), i.paidOn || '', fromCents(t.sub), fromCents(t.tax), fromCents(t.total)]; })]), 'text/csv');
  setTimeout(() => download(`margin-expenses-${d}.csv`, csv([['Date', 'Vendor', 'Category', 'Client', 'Billable', 'Note', 'Amount'], ...S.expenses.map(e => [e.date, e.vendor, e.category, client(e.clientId)?.name || '', e.billable ? 'yes' : 'no', e.note || '', fromCents(e.amount)])]), 'text/csv'), 300);
  setTimeout(() => download(`margin-time-${d}.csv`, csv([['Date', 'Client', 'Job', 'Minutes', 'Hours', 'Note', 'Invoiced'], ...S.time.map(t => { const j = job(t.jobId); return [t.date, client(j?.clientId)?.name || '', j?.title || '', t.mins, hrs(t.mins), t.note || '', t.billed ? byId(S.invoices, t.billed)?.number || 'yes' : '']; })]), 'text/csv'), 600);
  toast('Exporting 3 CSV files');
}

/* ───────────── command palette ───────────── */
const pal = $('#palette'), palQ = $('#palQ'), palList = $('#palList');
let palItems = [], palSel = 0;
function paletteItems(q) {
  const acts = [
    ['Action', 'New invoice', () => invoiceBuilder()], ['Action', 'New job', () => jobForm()], ['Action', 'New client', () => clientForm()],
    ['Action', 'Log time', () => timeForm()], ['Action', 'Log expense', () => expenseForm()],
    S.timer ? ['Action', 'Stop timer', () => stopTimer()] : ['Action', 'Start timer', () => pickTimer()],
    ['Go', 'Today', () => go('home')], ['Go', 'Work board', () => go('work')], ['Go', 'Invoices', () => go('invoices')], ['Go', 'Money', () => go('money')], ['Go', 'Clients', () => go('clients')],
    ['Action', 'Settings', () => settingsForm()], ['Action', 'Toggle dark mode', () => { S.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; commit(); }],
    ['Action', 'Export backup', () => download(`margin-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json')],
  ].map(([k, t, run]) => ({ k, t, run }));
  const ents = [
    ...S.clients.map(c => ({ k: 'Client', t: c.name, x: c.contact || '', run: () => openClient(c.id) })),
    ...S.jobs.map(j => ({ k: 'Job', t: j.title, x: client(j.clientId)?.name, run: () => openJob(j.id) })),
    ...S.invoices.map(i => ({ k: 'Invoice', t: `${i.number} · ${client(i.clientId)?.name || ''}`, x: money(invTotals(i).total), run: () => go('invoice', i.id) })),
  ];
  if (!q) return acts.slice(0, 11);
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const score = it => { const s = `${it.t} ${it.x || ''} ${it.k}`.toLowerCase(); if (!terms.every(t => s.includes(t))) return -1; return (it.t.toLowerCase().startsWith(terms[0]) ? 2 : 1) + (it.k === 'Action' ? .5 : 0); };
  return [...acts, ...ents].map(it => ({ it, s: score(it) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 30).map(x => x.it);
}
function drawPalette() {
  palItems = paletteItems(palQ.value.trim()); palSel = clamp(palSel, 0, Math.max(0, palItems.length - 1));
  put(palList, palItems.length ? html`${palItems.map((it, i) => html`<li role="option" id="po${i}" data-i="${i}" aria-selected="${i === palSel}"><span class="k">${it.k}</span><span>${it.t}</span><span class="x">${it.x || ''}</span></li>`)}` : html`<div class="empty">No matches</div>`);
  palQ.setAttribute('aria-activedescendant', palItems.length ? 'po' + palSel : '');
  $('#po' + palSel)?.scrollIntoView({ block: 'nearest' });
}
function openPalette() { if (pal.open) return; palQ.value = ''; palSel = 0; drawPalette(); pal.showModal(); palQ.focus(); }
function runPal(i) { const it = palItems[i]; if (!it) return; pal.close(); it.run(); }
palQ.oninput = () => { palSel = 0; drawPalette(); };
palQ.onkeydown = e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % Math.max(1, palItems.length); drawPalette(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + palItems.length) % Math.max(1, palItems.length); drawPalette(); }
  else if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); }
};
palList.onclick = e => { const li = e.target.closest('li'); if (li) runPal(+li.dataset.i); };
pal.addEventListener('click', e => { if (e.target === pal) pal.close(); });

/* ───────────── global wiring ───────────── */

$('#openSettings').onclick = () => settingsForm();
$('#bizName').onclick = () => settingsForm();
$('#bizName').style.cursor = 'pointer';

const mm = matchMedia('(max-width:760px)');
const mobileUI = () => { $('#mobileSearch').style.display = mm.matches ? '' : 'none'; };
mm.addEventListener('change', mobileUI); mobileUI();
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.open ? pal.close() : openPalette(); return; }
  if (e.target.closest('input,textarea,select,[contenteditable]') || $('dialog[open]') || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { '1': 'home', '2': 'work', '3': 'invoices', '4': 'money', '5': 'clients' };
  if (map[e.key]) go(map[e.key]);
  else if (e.key === '/') { e.preventDefault(); openPalette(); }
  else if (e.key === 'n') newMenu();
  else if (e.key === 't') S.timer ? stopTimer() : pickTimer();
});
