<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Claude Optimizer - Estimate & shrink prompts, check context budgets, configure MCP servers and streamline AI workflows.">
<meta name="keywords" content="Claude, AI, LLM, prompt optimizer, context budget">
<meta name="author" content="Claude Optimizer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<title>Claude Optimizer</title>
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c26;--line:#262b38;--tx:#e7e9ee;--mut:#8b93a7;--acc:#d97757;--acc2:#7aa2f7;--ok:#5fd4a0;--warn:#f2c46d;--bad:#ef6b6b;--r:14px;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f6f4ef;--panel:#fff;--panel2:#f1eee7;--line:#e2ddd2;--tx:#1c1b19;--mut:#6b675f;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}.logo b{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit}
nav button:hover{color:var(--tx)}nav button[aria-selected=true]{background:var(--panel2);border-color:var(--line);color:var(--tx)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;animation:fadeIn 0.4s ease-out forwards;transition:transform 0.2s,box-shadow 0.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 15%,transparent)}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
textarea,input,select{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace}
textarea{min-height:180px;resize:vertical}
input,textarea,select,button{transition:all 0.2s ease-in-out}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stat{display:flex;flex-direction:column}.stat .n{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat .l{color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.bar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);margin:12px 0}
.bar span{height:100%;transition:width .3s}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
label.f{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:6px 0;color:var(--mut);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin:6px 0;cursor:pointer}
.chk input{width:auto;margin-top:3px;accent-color:var(--acc)}.chk.done{opacity:.55}.chk.done b{text-decoration:line-through}
.chk small{display:block;color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.p-hi{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}.p-md{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.p-lo{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:420px;font-size:12px;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
.tbl{overflow-x:auto}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.tip{border-left:3px solid var(--acc);padding:8px 12px;background:var(--panel2);border-radius:0 10px 10px 0;margin:8px 0;font-size:13px}
.kbd{font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ Claude<b>Optimizer</b></div>
  <nav role="tablist" id="nav"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="t-compress">
  <h2>Token Compressor</h2><p class="sub">Estimate & shrink prompts, CLAUDE.md files, and memory entries before they cost context.</p>
  <div class="grid">
    <div class="card"><h3>Input</h3><textarea id="cIn" placeholder="Paste a prompt, CLAUDE.md, memory file, log output…"></textarea>
      <div class="row">
        <label class="chk" style="margin:0;padding:6px 10px"><input type="checkbox" id="oWs" checked> whitespace</label>
        <label class="chk" style="margin:0;padding:6px 10px"><input type="checkbox" id="oFill" checked> filler words</label>
        <label class="chk" style="margin:0;padding:6px 10px"><input type="checkbox" id="oCmt"> strip comments</label>
        <label class="chk" style="margin:0;padding:6px 10px"><input type="checkbox" id="oDup" checked> dedupe lines</label>
      </div></div>
    <div class="card"><h3>Output</h3><textarea id="cOut" readonly></textarea>
      <div class="row"><button class="btn" data-copy="cOut">Copy output</button></div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="stats">
    <div class="stat"><span class="n" id="sIn">0</span><span class="l">tokens in (est.)</span></div>
    <div class="stat"><span class="n" id="sOut">0</span><span class="l">tokens out</span></div>
    <div class="stat"><span class="n" id="sSave" style="color:var(--ok)">0%</span><span class="l">saved</span></div>
    <div class="stat"><span class="n" id="sChars">0</span><span class="l">chars</span></div>
  </div></div>
</template>

<template id="t-budget">
  <h2>Context Budget</h2><p class="sub">See where the window goes before the conversation even starts. Numbers are estimates — tune to your setup.</p>
  <div class="grid">
    <div class="card"><h3>Inputs (tokens)</h3><div id="bForm"></div></div>
    <div class="card"><h3>Allocation</h3>
      <div class="stats"><div class="stat"><span class="n" id="bUsed">0</span><span class="l">fixed overhead</span></div><div class="stat"><span class="n" id="bFree">0</span><span class="l">left for work</span></div><div class="stat"><span class="n" id="bPct">0%</span><span class="l">overhead</span></div></div>
      <div class="bar" id="bBar"></div><div class="legend" id="bLeg"></div>
      <div id="bTips"></div></div>
  </div>
</template>

<template id="t-settings">
  <h2>Settings Generator</h2><p class="sub">Build a <span class="kbd">.claude/settings.json</span> that cuts permission prompts, ignores junk, and caps noisy output.</p>
  <div class="grid">
    <div class="card"><h3>Options</h3><div id="sOpts"></div>
      <h3 style="margin-top:14px">Extra ignore patterns (one per line)</h3><textarea id="sIgn" style="min-height:90px">_ldetest/
.tmp.driveupload/
.playwright-mcp/
--REPOSITORIES--/</textarea></div>
    <div class="card"><h3>settings.json</h3><pre id="sJson"></pre><div class="row"><button class="btn" data-copy="sJson">Copy JSON</button><button class="btn ghost" id="sDl">Save file</button></div></div>
  </div>
</template>

<template id="t-mcp">
  <h2>MCP & Tool Auditor</h2><p class="sub">Every connected server's tool schemas occupy context. Toggle what you actually use; see the savings.</p>
  <div class="card"><div class="stats">
    <div class="stat"><span class="n" id="mAll">0</span><span class="l">tokens if all on</span></div>
    <div class="stat"><span class="n" id="mOn">0</span><span class="l">tokens kept</span></div>
    <div class="stat"><span class="n" id="mSave" style="color:var(--ok)">0</span><span class="l">tokens saved</span></div></div>
    <div class="row"><input id="mName" placeholder="server name" style="flex:2;min-width:140px"><input id="mTools" type="number" min="1" placeholder="# tools" style="flex:1;min-width:90px"><button class="btn" id="mAdd">Add server</button><button class="btn ghost" id="mReset">Reset defaults</button></div></div>
  <div class="card tbl" style="margin-top:16px"><table><thead><tr><th>Keep</th><th>Server</th><th>Tools</th><th>≈ Tokens</th><th>Advice</th><th></th></tr></thead><tbody id="mBody"></tbody></table></div>
</template>

<template id="t-play">
  <h2>Efficiency Playbook</h2><p class="sub">Habits that save the most tokens and time. Progress is saved in this browser.</p>
  <div class="card"><div class="row" style="margin:0 0 10px;justify-content:space-between"><b id="pCount"></b><button class="btn ghost" id="pClear">Reset</button></div><div class="progress"><div id="pBar"></div></div></div>
  <div class="grid" style="margin-top:16px" id="pGroups"></div>
</template>

<template id="t-prompts">
  <h2>Prompt Snippets</h2><p class="sub">Terse, high-signal directives. One click to copy.</p>
  <div class="grid" id="snips"></div>
</template>

<template id="t-pipeline">
  <h2>Prompt → Production Pipeline</h2><p class="sub">Paste an "ok" prompt. Get a production spec, an ordered build plan, a scaffold, and an audit — the same pipeline the AI toolkit runs.</p>
  <div class="card"><h3>Your prompt</h3><textarea id="plIn" style="min-height:110px" placeholder="e.g. a trucking dispatch app with loads, drivers, invoices and a map"></textarea>
    <div class="row"><button class="btn" id="plRun">Run pipeline</button><span style="color:var(--mut);font-size:12px">spec → plan → scaffold → audit</span></div></div>
  <div class="grid" style="margin-top:16px">
    <div class="card"><h3>1 · Spec</h3><pre id="plSpec"></pre><div class="row"><button class="btn ghost" data-copy="plSpec">Copy</button></div></div>
    <div class="card"><h3>2 · Build plan</h3><pre id="plPlan"></pre><div class="row"><button class="btn ghost" data-copy="plPlan">Copy</button></div></div>
    <div class="card"><h3>3 · Scaffold</h3><pre id="plScaf"></pre><div class="row"><button class="btn ghost" data-copy="plScaf">Copy HTML</button></div></div>
    <div class="card"><h3>4 · Audit of scaffold</h3><pre id="plAud"></pre></div>
  </div>
</template>

<template id="t-ai">
  <h2>AI Toolkit <span class="pill p-md">window.AI</span></h2><p class="sub">Eight pure functions an agent calls through a browser JS tool — one round trip, JSON back, no screenshots. Humans can try them below.</p>
  <div class="grid" id="aiList"></div>
  <div class="card" style="margin-top:16px"><h3>Console</h3><textarea id="aiCode" style="min-height:90px">AI.audit(`&lt;div onclick="x()"&gt;&lt;img src=a.png&gt;&lt;/div&gt;&lt;script&gt;el.innerHTML=user;localStorage.setItem('k',v)&lt;/script&gt;`)</textarea>
    <div class="row"><button class="btn" id="aiRun">Run</button><button class="btn ghost" data-copy="aiOut">Copy result</button></div><pre id="aiOut" style="margin-top:10px"></pre></div>
</template>

<script type="application/json" id="ai-manifest">
{"name":"ClaudeOptimizer.AI","usage":"Call via browser javascript tool: AI.<fn>(...). All functions are pure, sync, and return JSON-serializable objects.","tools":[
{"fn":"AI.help()","does":"List tools + signatures"},
{"fn":"AI.estimate(text)","does":"Token estimate {tokens,chars,lines}"},
{"fn":"AI.compress(text,{filler,ws,dedupe,comments})","does":"Shrink text; returns {text,before,after,saved}"},
{"fn":"AI.spec(prompt)","does":"Expand a rough prompt into a production spec (entities, features, stack, NFR gates)"},
{"fn":"AI.plan(spec|prompt)","does":"Ordered build plan with parallel batches + effort level per step"},
{"fn":"AI.scaffold(spec|prompt)","does":"Production-grade single-file HTML skeleton (theme tokens, safe DOM, storage, a11y, CRUD per entity)"},
{"fn":"AI.audit(source)","does":"Static lint for security/perf/a11y/correctness with line numbers + fixes"},
{"fn":"AI.patch(source,[{find,replace,all?}])","does":"Dry-run exact-string edits; reports missing/non-unique anchors before a real Edit"},
{"fn":"AI.gates()","does":"Ship checklist: what must be true before calling an app production-ready"}]}
</script>

<script>
"use strict";
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem("co:"+k))??d}catch{return d}},set(k,v){try{localStorage.setItem("co:"+k,JSON.stringify(v))}catch{}}};
const est=s=>Math.ceil((s.match(/[\p{L}\p{N}]+|[^\s\p{L}\p{N}]/gu)||[]).length*1.15+s.length*0.02);
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(Math.round(n));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1600)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Copied ✓")}catch{toast("Copy failed — select manually")}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b){const el=$(b.dataset.copy);copy(el.value??el.textContent)}});
const el=(tag,{dataset,...props}={},kids=[])=>{const n=Object.assign(document.createElement(tag),props);if(dataset)Object.assign(n.dataset,dataset);kids.forEach(k=>n.append(k));return n};

const TABS=[["pipeline","Pipeline"],["ai","AI Toolkit"],["compress","Compressor"],["budget","Budget"],["settings","Settings"],["mcp","MCP Audit"],["play","Playbook"],["prompts","Snippets"]];
const init={};
function show(id){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===id));
  const m=$("main");m.replaceChildren($("t-"+id).content.cloneNode(true));init[id]();store.set("tab",id);
}
TABS.forEach(([id,l])=>$("nav").append(el("button",{textContent:l,role:"tab",onclick:()=>show(id),dataset:{t:id}})));

/* ---------- Compressor ---------- */
const FILLER=/\b(please|kindly|just|really|very|basically|actually|simply|in order to|I would like you to|could you|can you|make sure to|it is important to note that|note that|feel free to|go ahead and)\b\s*/gi;
init.compress=()=>{
  const inp=$("cIn");inp.value=store.get("cin","");
  const run=()=>{let s=inp.value;store.set("cin",s);
    if($("oCmt").checked)s=s.replace(/<!--[\s\S]*?-->/g,"").replace(/^\s*(\/\/|#(?!#|\s*[A-Z]))[^\n]*$/gm,"");
    if($("oFill").checked)s=s.replace(FILLER,m=>/in order to/i.test(m)?"to ":"");
    if($("oWs").checked)s=s.replace(/[ \t]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    if($("oDup").checked){const seen=new Set;s=s.split("\n").filter(l=>{const k=l.trim().toLowerCase();if(!k)return true;if(seen.has(k))return false;seen.add(k);return true}).join("\n")}
    $("cOut").value=s;const a=est(inp.value),b=est(s);
    $("sIn").textContent=fmt(a);$("sOut").textContent=fmt(b);$("sSave").textContent=a?Math.round((1-b/a)*100)+"%":"0%";$("sChars").textContent=fmt(s.length)};
  inp.addEventListener("input",run);document.querySelectorAll("#main input[type=checkbox]").forEach(c=>c.addEventListener("change",run));run();
};

/* ---------- Budget ---------- */
const BF=[["win","Context window",200000,"#444"],["sys","System prompt + style",4000,"#d97757"],["tools","Built-in tool schemas",12000,"#e0a458"],["mcp","MCP tool schemas",18000,"#ef6b6b"],["mem","CLAUDE.md + memory",3000,"#7aa2f7"],["skills","Skill listing",4000,"#b48ead"],["files","Files you'll read",30000,"#5fd4a0"],["out","Reserved for output",16000,"#8b93a7"]];
init.budget=()=>{
  const v=store.get("budget",{});const f=$("bForm");
  BF.forEach(([k,l,d])=>{const i=el("input",{type:"number",min:0,step:1000,value:v[k]??d,id:"b_"+k});i.addEventListener("input",run);f.append(el("label",{className:"f"},[l,i]))});
  function run(){const o={};BF.forEach(([k])=>o[k]=Math.max(0,+$("b_"+k).value||0));store.set("budget",o);
    const parts=BF.slice(1),used=parts.reduce((s,[k])=>s+o[k],0),free=Math.max(0,o.win-used);
    $("bUsed").textContent=fmt(used);$("bFree").textContent=fmt(free);$("bPct").textContent=o.win?Math.round(used/o.win*100)+"%":"–";
    $("bFree").style.color=free/o.win<.3?"var(--bad)":"var(--ok)";
    $("bBar").replaceChildren(...parts.map(([k,l,,c])=>el("span",{title:l+": "+fmt(o[k]),style:`width:${o[k]/o.win*100}%;background:${c}`})));
    $("bLeg").replaceChildren(...parts.map(([k,l,,c])=>el("span",{},[el("i",{style:"background:"+c}),l+" "+fmt(o[k])])));
    const tips=[];if(o.mcp>10000)tips.push("MCP schemas are heavy — disable servers you don't use this session (see MCP Audit).");
    if(o.mem>5000)tips.push("CLAUDE.md/memory > 5k — consolidate; move detail into on-demand files.");
    if(o.files>o.win*.3)tips.push("Planned file reads are large — use Grep + offset/limit reads instead of whole files.");
    if(used/o.win>.5)tips.push("Over half the window is overhead — consider /clear between unrelated tasks.");
    if(!tips.length)tips.push("Healthy budget. Keep it lean with /compact at natural breakpoints.");
    $("bTips").replaceChildren(...tips.map(t=>el("div",{className:"tip",textContent:t})))}
  run();
};

/* ---------- Settings ---------- */
const SOPT=[["ro","Allow read-only Bash (ls, cat, git status/log/diff, grep, find)",true],["web","Allow WebFetch / WebSearch",false],["ign","Ignore node_modules, .git, dist, build, logs",true],["cap","Cap Bash output (BASH_MAX_OUTPUT_LENGTH=20000)",true],["mcpcap","Cap MCP output (MAX_MCP_OUTPUT_TOKENS=15000)",true],["deny","Deny reading .env / secrets",true],["noTele","Disable non-essential traffic",false]];
init.settings=()=>{
  const v=store.get("settings",{});const o=$("sOpts");
  SOPT.forEach(([k,l,d])=>{const c=el("input",{type:"checkbox",checked:v[k]??d,id:"s_"+k});c.addEventListener("change",run);o.append(el("label",{className:"chk"},[c,el("span",{textContent:l})]))});
  $("sIgn").value=store.get("sign",$("sIgn").value);$("sIgn").addEventListener("input",run);
  function run(){const s={};SOPT.forEach(([k])=>s[k]=$("s_"+k).checked);store.set("settings",s);store.set("sign",$("sIgn").value);
    const j={permissions:{allow:[],deny:[]},env:{}};
    if(s.ro)j.permissions.allow.push("Bash(ls:*)","Bash(cat:*)","Bash(head:*)","Bash(tail:*)","Bash(wc:*)","Bash(grep:*)","Bash(find:*)","Bash(git status:*)","Bash(git log:*)","Bash(git diff:*)","Bash(git show:*)","Read","Glob","Grep");
    if(s.web)j.permissions.allow.push("WebFetch","WebSearch");
    if(s.deny)j.permissions.deny.push("Read(./.env)","Read(./.env.*)","Read(./secrets/**)","Read(**/*.pem)","Read(**/*.key)");
    const ign=s.ign?["node_modules/","**/.git/","dist/","build/","*.log","coverage/"]:[];
    const extra=$("sIgn").value.split("\n").map(x=>x.trim()).filter(Boolean);
    ign.concat(extra).forEach(p=>j.permissions.deny.push(`Read(${p.endsWith("/")?p+"**":p})`));
    if(s.cap)j.env.BASH_MAX_OUTPUT_LENGTH="20000";
    if(s.mcpcap)j.env.MAX_MCP_OUTPUT_TOKENS="15000";
    if(s.noTele)j.env.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC="1";
    if(!j.permissions.deny.length)delete j.permissions.deny;if(!Object.keys(j.env).length)delete j.env;
    $("sJson").textContent=JSON.stringify(j,null,2)}
  $("sDl").onclick=()=>copy($("sJson").textContent).then(()=>toast("Copied — paste into .claude/settings.json"));
  run();
};

/* ---------- MCP ---------- */
const MDEF=[["claude-in-chrome",18,1,"Keep only if driving your real Chrome"],["built-in browser",20,1,"Needed for previews / web checks"],["google-workspace",15,0,"Enable per-session when doing Gmail/Drive"],["figma",30,0,"Heavy — enable only for design work"],["openseo",45,0,"Very heavy — SEO sessions only"],["canva",40,0,"Heavy — design sessions only"],["gmail",30,0,"Duplicate of google-workspace?"],["context7 docs",2,1,"Cheap, high value — keep"],["replit",13,0,"Rarely needed"],["desktop-commander",20,0,"Overlaps Bash/Read — usually redundant"]];
const PER_TOOL=380;
init.mcp=()=>{
  let rows=store.get("mcp",null)||MDEF.map(([n,t,k,a])=>({n,t,k:!!k,a}));
  const save=()=>{store.set("mcp",rows);draw()};
  function draw(){const b=$("mBody");b.replaceChildren();let all=0,on=0;
    rows.forEach((r,i)=>{const tok=r.t*PER_TOOL;all+=tok;if(r.k)on+=tok;

    $("plScaf").textContent=sc;$("plAud").textContent=`score ${a.score}/100 · HIGH ${a.counts.HIGH} · MED ${a.counts.MED} · LOW ${a.counts.LOW}\n\n`+a.findings.map(f=>`[${f.sev}] L${f.line} ${f.msg} → ${f.fix}`).join("\n")};
  if(i.value)$("plRun").click()};
init.ai=()=>{AI.help().tools.forEach(t=>$("aiList").append(el("div",{className:"card"},[el("h3",{textContent:t.fn}),el("p",{textContent:t.does,style:"margin:0"})])));
  $("aiRun").onclick=()=>{let r;try{r=Function("AI",'"use strict";return ('+$("aiCode").value+")")(AI)}catch(e){r={error:String(e)}}$("aiOut").textContent=JSON.stringify(r,null,2)}};

show(TABS.some(t=>t[0]===store.get("tab"))?store.get("tab"):"pipeline");
</script>
