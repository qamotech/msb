<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmojiKit — Free Emoji Library & Customizer</title>
<meta name="description" content="Free, dependency-free emoji library and image customizer for developers and AI. Search, copy, export PNG/SVG/JSON.">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3242;
  --fg:#e6edf3; --dim:#8b98a9; --acc:#4c8dff; --ok:#2ea043;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button:hover{border-color:#3d4a60;background:#222a38}
button:active{transform:translateY(1px)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3444;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

header{
  position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:rgba(13,17,23,.9);backdrop-filter:blur(10px);
}
header h1{margin:0;font-size:15px;letter-spacing:.4px;font-weight:700;white-space:nowrap}
header h1 span{color:var(--acc)}
#q{flex:1 1 240px;min-width:160px}
.hdr-lab{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;white-space:nowrap}
.hdr-lab select{padding:5px 7px;font-size:12px}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;padding:14px;align-items:start}
@media(max-width:920px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}

/* ---- category chips ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;color:var(--dim)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- emoji grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:3px}
.cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;padding:0;background:transparent;border:1px solid transparent;border-radius:8px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  transition:background .08s,border-color .08s;
}
.cell:hover{background:var(--panel2);border-color:var(--line)}
.cell.sel{border-color:var(--acc);background:#16233b}
.count{color:var(--dim);font-size:12px;margin-top:10px;font-family:var(--mono)}

/* ---- studio ---- */
.studio{position:sticky;top:64px;display:flex;flex-direction:column;gap:12px}
@media(max-width:920px){.studio{position:static}}
.stage{
  display:flex;align-items:center;justify-content:center;min-height:190px;padding:12px;border-radius:10px;
  border:1px solid var(--line);
  background-image:
    linear-gradient(45deg,#1a2130 25%,transparent 25%),
    linear-gradient(-45deg,#1a2130 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#1a2130 75%),
    linear-gradient(-45deg,transparent 75%,#1a2130 75%);
  background-size:18px 18px;
  background-position:0 0,0 9px,9px -9px,-9px 0;
}
#cv{max-width:100%;max-height:210px;display:block;image-rendering:auto}
.ctrls{display:flex;flex-direction:column;gap:9px}
.ctl{display:grid;grid-template-columns:66px 1fr 52px;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.ctl input[type=range]{width:100%;accent-color:var(--acc);padding:0;background:none;border:0}
.ctl .val{font-family:var(--mono);font-size:11px;text-align:right;color:var(--fg)}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;padding:0;background:var(--panel2)}
.sw.on{border-color:var(--acc)}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
textarea{width:100%;height:118px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre;overflow:auto}
.sect-title{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);font-weight:600}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:#1f2937;border:1px solid var(--line);color:var(--fg);
  padding:9px 16px;border-radius:10px;font-size:13px;pointer-events:none;
  opacity:0;transition:opacity .16s,transform .16s;z-index:100;box-shadow:0 8px 26px #0008;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--dim);font-size:11px}
a{color:var(--acc)}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

<header>
  <h1>Emoji<span>Kit</span></h1>
  <input id="q" type="search" placeholder="Search emoji…  ( / to focus )" autocomplete="off" spellcheck="false">
  <span class="hdr-lab">copy as
    <select id="fmt">
      <option value="char">Emoji</option>
      <option value="name">Name</option>
      <option value="codepoints">Codepoints</option>
      <option value="html">HTML entity</option>
      <option value="js">JS escape</option>
      <option value="python">Python escape</option>
      <option value="json">JSON string</option>
      <option value="url">URL encoded</option>
    </select>
  </span>
  <button id="json" title="Download the whole library as JSON">⬇ emoji.json</button>
</header>

<main class="wrap">
  <section class="panel">
    <div class="chips" id="cats"></div>
    <div class="grid" id="grid"></div>
    <div class="count" id="count"></div>
  </section>

  <aside class="panel studio">
    <div class="stage"><canvas id="cv" width="128" height="128"></canvas></div>

    <div class="rowbtns">
      <button id="copyPng">📋 Copy PNG</button>
      <button id="dlPng">⬇ PNG</button>
      <button id="dlSvg">⬇ SVG</button>
    </div>

    <hr class="sep">

    <div class="ctrls">
      <div class="ctl"><span>Size</span><input id="size" type="range" min="16" max="1024" step="1" value="256"><span class="val" id="sizeV">256</span></div>
      <div class="ctl"><span>Padding</span><input id="pad" type="range" min="0" max="40" step="1" value="10"><span class="val" id="padV">10%</span></div>
      <div class="ctl"><span>Radius</span><input id="rad" type="range" min="0" max="50" step="1" value="18"><span class="val" id="radV">18%</span></div>
    </div>

    <div class="rowbtns" style="align-items:center">
      <label class="tog"><input type="checkbox" id="bgOn"> background</label>
      <input type="color" id="bgCol" value="#1f6feb" style="width:38px;height:28px;padding:2px">
      <label class="tog"><input type="checkbox" id="circle"> circle</label>
      <button id="reset" style="margin-left:auto">Reset</button>
    </div>

    <div class="sect-title">Skin tone</div>
    <div class="swatches" id="tones"></div>

    <hr class="sep">

    <div class="sect-title">Export snippet</div>
    <div class="rowbtns">
      <select id="kind" style="flex:1">
        <option value="html">HTML &lt;img&gt;</option>
        <option value="css">CSS background</option>
        <option value="react">React component</option>
        <option value="svg">SVG</option>
        <option value="base64">Raw base64</option>
        <option value="uri">Data URI</option>
      </select>
      <button id="copySnip">📋 Copy</button>
    </div>
    <textarea id="snip" readonly spellcheck="false"></textarea>
    <div class="muted">Everything runs locally. No network, no dependencies, no tracking.</div>
  </aside>
</main>

<div id="toast"></div>

/* ============================================================
   2. PARSER + UTILITIES
   ============================================================ */
const CATS = {s:'Smileys',p:'People',n:'Nature',f:'Food',t:'Travel',a:'Activity',o:'Objects',y:'Symbols',g:'Flags'};

const EMOJI = RAW.trim().split('\n').filter(Boolean).map((line,i)=>{
  const p = line.split('|');
  return { c:p[0], n:p[1]||'', k:p[2]||'', cat:p[3]||'s', i };
});
// precomputed search blob
for (const e of EMOJI) e.q = (e.n+' '+e.k).toLowerCase();

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* --- codepoint conversions --- */
const cps     = s => [...s].map(c=>'U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')).join(' ');
const toHtml  = s => [...s].map(c=>'&#x'+c.codePointAt(0).toString(16).toUpperCase()+';').join('');
const toJs    = s => [...s].map(c=>'\\u{'+c.codePointAt(0).toString(16).toUpperCase()+'}').join('');
const toPy    = s => [...s].map(c=>'\\U'+c.codePointAt(0).toString(16).toUpperCase().padStart(8,'0')).join('');
const toJson  = s => { let o=''; for(const ch of s){ const cp=ch.codePointAt(0);
  if(cp>0xFFFF){ const h=0xD800+((cp-0x10000)>>10), l=0xDC00+((cp-0x10000)&0x3FF);
    o+='\\u'+h.toString(16).padStart(4,'0')+'\\u'+l.toString(16).padStart(4,'0'); }
  else o+='\\u'+cp.toString(16).padStart(4,'0'); } return '"'+o+'"'; };
const toUrl   = s => encodeURIComponent(s);
const slug    = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function formatEmoji(ch, name, fmt){
  switch(fmt){
    case 'name':       return name || ch;
    case 'codepoints': return cps(ch);
    case 'html':       return toHtml(ch);
    case 'js':         return toJs(ch);
    case 'python':     return toPy(ch);
    case 'json':       return toJson(ch);
    case 'url':        return toUrl(ch);
    default:           return ch;
  }
}

/* --- skin tones --- */
const TONES = ['','🏻','🏼','🏽','🏾','🏿'];
const TONE_BASES = new Set([...'👋🤚🖐✋🖖👌🤌🤏✌🤞🤟🤘🤙👈👉👆👇☝👍👎✊👊🤛🤜👏🙌👐🤲🙏✍💅🤳💪🦵🦶👂👃👶🧒👦👧🧑👱👨🧔👩🧓👴👵🙍🙎🙅🙆💁🙋🧏🙇🤦🤷👮🕵💂🥷👷🤴👸👳👲🧕🤵👰🤰🤱👼🎅🤶🦸🦹🧙🧚🧛🧜🧝🧞🧟💆💇🚶🧍🧎🏃💃🕺🧖🧗🏇⛷🏂🏌🏄🚣🏊⛹🏋🚴🚵🤸🤼🤽🤾🤹🧘🛀🛌👭👫👬💏💑']);
function applyTone(ch, tone){
  if(!tone) return ch;
  const a = [...ch];
  if(!TONE_BASES.has(a[0])) return ch;
  return a[0] + tone + a.slice(1).join('').replace(/\uFE0F/g,'');
}

/* ============================================================
   3. STATE
   ============================================================ */
const state = { emoji:'😀', name:'grinning face', tone:'', size:256, pad:.10, rad:.18, bgOn:false, bg:'#1f6feb', circle:false };

const canvas = $('#cv'), ctx = canvas.getContext('2d');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla","EmojiOne Color",sans-serif';

function current(){ return applyTone(state.emoji, state.tone); }

function roundRect(c,x,y,w,h,r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath();
  if(c.roundRect) c.roundRect(x,y,w,h,r);
  else {
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
}

/* ============================================================
   4. RENDER
   ============================================================ */
function draw(){
  const S = state.size;
  canvas.width = canvas.height = S;
  ctx.clearRect(0,0,S,S);

  if(state.bgOn){
    ctx.fillStyle = state.bg;
    roundRect(ctx, 0, 0, S, S, state.circle ? S/2 : S*state.rad);
    ctx.fill();
  }

  const ch = current();
  const pad = S * state.pad;
  const fs  = Math.max(1, S - pad*2);
  ctx.font = fs + 'px ' + EMOJI_FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#000';

  const m = ctx.measureText(ch);
  const asc  = m.actualBoundingBoxAscent  ?? fs*0.80;
  const desc = m.actualBoundingBoxDescent ?? fs*0.20;
  ctx.fillText(ch, S/2, S/2 + (asc - desc)/2);

  updateSnippet();
}

/* ============================================================
   5. GRID
   ============================================================ */
const grid = $('#grid'), countEl = $('#count');
let activeCat = 'all', query = '';

function buildChips(){
  const box = $('#cats');
  const mk = (key,label)=>{
    const b = document.createElement('button');
    b.className = 'chip' + (key===activeCat?' on':'');
    b.textContent = label; b.dataset.cat = key;
    b.onclick = ()=>{ activeCat = key; $$('.chip').forEach(c=>c.classList.toggle('on', c.dataset.cat===key)); renderGrid(); };
    return b;
  };
  box.appendChild(mk('all','All'));
  for(const k in CATS) box.appendChild(mk(k, CATS[k]));
}

function matches(e){
  if(activeCat!=='all' && e.cat!==activeCat) return false;
  if(!query) return true;
  return e.q.includes(query) || e.c === query;
}

function renderGrid(){
  const list = EMOJI.filter(matches);
  const frag = document.createDocumentFragment();
  for(const e of list){
    const b = document.createElement('button');
    b.className = 'cell' + (e.c===state.emoji ? ' sel' : '');
    b.textContent = e.c;
    b.title = e.n + '  ·  ' + cps(e.c);
    b.dataset.c = e.c;
    b.onclick = ()=> pick(e);
    b.oncontextmenu = ev=>{ ev.preventDefault(); pick(e, true); };
    frag.appendChild(b);
  }
  grid.replaceChildren(frag);
  countEl.textContent = list.length.toLocaleString() + ' / ' + EMOJI.length.toLocaleString() + ' emoji';
}

function pick(e, silentSelect){
  state.emoji = e.c;
  state.name  = e.n;
  if(!silentSelect){
    $$('.cell.sel').forEach(n=>n.classList.remove('sel'));
    const cur = grid.querySelector('.cell[data-c="'+CSS.escape(e.c)+'"]');
    if(cur) cur.classList.add('sel');
    draw();
  }
  copyText(formatEmoji(applyTone(e.c, state.tone), e.n, $('#fmt').value), 'Copied ' + e.c + '  ·  ' + e.n);
}

/* ============================================================
   6. CONTROLS
   ============================================================ */
function bindRange(id, key, fmt, scale){
  const el = $('#'+id), out = $('#'+id+'V');
  el.addEventListener('input', ()=>{
    const v = +el.value;
    state[key] = scale ? v/100 : v;
    out.textContent = fmt(v);
    draw();
  });
}
bindRange('size','size', v=>v, false);
bindRange('pad','pad',  v=>v+'%', true);
bindRange('rad','rad',  v=>v+'%', true);

$('#bgOn').addEventListener('change', e=>{ state.bgOn = e.target.checked; draw(); });
$('#bgCol').addEventListener('input', e=>{ state.bg = e.target.value; state.bgOn = true; $('#bgOn').checked = true; draw(); });
$('#circle').addEventListener('change', e=>{ state.circle = e.target.checked; draw(); });
$('#reset').addEventListener('click', ()=>{
  Object.assign(state,{size:256,pad:.10,rad:.18,bgOn:false,bg:'#1f6feb',circle:false,tone:''});
  $('#size').value=256; $('#sizeV').textContent='256';
  $('#pad').value=10;   $('#padV').textContent='10%';
  $('#rad').value=18;   $('#radV').textContent='18%';
  $('#bgOn').checked=false; $('#circle').checked=false;
  renderTones(); draw();
});

/* tone swatches */
function renderTones(){
  const box = $('#tones'); box.replaceChildren();
  TONES.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'sw' + (t===state.tone?' on':'');
    b.textContent = applyTone('✋', t) || '✋';
    b.title = i===0 ? 'Default' : 'Skin tone ' + i;
    b.onclick = ()=>{ state.tone = t; renderTones(); draw();
      $$('.cell.sel').forEach(n=>n.classList.remove('sel'));
      const cur = grid.querySelector('.cell[data-c="'+CSS.escape(state.emoji)+'"]');
      if(cur) cur.classList.add('sel');
    };
    box.appendChild(b);
  });
}

/* ============================================================
   7. EXPORT
   ============================================================ */
function pngBlob(){ return new Promise(r=>canvas.toBlob(r,'image/png')); }

async function copyPng(){
  try{
    const blob = await pngBlob();
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast('PNG copied to clipboard');
  }catch(err){
    toast('Clipboard blocked — use ⬇ PNG');
  }
}

function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

async function downloadPng(){
  const blob = await pngBlob();
  download('emoji-'+slug(state.name)+'-'+state.size+'.png', blob);
  toast('PNG downloaded');
}

function svgString(){
  const S = state.size, pad = S*state.pad, fs = Math.max(1, S - pad*2);
  const bg = state.bgOn
    ? `<rect width="${S}" height="${S}" rx="${state.circle ? S/2 : S*state.rad}" fill="${state.bg}"/>`
    : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
${bg}
<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
      font-size="${fs}" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">${current()}</text>
</svg>`;
}

function downloadSvg(){
  download('emoji-'+slug(state.name)+'.svg', svgString(), 'image/svg+xml');
  toast('SVG downloaded');
}

function buildSnippet(kind){
  const uri = canvas.toDataURL('image/png');
  const S = state.size, alt = state.name || 'emoji', cls = 'emoji-'+slug(state.name);
  switch(kind){
    case 'html':
      return `<img src="${uri}"\n     width="${S}" height="${S}"\n     alt="${alt}">`;
    case 'css':
      return `.${cls} {\n  width: ${S}px;\n  height: ${S}px;\n  background: url("${uri}") center / contain no-repeat;\n}`;
    case 'react':
      return `export function Emoji(props) {\n  return (\n    <img\n      src="${uri}"\n      width={${S}}\n      height={${S}}\n      alt="${alt}"\n      {...props}\n    />\n  );\n}`;
    case 'svg':
      return svgString();
    case 'base64':
      return uri.split(',')[1];
    case 'uri':
      return uri;
    default:
      return '';
  }
}

function updateSnippet(){ $('#snip').value = buildSnippet($('#kind').value); }
$('#kind').addEventListener('change', updateSnippet);

$('#copySnip').addEventListener('click', ()=> copyText($('#snip').value, 'Snippet copied'));
$('#copyPng').addEventListener('click', copyPng);
$('#dlPng').addEventListener('click', downloadPng);
$('#dlSvg').addEventListener('click', downloadSvg);

/* whole-library JSON */
$('#json').addEventListener('click', ()=>{
  const out = EMOJI.map(e=>({
    emoji: e.c,
    name: e.n,
    keywords: e.k ? e.k.split(' ').filter(Boolean) : [],
    category: CATS[e.cat] || e.cat,
    codepoints: cps(e.c),
    html: toHtml(e.c),
    js: toJs(e.c),
    python: toPy(e.c),
    url: toUrl(e.c)
  }));
  download('emoji.json', JSON.stringify({version:1, count:out.length, emoji:out}, null, 1), 'application/json');
  toast('emoji.json downloaded (' + out.length + ' entries)');
});

/* ============================================================
   8. SEARCH / CLIPBOARD / TOAST
   ============================================================ */
let searchTimer;
$('#q').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const v = e.target.value.trim().toLowerCase();
  searchTimer = setTimeout(()=>{ query = v; renderGrid(); }, 60);
});

document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key === '/' && !typing){ e.preventDefault(); $('#q').focus(); }
  if(e.key === 'Escape'){ $('#q').value=''; query=''; renderGrid(); $('#q').blur(); }
});

async function copyText(text, msg){
  try{
    await navigator.clipboard.writeText(text);
  }catch(_){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(__){}
    ta.remove();
  }
  if(msg) toast(msg);
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 1400);
}

/* ============================================================
   9. BOOT
   ============================================================ */
buildChips();
renderGrid();
renderTones();
draw();
